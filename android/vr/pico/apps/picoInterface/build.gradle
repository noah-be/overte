plugins {
    id 'com.android.application'
}

def qtConanData = file('../../../../common/conan/pico4-debug/generators/Qt5-debug-armv8-data.cmake')
def qtPackageMatch = qtConanData.text =~ /set\(qt_PACKAGE_FOLDER_DEBUG "([^"]+)"\)/
if (!qtPackageMatch.find()) {
    throw new GradleException("Could not determine the Pico Qt package from ${qtConanData}")
}
def qtPackageDir = file(qtPackageMatch.group(1))
def picoQtRuntimeDir = layout.buildDirectory.dir('generated/picoQtRuntime')
def androidRuntimeOverrides = file('../../../../common/runtime-overrides/arm64-v8a')
def androidReleaseTbb = new File(
    androidRuntimeOverrides, 'libtbb.so'
)
def androidPatchedQtCore = new File(
    androidRuntimeOverrides, 'libQt5Core_arm64-v8a.so'
)
def androidPatchedQtPlatform = new File(
    androidRuntimeOverrides, 'libplugins_platforms_qtforandroid_arm64-v8a.so'
)
def picoOpenSslDir = file('../../../../common/conan/pico4-debug/conanlibs/Debug')

tasks.register('preparePicoQtRuntime', Copy) {
    doFirst {
        // Older builds staged the runtime plugin under a name that Android's
        // PluginManager does not scan. Do not let that stale file leak into
        // incremental APK builds or collide with CMake's native output.
        delete picoQtRuntimeDir.map { it.file('arm64-v8a/libopenxr.so') }
    }
    into picoQtRuntimeDir.map { it.dir('arm64-v8a') }
    from(new File(qtPackageDir, 'plugins/platforms')) {
        include 'libplugins_platforms_qtforandroid_arm64-v8a.so'
        exclude { androidPatchedQtPlatform.exists() }
    }
    from(androidPatchedQtPlatform.parentFile) {
        include androidPatchedQtPlatform.name
    }
    from(new File(qtPackageDir, 'plugins/bearer')) {
        include 'libplugins_bearer_qandroidbearer_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'plugins/imageformats')) {
        include 'libplugins_imageformats_qjpeg_arm64-v8a.so'
        include 'libplugins_imageformats_qsvg_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'plugins/audio')) {
        include 'libplugins_audio_qtaudio_opensles_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'lib')) {
        include 'libQt5QuickParticles_arm64-v8a.so'
    }
    // Qt's Android OpenSSL resolver deliberately looks for suffixed 1.1
    // library names so it cannot accidentally load Android's system OpenSSL.
    from(picoOpenSslDir) {
        include 'libcrypto.so.1.1'
        rename { 'libcrypto_1_1.so' }
    }
    from(picoOpenSslDir) {
        include 'libssl.so.1.1'
        rename { 'libssl_1_1.so' }
    }
    from(new File(qtPackageDir, 'qml/Qt/labs/settings')) {
        include 'libqml_Qt_labs_settings_qmlsettingsplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQml')) {
        include 'libqml_QtQml_qmlplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQml/Models.2')) {
        include 'libqml_QtQml_Models.2_modelsplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQml/WorkerScript.2')) {
        include 'libqml_QtQml_WorkerScript.2_workerscriptplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick.2')) {
        include 'libqml_QtQuick.2_qtquick2plugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Controls.2')) {
        include 'libqml_QtQuick_Controls.2_qtquickcontrols2plugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Controls')) {
        include 'libqml_QtQuick_Controls_qtquickcontrolsplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Dialogs')) {
        include 'libqml_QtQuick_Dialogs_dialogplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Dialogs/Private')) {
        include 'libqml_QtQuick_Dialogs_Private_dialogsprivateplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/PrivateWidgets')) {
        include 'libqml_QtQuick_PrivateWidgets_widgetsplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/Qt/labs/folderlistmodel')) {
        include 'libqml_Qt_labs_folderlistmodel_qmlfolderlistmodelplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Templates.2')) {
        include 'libqml_QtQuick_Templates.2_qtquicktemplates2plugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Layouts')) {
        include 'libqml_QtQuick_Layouts_qquicklayoutsplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtQuick/Window.2')) {
        include 'libqml_QtQuick_Window.2_windowplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtGraphicalEffects')) {
        include 'libqml_QtGraphicalEffects_qtgraphicaleffectsplugin_arm64-v8a.so'
    }
    from(new File(qtPackageDir, 'qml/QtGraphicalEffects/private')) {
        include 'libqml_QtGraphicalEffects_private_qtgraphicaleffectsprivate_arm64-v8a.so'
    }
    from(file('../../../../common/conan/pico4-debug/conanlibs/Debug')) {
        include 'libQt5Contacts_arm64-v8a.so',
            'libQt5DocGallery_arm64-v8a.so',
            'libQt5Feedback_arm64-v8a.so',
            'libQt5Organizer_arm64-v8a.so',
            'libQt5PositioningQuick_arm64-v8a.so',
            'libQt5VersitOrganizer_arm64-v8a.so',
            'libQt5Versit_arm64-v8a.so'
    }
    from({
        def plugins = fileTree(new File(projectDir, '.cxx')) {
            include '**/interface/Debug/plugins/libopenxr.so',
                '**/interface/RelWithDebInfo/plugins/libopenxr.so'
        }.files
        def newestPlugin = plugins ? plugins.max { it.lastModified() } : null
        newestPlugin ?: []
    }) {
        // PluginManager only scans libplugins_lib*.so on Android.
        rename 'libopenxr.so', 'libplugins_libopenxr.so'
    }
}

android {
    namespace 'org.overte.pico'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.overte.pico'
        minSdk 26
        targetSdk 35
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DHIFI_ANDROID=1',
                    '-DHIFI_ANDROID_APP=picoInterface',
                    '-DHIFI_ANDROID_PRECOMPILED=' + file('../../pico-precompiled-compat').absolutePath,
                    '-DANDROID_STL=c++_shared',
                    '-DCMAKE_C_FLAGS=-O2 -falign-functions=32 -fPIC',
                    '-DCMAKE_CXX_FLAGS=-O2 -falign-functions=32 -fPIC',
                    '-DCMAKE_CXX_SCAN_FOR_MODULES=OFF',
                    '-DCMAKE_PROJECT_INCLUDE_BEFORE=' + file('../../../../common/cmake/pico-bootstrap.cmake').absolutePath,
                    '-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON',
                    // The checksum-pinned Pico bundle contains Conan Debug
                    // imports. Release APKs compile Overte as RelWithDebInfo
                    // while deliberately reusing those verified dependencies.
                    '-DCMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=Debug',
                    '-DCMAKE_PREFIX_PATH=' + file('../../../../common/conan/pico4-debug/generators').absolutePath,
                    '-DCMAKE_MODULE_PATH=' + file('../../../../common/cmake/pico-modules').absolutePath + ';' +
                        file('../../../../common/conan/pico4-debug/generators').absolutePath,
                    '-DRELEASE_NUMBER=' + rootProject.ext.appVersionName,
                    '-DRELEASE_TYPE=' + rootProject.ext.releaseType,
                    '-DSTABLE_BUILD=' + rootProject.ext.stableBuild,
                    '-DDISABLE_QML=OFF',
                    '-DDISABLE_KTX_CACHE=OFF',
                    '-DUSE_BREAKPAD=OFF'
                targets 'picoInterface'
            }
        }
    }

    signingConfigs {
        release {
            def required = ['PICO_RELEASE_STORE_FILE', 'PICO_RELEASE_STORE_PASSWORD',
                            'PICO_RELEASE_KEY_ALIAS', 'PICO_RELEASE_KEY_PASSWORD']
            if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                required.each { name ->
                    if (!providers.gradleProperty(name).isPresent()) {
                        throw new GradleException("Missing protected Pico signing property: ${name}")
                    }
                }
                storeFile file(providers.gradleProperty('PICO_RELEASE_STORE_FILE').get())
                storePassword providers.gradleProperty('PICO_RELEASE_STORE_PASSWORD').get()
                keyAlias providers.gradleProperty('PICO_RELEASE_KEY_ALIAS').get()
                keyPassword providers.gradleProperty('PICO_RELEASE_KEY_PASSWORD').get()
                enableV1Signing false
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDir '../../../../common/libraries/qt/src/main/java'
            jniLibs.srcDirs '../../../../common/libraries/qt/libs', 'src/main/jniLibs',
                picoQtRuntimeDir
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'BACKTRACE_URL', '""'
            buildConfigField 'String', 'BACKTRACE_TOKEN', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_ID', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '""'
            buildConfigField 'String', 'OAUTH_REDIRECT_URI', '""'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            buildConfigField 'String', 'BACKTRACE_URL', '""'
            buildConfigField 'String', 'BACKTRACE_TOKEN', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_ID', '""'
            buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '""'
            buildConfigField 'String', 'OAUTH_REDIRECT_URI', '""'
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('../../../../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        // The runtime unpacks these CMake-produced assets into its cache on startup.
        // Ensure they are generated before merging and include the manifest expected
        // by HifiUtils.upackAssets().
        def nativeResourcesRcc = fileTree(new File(projectDir, '.cxx')) {
            include '**/android/vr/pico/apps/picoInterface/libraries/interface/resources.rcc'
        }
        variant.externalNativeBuildTasks.each { task ->
            variant.mergeResources.dependsOn(task)
            variant.mergeAssets.dependsOn(task)
        }
        variant.mergeAssets.inputs.files(nativeResourcesRcc)
        variant.mergeAssets.inputs.dir(file("${projectDir}/../../../../../interface/resources"))
        // System scripts are copied into the merged asset directory below.
        // Declare them as task inputs so incremental builds do not silently
        // package stale controller/UI logic after a script-only change.
        variant.mergeAssets.inputs.dir(file("${projectDir}/../../../../../scripts"))

        variant.mergeAssets.doLast {
            def assetList = new LinkedList<String>()
            def youngestLastModified = 0
            def mergedAssetsDir = outputDir.get().asFile
            def generatedResourcesRcc = nativeResourcesRcc.files.max { it.lastModified() }
            if (generatedResourcesRcc == null) {
                throw new GradleException('The native build did not generate resources.rcc')
            }

            copy {
                from new File(projectDir, '../../../../../interface/compiledResources')
                into mergedAssetsDir
                duplicatesStrategy DuplicatesStrategy.INCLUDE
                eachFile { details ->
                    youngestLastModified = Math.max(youngestLastModified, details.lastModified)
                    assetList.add(details.path)
                }
            }

            copy {
                // CMake's post-build copy is not run when only resources.rcc
                // changes. Select the freshly generated RCC directly instead
                // of silently packaging the stale obj-directory copy.
                from generatedResourcesRcc
                into mergedAssetsDir
                eachFile { details ->
                    youngestLastModified = Math.max(youngestLastModified, details.lastModified)
                    assetList.add(details.path)
                }
            }

            copy {
                from new File(projectDir, '../../../../../interface/resources/serverless')
                into new File(mergedAssetsDir, 'resources/serverless')
                eachFile { details ->
                    youngestLastModified = Math.max(youngestLastModified, details.lastModified)
                    assetList.add('resources/serverless/' + details.path)
                }
            }

            copy {
                from new File(qtPackageDir, 'qml/Qt/labs/settings/qmldir')
                into new File(mergedAssetsDir, 'qml/Qt/labs/settings')
            }

            copy {
                from new File(qtPackageDir, 'qml/QtQml')
                into new File(mergedAssetsDir, 'qml/QtQml')
                exclude '**/*.so'
            }

            copy {
                from new File(qtPackageDir, 'qml/QtQuick.2')
                into new File(mergedAssetsDir, 'qml/QtQuick.2')
                exclude '**/*.so'
            }

            ['QtQuick/Controls', 'QtQuick/Controls.2', 'QtQuick/Dialogs',
             'QtQuick/PrivateWidgets', 'QtQuick/Templates.2', 'QtQuick/Layouts',
             'QtQuick/Window.2', 'Qt/labs/folderlistmodel',
             'QtGraphicalEffects'].each { modulePath ->
                copy {
                    from new File(qtPackageDir, "qml/${modulePath}")
                    into new File(mergedAssetsDir, "qml/${modulePath}")
                    exclude '**/*.so'
                }
            }

            // Android Qt plugins resolve their QML implementation files below
            // qrc:/android_rcc_bundle/qml, even when the modules were also
            // extracted to QML2_IMPORT_PATH. androiddeployqt normally creates
            // this bundle; this custom Pico build has to create it explicitly.
            def qmlQrcFile = new File(buildDir, 'generated/pico-qml.qrc')
            qmlQrcFile.parentFile.mkdirs()
            qmlQrcFile.withWriter { out ->
                out.println('<RCC><qresource>')
                fileTree(new File(mergedAssetsDir, 'qml')).files.sort().each { qmlFile ->
                    def relativePath = mergedAssetsDir.toPath().relativize(qmlFile.toPath()).toString()
                    out.println("<file alias=\"${relativePath}\">${qmlFile.absolutePath}</file>")
                }
                out.println('</qresource></RCC>')
            }
            def qmlRccFile = new File(mergedAssetsDir, 'android_rcc_bundle.rcc')
            exec {
                commandLine new File(qtPackageDir, 'bin/rcc').absolutePath,
                    '--binary', '--root', '/android_rcc_bundle',
                    '--output', qmlRccFile.absolutePath, qmlQrcFile.absolutePath
            }
            youngestLastModified = Math.max(youngestLastModified, qmlRccFile.lastModified())
            assetList.add('android_rcc_bundle.rcc')

            copy {
                from new File(projectDir, '../../../../../scripts')
                into new File(mergedAssetsDir, 'scripts')
                duplicatesStrategy DuplicatesStrategy.INCLUDE
                eachFile { details ->
                    youngestLastModified = Math.max(youngestLastModified, details.lastModified)
                    assetList.add('scripts/' + details.path)
                }
            }

            new File(mergedAssetsDir, 'cache_assets.txt').withWriter { out ->
                out.println(Long.toString(youngestLastModified))
                assetList.each { file -> out.println(file) }
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: new File(qtPackageDir, 'jar'), include: ['*.jar'])
    implementation 'com.google.guava:guava:23.0'
}

// PicoInterfaceActivity preloads crypto before ssl so Android can resolve the
// original OpenSSL 1.1 SONAMEs. Do not rewrite any ELF metadata here: older
// patchelf versions corrupt Android symbol and version string tables.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
        task.dependsOn tasks.named('preparePicoQtRuntime')
    }
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.doLast {
            task.outputs.files.asFileTree.matching { include '**/*.so' }.files.each { library ->
                if (library.name == 'libtbb_debug.so') {
                    ant.copy(file: androidReleaseTbb, tofile: library, overwrite: true)
                }
                if (library.name == 'libQt5Core_arm64-v8a.so') {
                    ant.copy(file: androidPatchedQtCore, tofile: library, overwrite: true)
                }
            }
        }
    }
}
