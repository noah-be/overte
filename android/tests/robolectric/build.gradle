plugins {
    id 'java'
}

def phoneJava = file('../../apps/phoneInterface/src/main/java')
def phoneTests = file('../../apps/phoneInterface/src/test/java')

sourceSets {
    boundary {
        java.srcDirs 'src/main/java'
    }
    main {
        java {
            srcDirs phoneJava
            include 'org/overte/phone/PermissionsActivity.java'
            include 'org/overte/phone/PhoneDeepLink.java'
            include 'org/overte/phone/PhoneDeepLinkNormalizer.java'
            include 'org/overte/phone/PhoneLaunchState.java'
            include 'org/overte/phone/PhonePermissionFlow.java'
        }
        compileClasspath += sourceSets.boundary.output
        runtimeClasspath += sourceSets.boundary.output
    }
    test {
        java {
            srcDirs phoneTests
            include 'org/overte/phone/PermissionsActivityRobolectricTest.java'
        }
        compileClasspath += sourceSets.boundary.output
        runtimeClasspath += sourceSets.boundary.output
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    boundaryCompileOnly 'org.robolectric:android-all:15-robolectric-13954326'
    compileOnly 'org.robolectric:android-all:15-robolectric-13954326'
    testCompileOnly 'org.robolectric:android-all:15-robolectric-13954326'
    testRuntimeOnly 'org.robolectric:android-all:15-robolectric-13954326'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

def extractedTestAars = layout.buildDirectory.dir('extracted-test-aars')
def extractTestAars = tasks.register('extractTestAars') {
    outputs.dir extractedTestAars
    doLast {
        def destination = extractedTestAars.get().asFile
        delete destination
        configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.extension == 'aar' }
                .each { artifact ->
                    copy {
                        from zipTree(artifact.file)
                        include 'classes.jar'
                        into destination
                        rename { "${artifact.moduleVersion.id.group}-${artifact.name}.jar" }
                    }
                }
    }
}

test {
    dependsOn extractTestAars
    classpath += fileTree(extractedTestAars) { include '*.jar' }
    useJUnit()
    reports.junitXml.required = true
    reports.html.required = true
}
