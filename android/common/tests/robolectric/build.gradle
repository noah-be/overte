plugins {
    id 'java'
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

// Qualify this parent-owned harness against an explicit downstream checkout
// without moving any product implementation into the owning parent.
def sourceRoot = providers.gradleProperty('overteProductSourceRoot')
        .map { file(it) }.getOrElse(file('../../../..'))
def phoneJava = new File(sourceRoot, 'android/phone/apps/phoneInterface/src/main/java')
def phoneTests = new File(sourceRoot, 'android/phone/apps/phoneInterface/src/test/java')
def interfaceJava = file('../../../phone/apps/interface/src/main/java')
def interfaceTests = file('../../../phone/apps/interface/src/test/java')
def picoJava = file('../../../vr/pico/apps/picoInterface/src/main/java')
def picoTests = file('../../../vr/pico/apps/picoInterface/src/test/java')
def questJava = file('../../../vr/quest/apps/questInterface/src/main/java')
def questTests = file('../../../vr/quest/apps/questInterface/src/test/java')
def qtJava = new File(sourceRoot, 'android/common/libraries/qt/src/main/java')
def sharedRedactionJava = new File(sourceRoot, 'security/redaction/java')
def webJava = new File(sourceRoot, 'android/common/web/java')
def snapshotJava = new File(sourceRoot, 'android/common/snapshot/java')
def documentsJava = new File(sourceRoot, 'android/common/documents/java')

configurations {
    nativeHostApis {
        // Match the application artifacts. Native Qt initialization is outside
        // Robolectric; the production Web/Snapshot/Documents Java is compiled.
        transitive = false
    }
}

def nativeHostApiDirectory = layout.buildDirectory.dir('native-host-api-jars')
def extractNativeHostApis = tasks.register('extractNativeHostApis') {
    inputs.files configurations.nativeHostApis
    outputs.dir nativeHostApiDirectory
    doLast {
        def destination = nativeHostApiDirectory.get().asFile
        delete destination
        configurations.nativeHostApis.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy {
                from artifact.extension == 'aar' ? zipTree(artifact.file) : artifact.file
                if (artifact.extension == 'aar') { include 'classes.jar' }
                into destination
                rename { "${artifact.moduleVersion.id.group}-${artifact.name}.jar" }
            }
        }
    }
}
def nativeHostApiJars = files({ fileTree(nativeHostApiDirectory) { include '*.jar' } })
        .builtBy(extractNativeHostApis)

sourceSets {
    boundary {
        java.srcDirs 'src/main/java'
    }
    main {
        java {
            srcDirs phoneJava, interfaceJava, picoJava, questJava, qtJava,
                    sharedRedactionJava, webJava, snapshotJava, documentsJava
            include 'org/overte/phone/**'
            include 'org/overte/security/**'
            include 'org/overte/web/**'
            include 'org/overte/snapshot/**'
            include 'org/overte/documents/**'
            include 'io/highfidelity/utils/**'
            include 'org/overte/phone/PermissionsActivity.java'
            include 'org/overte/phone/PhoneDeepLink.java'
            include 'org/overte/phone/PhoneDeepLinkNormalizer.java'
            include 'org/overte/phone/PhoneLaunchState.java'
            include 'org/overte/phone/PhonePermissionFlow.java'
            include 'io/highfidelity/hifiinterface/HifiUtils.java'
            include 'io/highfidelity/hifiinterface/PermissionChecker.java'
            include 'org/overte/pico/PermissionsActivity.java'
            include 'org/overte/pico/AndroidAudioInput.java'
            include 'org/overte/pico/AndroidAudioInputPolicy.java'
            include 'org/overte/pico/PicoAudioCaptureState.java'
            // Compile the actual Pico audio lifecycle and diagnostics closure.
            include 'org/overte/pico/PicoAudioShutdown.java'
            include 'org/overte/pico/PicoAudioLifecycle.java'
            include 'org/overte/pico/RedactingDiagnostics.java'
            include 'io/highfidelity/questInterface/PermissionsChecker.java'
        }
        compileClasspath += sourceSets.boundary.output
        runtimeClasspath += sourceSets.boundary.output
        compileClasspath += nativeHostApiJars
        runtimeClasspath += nativeHostApiJars
    }
    test {
        java {
            srcDirs phoneTests, interfaceTests, picoTests, questTests
            include 'org/overte/phone/*RobolectricTest.java'
            include 'io/highfidelity/hifiinterface/HifiUtilsTest.java'
            include 'io/highfidelity/hifiinterface/PermissionCheckerRobolectricTest.java'
            include 'org/overte/pico/PermissionsActivityRobolectricTest.java'
            include 'io/highfidelity/questInterface/PermissionsCheckerRobolectricTest.java'
        }
        compileClasspath += sourceSets.boundary.output
        runtimeClasspath += sourceSets.boundary.output
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    nativeHostApis 'androidx.webkit:webkit:1.12.1@aar'
    nativeHostApis 'androidx.core:core:1.1.0@aar'
    nativeHostApis 'androidx.annotation:annotation-jvm:1.8.1@jar'
    boundaryCompileOnly 'org.robolectric:android-all:15-robolectric-13954326'
    compileOnly 'org.robolectric:android-all:15-robolectric-13954326'
    testCompileOnly 'org.robolectric:android-all:15-robolectric-13954326'
    testRuntimeOnly 'org.robolectric:android-all:15-robolectric-13954326'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.named('compileJava') { dependsOn extractNativeHostApis }

def extractedTestAars = layout.buildDirectory.dir('extracted-test-aars')
def extractTestAars = tasks.register('extractTestAars') {
    outputs.dir extractedTestAars
    doLast {
        def destination = extractedTestAars.get().asFile
        delete destination
        configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.extension == 'aar' }
                .each { artifact ->
                    copy {
                        from zipTree(artifact.file)
                        include 'classes.jar'
                        into destination
                        rename { "${artifact.moduleVersion.id.group}-${artifact.name}.jar" }
                    }
                }
    }
}

test {
    dependsOn extractTestAars
    classpath += fileTree(extractedTestAars) { include '*.jar' }
    useJUnit()
    // Keep font/native extraction local to this harness, including downstream
    // suites; none of these host caches belong to a product build attempt.
    def testTempDir = layout.buildDirectory.dir('tmp/robolectric-runtime')
    def conscryptWorkDir = layout.buildDirectory.dir('tmp/conscrypt-native')
    doFirst {
        testTempDir.get().asFile.mkdirs()
        conscryptWorkDir.get().asFile.mkdirs()
    }
    systemProperty 'java.io.tmpdir', testTempDir.get().asFile.absolutePath
    systemProperty 'org.conscrypt.native.workdir', conscryptWorkDir.get().asFile.absolutePath
    reports.junitXml.required = true
    reports.html.required = true
}
