# Local-only Jenkins Configuration as Code template for the Overte device lab.
#
# The bootstrap copies this file outside the checkout and replaces the two
# path placeholders. No credential value is stored in this repository.
jenkins:
  systemMessage: "Local Overte physical-device E2E laboratory (managed by JCasC)\n"
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "overte-admin"
          name: "Overte device-lab administrator"
          password: "${trim:${readFile:__OVERTE_ADMIN_PASSWORD_FILE__}}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "overte-device-local"
        remoteFS: "__OVERTE_AGENT_ROOT__"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "overte-ios-fedora-device"
        launcher:
          inbound:
            webSocket: true
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: true
              internalDir: "remoting"
              workDirPath: "__OVERTE_AGENT_ROOT__"

unclassified:
  location:
    url: "http://127.0.0.1:8080/"
