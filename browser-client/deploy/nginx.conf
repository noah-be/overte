# Example HTTPS reverse proxy; install your own free/public or local certificate.
# SPDX-License-Identifier: Apache-2.0
server {
    listen 443 ssl;
    server_name overte.example.org;
    ssl_certificate /etc/letsencrypt/live/overte.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overte.example.org/privkey.pem;

    # The native bridge is never part of the public browser API.
    location /native { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
