# Configuration file for the GitHub Actions linter https://github.com/rhysd/actionlint
self-hosted-runner:
  labels:
    # This section supports globbing.
    # Don't throw a warning about unknown Runner labels when using Depot.dev Runners.
    - depot-ubuntu-latest
    - depot-ubuntu-2?.04
    - depot-ubuntu-2?.04-?
    - depot-ubuntu-2?.04-??
    - depot-ubuntu-2?.04-arm
    - depot-ubuntu-2?.04-arm-?
    - depot-ubuntu-2?.04-arm-??
    - depot-windows-latest
    - depot-windows-202?
    - depot-windows-202?-?
    - depot-windows-202?-??
    - depot-macos-latest
    - depot-macos-??
    # Protected fork build and device pools; shared so synchronization preserves labels.
    - overte-android-build
    - overte-android-phone-build
    - overte-android-phone-emulator
    - overte-android-phone-release
    - overte-android-release
    - overte-pico4-device
    # Dedicated protected runner with one paired physical iPad.
    - overte-ios-ipad
