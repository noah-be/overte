name: iOS Personal Team unsigned E2E kit

on:
  workflow_call:
    inputs:
      qt_host_cache_key:
        description: Existing audited Qt 6 host-tools cache key
        required: true
        type: string
      qt_ios_cache_key:
        description: Existing audited Qt 6 iOS cache key
        required: true
        type: string
      qt_host_artifact_prefix:
        description: Durable audited Qt 6 host-tools artifact namespace
        required: true
        type: string
      qt_ios_artifact_prefix:
        description: Durable audited Qt 6 iOS artifact namespace
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-personal-team-e2e-unsigned-kit
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  authorize-source:
    name: Authorize credential-free Personal Team kit source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bind the build to the protected dispatch entrypoint
        env:
          QT_HOST_CACHE_KEY: ${{ inputs.qt_host_cache_key }}
          QT_IOS_CACHE_KEY: ${{ inputs.qt_ios_cache_key }}
          QT_HOST_ARTIFACT_PREFIX: ${{ inputs.qt_host_artifact_prefix }}
          QT_IOS_ARTIFACT_PREFIX: ${{ inputs.qt_ios_artifact_prefix }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/apple-ios" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/ios-bootstrap.yml@refs/heads/apple-ios" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$QT_HOST_CACHE_KEY" =~ ^overte-qt-host-v2-[A-Za-z0-9._-]{1,190}-contract-[0-9a-f]{64}$ ]]
          [[ "$QT_IOS_CACHE_KEY" =~ ^overte-qt-ios-v2-[A-Za-z0-9._-]{1,190}-contract-[0-9a-f]{64}$ ]]
          [[ "$QT_HOST_ARTIFACT_PREFIX" =~ ^overte-qt-host-checkpoint-v1-[0-9a-f]{32}$ ]]
          [[ "$QT_IOS_ARTIFACT_PREFIX" =~ ^overte-qt-ios-checkpoint-v1-[0-9a-f]{32}$ ]]

  unsigned-e2e-client:
    name: Build unsigned Overte E2E Full Client
    needs: authorize-source
    uses: ./.github/workflows/ios-integrated.yml
    permissions:
      actions: read
      contents: read
    with:
      qt_host_cache_key: ${{ inputs.qt_host_cache_key }}
      qt_ios_cache_key: ${{ inputs.qt_ios_cache_key }}
      qt_host_artifact_prefix: ${{ inputs.qt_host_artifact_prefix }}
      qt_ios_artifact_prefix: ${{ inputs.qt_ios_artifact_prefix }}
      macos_runner: macos-26
      e2e_test_build: true
      e2e_bundle_id: org.overte.interface.e2e

  package-unsigned-kit:
    name: Package unsigned Overte and WebDriverAgent kit
    needs: unsigned-e2e-client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIT_ROOT: ${{ github.workspace }}/build-ios/personal-team-e2e-kit-${{ github.run_id }}-${{ github.run_attempt }}
      XCUITEST_DRIVER_VERSION: 12.8.0
      WDA_VERSION: 16.8.0
    steps:
      - name: Check out exact kit revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Recheck fixed identities and source provenance
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/apple-ios" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/ios-bootstrap.yml@refs/heads/apple-ios" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$XCUITEST_DRIVER_VERSION" == "12.8.0" ]]
          [[ "$WDA_VERSION" == "16.8.0" ]]

      - name: Download exact same-run unsigned Overte artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.run_number }}-overte-ios-integrated-e2e-unsigned-${{ github.run_id }}
          path: ${{ env.KIT_ROOT }}/integrated

      - name: Download and verify WebDriverAgent 16.8.0
        run: |
          set -euo pipefail
          install -d -m 0700 "$KIT_ROOT"
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 --max-filesize 536870912 \
            "https://github.com/appium/WebDriverAgent/releases/download/v${WDA_VERSION}/WebDriverAgentRunner-Runner.zip" \
            --output "$KIT_ROOT/WebDriverAgentRunner-Runner.zip"
          printf '%s  %s\n' \
            38ec705d6fa2c7825513adbc9406d4fda5d6a084a8d3980ceff9a265e62f9623 \
            "$KIT_ROOT/WebDriverAgentRunner-Runner.zip" | sha256sum --check

          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 --max-filesize 536870912 \
            "https://registry.npmjs.org/appium-xcuitest-driver/-/appium-xcuitest-driver-${XCUITEST_DRIVER_VERSION}.tgz" \
            --output "$KIT_ROOT/appium-xcuitest-driver.tgz"
          printf '%s  %s\n' \
            2cccc74b0cc3f56afd029accc3a4553c56d7269c6c403cbf161aaf095bc5c0b8 \
            "$KIT_ROOT/appium-xcuitest-driver.tgz" | sha256sum --check
          python3 - "$KIT_ROOT/appium-xcuitest-driver.tgz" <<'PY'
          import io
          import json
          import pathlib
          import tarfile
          import sys

          archive = pathlib.Path(sys.argv[1])
          with tarfile.open(archive, "r:gz") as source:
              members = source.getmembers()
              if not members or len(members) > 65536:
                  raise SystemExit("XCUITest package entry count is invalid")
              total = 0
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if (not path.parts or member.name.startswith("/")
                          or "\\" in member.name or "\0" in member.name
                          or any(part in {"", ".", ".."} for part in path.parts)):
                      raise SystemExit("XCUITest package contains an unsafe path")
                  if member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit("XCUITest package contains a special member")
                  if member.size < 0 or member.size > 536870912:
                      raise SystemExit("XCUITest package member size is invalid")
                  total += member.size
                  if total > 1073741824:
                      raise SystemExit("XCUITest package expands beyond its limit")
              matches = [member for member in members
                         if member.name == "package/package.json" and member.isfile()]
              if len(matches) != 1 or matches[0].size > 1024 * 1024:
                  raise SystemExit("XCUITest package metadata is missing or unsafe")
              stream = source.extractfile(matches[0])
              if stream is None:
                  raise SystemExit("XCUITest package metadata is unreadable")
              package = json.load(io.TextIOWrapper(stream, encoding="utf-8"))
          if package.get("version") != "12.8.0":
              raise SystemExit("XCUITest driver version drift")
          if package.get("dependencies", {}).get("appium-webdriveragent") != "^16.8.0":
              raise SystemExit("XCUITest/WebDriverAgent dependency drift")
          PY

      - name: Create fixed-identity credential-free signing kit
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=("$KIT_ROOT"/integrated/*-OverteIOSClient-Release-device-unsigned.ipa)
          manifests=("$KIT_ROOT"/integrated/*-OverteIOSClient-Release-device-unsigned.json)
          if (( ${#ipas[@]} != 1 || ${#manifests[@]} != 1 )); then
            echo "expected exactly one unsigned Overte E2E IPA and manifest" >&2
            exit 1
          fi
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 ios/ci/create-personal-team-e2e-kit.py \
            --overte-ipa "${ipas[0]}" \
            --overte-manifest "${manifests[0]}" \
            --wda-upstream "$KIT_ROOT/WebDriverAgentRunner-Runner.zip" \
            --output-dir "$KIT_ROOT/output" \
            --source-revision "$GITHUB_SHA" \
            --created-at "$created_at" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-repository-id "$GITHUB_REPOSITORY_ID" \
            --source-ref "$GITHUB_REF" \
            --workflow .github/workflows/ios-bootstrap.yml \
            --reusable-workflow .github/workflows/ios-personal-team-e2e-kit.yml \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload public unsigned Personal Team kit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-personal-team-e2e-kit-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.KIT_ROOT }}/output/Overte-PersonalTeam-E2E-unsigned.ipa
            ${{ env.KIT_ROOT }}/output/WebDriverAgentRunner-16.8.0-PersonalTeam-unsigned.ipa
            ${{ env.KIT_ROOT }}/output/personal-team-e2e-kit.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove working copies
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${KIT_ROOT:-}" && "$KIT_ROOT" == "$GITHUB_WORKSPACE/build-ios/personal-team-e2e-kit-"* ]]; then
            rm -rf -- "$KIT_ROOT"
          fi
