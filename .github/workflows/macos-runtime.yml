name: macOS runtime smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful macOS bootstrap run containing the Overte.app artifact
        required: true
        type: string
      run_online:
        description: Run the public-domain smoke after the serverless smoke succeeds
        required: true
        default: true
        type: boolean
      run_performance:
        description: Record validated frame timings for the deterministic local scene
        required: true
        default: false
        type: boolean
      profile_matrix_mode:
        description: Compare macOS graphics quality profiles against a lit deterministic scene
        required: true
        default: 'off'
        type: choice
        options: ['off', 'quick', 'full']
      profile_repeats:
        description: Measured processes per graphics profile (warmup is additional)
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
      run_online_loading:
        description: Compare cold and warm public-world loading without the lightweight entity filter
        required: true
        default: false
        type: boolean
      online_loading_repeats:
        description: Cold/warm process pairs per download-concurrency value
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
      online_download_concurrencies:
        description: Resource-request limits compared by the online loading benchmark
        required: true
        default: '10,16'
        type: choice
        options: ['10', '10,16']
      stability_iterations:
        description: Repeated local launch/render/quit cycles (0 disables the stability suite)
        required: true
        default: '0'
        type: choice
        options: ['0', '3', '5']
      run_transition:
        description: Prove serverless to online to serverless cleanup in one process
        required: true
        default: false
        type: boolean
      online_location:
        description: Online place or direct domain URL used by the public-domain smoke
        required: true
        default: hifi://overte_hub
        type: string
  # Register this branch-local workflow without running a second smoke suite.
  push:
    branches: [apple-macos]
    paths: ['.github/workflows/macos-runtime.yml']

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-x86_64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 330
    env:
      OVERTE_MACOS_LLDB_TIMEOUT_SECONDS: '300'
    steps:
      - name: Check out runtime tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore built application checkpoint
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: overte-macos-x86_64-${{ inputs.artifact_run_id }}
          path: build/runtime-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Verify restored application bundle
        run: |
          # upload-artifact stores the contents of a directory at the artifact
          # root. Recreate the bundle directory around that preserved tree.
          if [[ -d build/runtime-artifact/Contents && ! -d build/runtime-artifact/Overte.app ]]; then
            mkdir build/runtime-artifact/Overte.app
            mv build/runtime-artifact/Contents build/runtime-artifact/Overte.app/Contents
          fi
          app="$(find build/runtime-artifact -type d -name Overte.app -print -quit)"
          test -n "$app"
          # GitHub's artifact extraction does not retain executable modes.
          chmod -R u+rx "$app/Contents/MacOS" "$app/Contents/Frameworks" "$app/Contents/PlugIns"
          test -x "$app/Contents/MacOS/Overte"
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          macos/ci/verify-glad-linkage.sh "$app"
          printf '%s\n' "$app" > build/runtime-artifact/app-path.txt

      - name: Run application startup preflight
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-startup \
            --log build/macos-runtime-telemetry/startup.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/startup-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 180 --max-runtime 240 \
            --watch startup=build/macos-startup-preflight -- \
            macos/ci/startup-preflight.sh "$app" build/macos-startup-preflight

      - name: Run serverless entity smoke
        id: serverless-smoke
        continue-on-error: true
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-serverless \
            --log build/macos-runtime-telemetry/serverless.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/serverless-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 660 --max-runtime 780 \
            --watch smoke=build/macos-smoke -- \
            macos/ci/serverless-smoke.sh "$app" build/macos-smoke

      - name: Run online entity smoke
        if: ${{ always() && inputs.run_online && steps.serverless-smoke.outcome == 'success' }}
        env:
          OVERTE_MACOS_ONLINE_LOCATION: ${{ inputs.online_location }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-online \
            --log build/macos-runtime-telemetry/online.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/online-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 660 --max-runtime 780 \
            --watch smoke=build/macos-online-smoke -- \
            macos/ci/online-smoke.sh "$app" build/macos-online-smoke

      - name: Run serverless-online-serverless transition smoke
        if: ${{ always() && inputs.run_transition && steps.serverless-smoke.outcome == 'success' }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-transition \
            --log build/macos-runtime-telemetry/transition.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/transition-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 660 --max-runtime 840 \
            --watch transition=build/macos-transition -- \
            macos/ci/transition-smoke.sh "$app" build/macos-transition

      - name: Run deterministic graphics performance smoke
        if: ${{ always() && inputs.run_performance && steps.serverless-smoke.outcome == 'success' }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-performance \
            --log build/macos-runtime-telemetry/performance.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/performance-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 300 --max-runtime 420 \
            --watch performance=build/macos-performance -- \
            macos/ci/performance-smoke.sh "$app" build/macos-performance

      - name: Run macOS graphics quality profile matrix
        if: ${{ always() && inputs.profile_matrix_mode != 'off' && steps.serverless-smoke.outcome == 'success' }}
        timeout-minutes: 120
        env:
          OVERTE_MACOS_PROFILE_MATRIX_MODE: ${{ inputs.profile_matrix_mode }}
          OVERTE_MACOS_PROFILE_REPEATS: ${{ inputs.profile_repeats }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-performance-matrix \
            --log build/macos-runtime-telemetry/performance-matrix.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/performance-matrix-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 360 --max-runtime 7000 \
            --watch performance-matrix=build/macos-performance-matrix -- \
            macos/ci/performance-matrix.sh "$app" build/macos-performance-matrix

      - name: Run macOS online world-loading benchmark
        if: ${{ always() && inputs.run_online_loading && steps.serverless-smoke.outcome == 'success' }}
        timeout-minutes: 105
        env:
          OVERTE_MACOS_ONLINE_LOCATION: ${{ inputs.online_location }}
          OVERTE_MACOS_ONLINE_LOCATION_LABEL: public-hub
          OVERTE_MACOS_ONLINE_REPEATS: ${{ inputs.online_loading_repeats }}
          OVERTE_MACOS_ONLINE_CONCURRENCIES: ${{ inputs.online_download_concurrencies }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-online-loading \
            --log build/macos-runtime-telemetry/online-loading.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/online-loading-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 360 --max-runtime 6000 \
            --watch online-loading=build/macos-online-loading -- \
            macos/ci/online-loading-benchmark.sh "$app" build/macos-online-loading

      - name: Run repeated launch-render-quit stability suite
        if: ${{ always() && inputs.stability_iterations != '0' && steps.serverless-smoke.outcome == 'success' }}
        env:
          OVERTE_MACOS_STABILITY_ITERATIONS: ${{ inputs.stability_iterations }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-stability \
            --log build/macos-runtime-telemetry/stability.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/stability-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 660 --max-runtime 2400 \
            --watch stability=build/macos-stability -- \
            macos/ci/stability-smoke.sh "$app" build/macos-stability \
              "$OVERTE_MACOS_STABILITY_ITERATIONS"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-runtime-${{ github.run_id }}
          path: |
            build/macos-startup-preflight
            build/macos-smoke
            build/macos-online-smoke
            build/macos-transition
            build/macos-performance
            build/macos-performance-matrix
            build/macos-online-loading
            build/macos-stability
            build/macos-runtime-telemetry
          if-no-files-found: ignore
          retention-days: 7

      - name: Require successful serverless smoke
        if: ${{ always() && steps.serverless-smoke.outcome == 'failure' }}
        run: exit 1
