name: macOS runtime smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Completed macOS bootstrap run containing the Overte.app artifact
        required: true
        type: string
      target_arch:
        description: Architecture of the bootstrap artifact and runtime runner
        required: true
        default: x86_64
        type: choice
        options: [x86_64, arm64]
      arm_runner_size:
        description: ARM runner size used to execute the artifact
        required: true
        default: standard
        type: choice
        options: [standard, xlarge]
      runtime_runner:
        description: Hosted diagnostics or a fixed-label physical Apple-Silicon performance Mac
        required: true
        default: github-hosted
        type: choice
        options: [github-hosted, apple-silicon-self-hosted]
      run_online:
        description: Run the public-domain smoke after the serverless smoke succeeds
        required: true
        default: true
        type: boolean
      run_performance:
        description: Record validated frame timings for the deterministic local scene
        required: true
        default: false
        type: boolean
      profile_matrix_mode:
        description: Compare macOS graphics quality profiles against a lit deterministic scene
        required: true
        default: 'off'
        type: choice
        options: ['off', 'quick', 'full']
      profile_repeats:
        description: Measured processes per graphics profile (warmup is additional)
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
      run_online_loading:
        description: Compare cold and warm world loading without the lightweight entity filter
        required: true
        default: false
        type: boolean
      online_loading_target_mode:
        description: Public informational world or UUID/sentinel-bound controlled fixture
        required: true
        default: public
        type: choice
        options: [public, controlled]
      online_controlled_domain_id:
        description: Canonical domain UUID required when target mode is controlled
        required: false
        default: ''
        type: string
      online_controlled_sentinel_name:
        description: Versioned entity name required when target mode is controlled
        required: false
        default: ''
        type: string
      online_loading_repeats:
        description: Cold/warm process pairs per download-concurrency value
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
      online_download_concurrencies:
        description: Resource-request limits compared by the online loading benchmark
        required: true
        default: '10,16'
        type: choice
        options: ['10', '10,16']
      stability_iterations:
        description: Repeated local launch/render/quit cycles (0 disables the stability suite)
        required: true
        default: '0'
        type: choice
        options: ['0', '3', '5']
      run_transition:
        description: Prove serverless to online to serverless cleanup in one process
        required: true
        default: false
        type: boolean
      online_location:
        description: Online place or direct domain URL used by the public-domain smoke
        required: true
        default: hifi://overte_hub
        type: string
  # Register this branch-local workflow without running a second smoke suite.
  push:
    branches: [apple-macos]
    paths: ['.github/workflows/macos-runtime.yml']

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-x86_64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.runtime_runner == 'apple-silicon-self-hosted' && fromJSON('["self-hosted","macOS","ARM64","overte-macos-apple-silicon-performance"]') || inputs.target_arch == 'arm64' && inputs.arm_runner_size == 'xlarge' && 'macos-15-xlarge' || inputs.target_arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 330
    env:
      OVERTE_MACOS_LLDB_TIMEOUT_SECONDS: '300'
      OVERTE_MACOS_TARGET_ARCH: ${{ inputs.target_arch }}
      OVERTE_MACOS_RUNTIME_RUNNER: ${{ inputs.runtime_runner }}
    steps:
      - name: Check out runtime tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify physical Apple-Silicon performance runner
        if: ${{ inputs.runtime_runner == 'apple-silicon-self-hosted' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          [[ "$OVERTE_MACOS_TARGET_ARCH" == arm64 ]] || {
            echo "self-hosted performance runner requires an arm64 application" >&2
            exit 1
          }
          [[ "$RUNNER_ENVIRONMENT" == self-hosted ]] || {
            echo "fixed-label performance route did not reach a self-hosted runner" >&2
            exit 1
          }
          machine="$(uname -m)"
          translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || printf '0')"
          mkdir -p build/macos-runtime-provenance
          clang++ -std=c++20 -fobjc-arc -DGL_SILENCE_DEPRECATION \
            -framework Foundation -framework OpenGL \
            macos/tools/apple-gpu-probe.mm \
            -o "$RUNNER_TEMP/overte-apple-gpu-probe"
          "$RUNNER_TEMP/overte-apple-gpu-probe" > \
            "$RUNNER_TEMP/overte-apple-gpu-probe.json"
          python3 macos/tools/validate-apple-gpu-probe.py \
            "$RUNNER_TEMP/overte-apple-gpu-probe.json" \
            --machine "$machine" --translated "$translated" \
            --result build/macos-runtime-provenance/apple-gpu-runner.json \
            --require-hardware

      - name: Validate requested bootstrap source run
        id: source-run
        timeout-minutes: 5
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          REQUESTED_RUN_ID: ${{ inputs.artifact_run_id }}
          TARGET_ARCH: ${{ inputs.target_arch }}
        with:
          script: |
            const rawRunId = process.env.REQUESTED_RUN_ID || '';
            if (!/^[1-9][0-9]*$/.test(rawRunId)) {
              core.setFailed('artifact_run_id must be a canonical positive integer');
              return;
            }
            const runId = Number(rawRunId);
            if (!Number.isSafeInteger(runId) || String(runId) !== rawRunId) {
              core.setFailed('artifact_run_id is outside the safe integer range');
              return;
            }

            const expectedRef = 'refs/heads/apple-macos';
            const expectedBranch = 'apple-macos';
            const expectedWorkflow = '.github/workflows/macos-bootstrap.yml';
            const targetArch = process.env.TARGET_ARCH || '';
            if (!['x86_64', 'arm64'].includes(targetArch)) {
              core.setFailed('target_arch must be x86_64 or arm64');
              return;
            }
            const expectedArtifact = `overte-macos-${targetArch}-${runId}`;
            const repositoryId = Number(context.payload.repository?.id);
            if (!Number.isSafeInteger(repositoryId) || context.ref !== expectedRef) {
              core.setFailed('runtime verification must execute from the trusted apple-macos ref');
              return;
            }

            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = response.data;
            const validRun =
              run.id === runId &&
              run.repository?.id === repositoryId &&
              run.repository?.full_name === context.repo.owner + '/' + context.repo.repo &&
              run.head_repository?.id === repositoryId &&
              run.path === expectedWorkflow &&
              run.head_branch === expectedBranch &&
              /^[0-9a-f]{40}$/.test(run.head_sha || '') &&
              Number.isSafeInteger(run.run_attempt) && run.run_attempt > 0 &&
              run.status === 'completed' &&
              ['success', 'failure'].includes(run.conclusion) &&
              (run.event === 'push' || run.event === 'workflow_dispatch');
            if (!validRun) {
              core.setFailed('requested run is not a completed trusted macOS bootstrap run');
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              },
            );
            const matches = artifacts.filter((artifact) => artifact.name === expectedArtifact);
            if (
              matches.length !== 1 ||
              matches[0].expired === true ||
              !Number.isSafeInteger(matches[0].id) || matches[0].id <= 0 ||
              !Number.isSafeInteger(matches[0].size_in_bytes) || matches[0].size_in_bytes <= 0 ||
              !/^sha256:[0-9a-f]{64}$/.test(matches[0].digest || '')
            ) {
              core.setFailed('requested run does not contain exactly one live application artifact');
              return;
            }

            const fs = require('fs');
            fs.mkdirSync('build/macos-runtime-provenance', { recursive: true });
            fs.writeFileSync(
              'build/macos-runtime-provenance/source-run.json',
              `${JSON.stringify({
                artifact_id: matches[0].id,
                artifact_digest: matches[0].digest,
                artifact_name: matches[0].name,
                artifact_size_bytes: matches[0].size_in_bytes,
                ref: expectedRef,
                repository: context.repo.owner + '/' + context.repo.repo,
                repository_id: repositoryId,
                run_attempt: run.run_attempt,
                run_id: run.id,
                schema_version: 1,
                sha: run.head_sha,
                workflow: expectedWorkflow,
              }, null, 2)}\n`,
              { encoding: 'utf8', mode: 0o600 },
            );
            core.setOutput('artifact-id', String(matches[0].id));
            core.setOutput('attempt', String(run.run_attempt));
            core.setOutput('sha', run.head_sha);

      - name: Restore built application checkpoint
        timeout-minutes: 30
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          artifact-ids: ${{ steps.source-run.outputs.artifact-id }}
          merge-multiple: true
          path: build/runtime-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Verify restored application bundle
        timeout-minutes: 30
        env:
          SOURCE_RUN_ATTEMPT: ${{ steps.source-run.outputs.attempt }}
          SOURCE_RUN_SHA: ${{ steps.source-run.outputs.sha }}
        run: |
          set -euo pipefail
          archive=build/runtime-artifact/application-archive/Overte.app.tar
          manifest=build/runtime-artifact/application-artifact/application-manifest.json
          [[ -f "$archive" ]] || {
            echo "application artifact is incompatible: missing normalized Overte.app archive" >&2
            exit 1
          }
          [[ -f "$manifest" ]] || {
            echo "application artifact is incompatible: missing provenance manifest" >&2
            exit 1
          }
          python3 macos/ci/application-artifact.py extract \
            --archive "$archive" \
            --destination build/runtime-artifact/interface
          app=build/runtime-artifact/interface/Overte.app
          [[ -d "$app" ]] || {
            echo "application artifact extraction did not produce exactly one normalized Overte.app" >&2
            exit 1
          }
          [[ "$(stat -f %z "$manifest")" -le 4194304 ]] || {
            echo "application provenance manifest exceeds the 4 MiB safety limit" >&2
            exit 1
          }
          [[ "$(find build/runtime-artifact -type d -name Overte.app | wc -l | tr -d ' ')" = 1 ]] || {
            echo "application artifact contains an ambiguous Overte.app layout" >&2
            exit 1
          }
          [[ "$(find build/runtime-artifact -type f -name application-manifest.json | wc -l | tr -d ' ')" = 1 ]] || {
            echo "application artifact contains an ambiguous provenance layout" >&2
            exit 1
          }
          build_metadata="$(python3 - "$manifest" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          build = payload.get("build", {})
          print(build.get("xcode_version", ""), build.get("xcode_build", ""), build.get("sdk_version", ""))
          PY
          )"
          read -r artifact_xcode_version artifact_xcode_build artifact_sdk_version <<< "$build_metadata"
          python3 macos/ci/application-artifact.py verify \
            --app "$app" \
            --manifest "$manifest" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --workflow .github/workflows/macos-bootstrap.yml \
            --ref refs/heads/apple-macos \
            --sha "$SOURCE_RUN_SHA" \
            --run-id "${{ inputs.artifact_run_id }}" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --target-arch "$OVERTE_MACOS_TARGET_ARCH" \
            --xcode-version "$artifact_xcode_version" \
            --xcode-build "$artifact_xcode_build" \
            --sdk-version "$artifact_sdk_version" \
            --build-type RelWithDebInfo \
            --deployment-target 11.0
          cp "$manifest" build/macos-runtime-provenance/application-manifest.json
          test -x "$app/Contents/MacOS/Overte"
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          macos/ci/verify-glad-linkage.sh "$app"
          printf '%s\n' "$app" > build/runtime-artifact/app-path.txt

      - name: Run application startup preflight
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-startup \
            --log build/macos-runtime-telemetry/startup.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/startup-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 180 --max-runtime 240 \
            --watch startup=build/macos-startup-preflight -- \
            macos/ci/startup-preflight.sh "$app" build/macos-startup-preflight

      - name: Run serverless entity smoke
        id: serverless-smoke
        continue-on-error: true
        env:
          # Hosted Intel runners use Apple's software OpenGL renderer. A single
          # production draw can take several minutes there, so keep the runtime
          # rerun above the observed 900-second active-render timeout.
          OVERTE_MACOS_SMOKE_TIMEOUT_SECONDS: '1800'
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-serverless \
            --log build/macos-runtime-telemetry/serverless.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/serverless-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 1800 --max-runtime 1920 \
            --watch smoke=build/macos-smoke -- \
            macos/ci/serverless-smoke.sh "$app" build/macos-smoke

      - name: Run online entity smoke
        if: ${{ always() && inputs.run_online && steps.serverless-smoke.outcome == 'success' }}
        env:
          OVERTE_MACOS_ONLINE_LOCATION: ${{ inputs.online_location }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-online \
            --log build/macos-runtime-telemetry/online.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/online-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 1800 --max-runtime 2700 \
            --watch smoke=build/macos-online-smoke -- \
            macos/ci/online-smoke.sh "$app" build/macos-online-smoke

      - name: Run serverless-online-serverless transition smoke
        if: ${{ always() && inputs.run_transition && steps.serverless-smoke.outcome == 'success' }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-transition \
            --log build/macos-runtime-telemetry/transition.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/transition-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 660 --max-runtime 840 \
            --watch transition=build/macos-transition -- \
            macos/ci/transition-smoke.sh "$app" build/macos-transition

      - name: Run deterministic graphics performance smoke
        if: ${{ always() && inputs.run_performance && steps.serverless-smoke.outcome == 'success' }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-performance \
            --log build/macos-runtime-telemetry/performance.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/performance-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 300 --max-runtime 420 \
            --watch performance=build/macos-performance -- \
            macos/ci/performance-smoke.sh "$app" build/macos-performance

      - name: Run macOS graphics quality profile matrix
        if: ${{ always() && inputs.profile_matrix_mode != 'off' && steps.serverless-smoke.outcome == 'success' }}
        timeout-minutes: 160
        env:
          OVERTE_MACOS_PROFILE_MATRIX_MODE: ${{ inputs.profile_matrix_mode }}
          OVERTE_MACOS_PROFILE_REPEATS: ${{ inputs.profile_repeats }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-performance-matrix \
            --log build/macos-runtime-telemetry/performance-matrix.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/performance-matrix-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 360 --max-runtime 9000 \
            --watch performance-matrix=build/macos-performance-matrix -- \
            macos/ci/performance-matrix.sh "$app" build/macos-performance-matrix

      - name: Run macOS online world-loading benchmark
        if: ${{ always() && inputs.run_online_loading && steps.serverless-smoke.outcome == 'success' }}
        timeout-minutes: 105
        env:
          OVERTE_MACOS_ONLINE_LOCATION: ${{ inputs.online_location }}
          OVERTE_MACOS_ONLINE_LOCATION_LABEL: ${{ inputs.online_loading_target_mode == 'controlled' && 'controlled-fixture' || 'public-hub' }}
          OVERTE_MACOS_ONLINE_TARGET_MODE: ${{ inputs.online_loading_target_mode }}
          OVERTE_MACOS_ONLINE_EXPECTED_DOMAIN_ID: ${{ inputs.online_controlled_domain_id }}
          OVERTE_MACOS_ONLINE_EXPECTED_SENTINEL_NAME: ${{ inputs.online_controlled_sentinel_name }}
          OVERTE_MACOS_ONLINE_REPEATS: ${{ inputs.online_loading_repeats }}
          OVERTE_MACOS_ONLINE_CONCURRENCIES: ${{ inputs.online_download_concurrencies }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-online-loading \
            --log build/macos-runtime-telemetry/online-loading.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/online-loading-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 360 --max-runtime 6000 \
            --watch online-loading=build/macos-online-loading -- \
            macos/ci/online-loading-benchmark.sh "$app" build/macos-online-loading

      - name: Run repeated launch-render-quit stability suite
        if: ${{ always() && inputs.stability_iterations != '0' && steps.serverless-smoke.outcome == 'success' }}
        env:
          OVERTE_MACOS_STABILITY_ITERATIONS: ${{ inputs.stability_iterations }}
        run: |
          app="$(cat build/runtime-artifact/app-path.txt)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-stability \
            --log build/macos-runtime-telemetry/stability.jsonl \
            --diagnostics-dir build/macos-runtime-telemetry/stability-stall \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 660 --max-runtime 2400 \
            --watch stability=build/macos-stability -- \
            macos/ci/stability-smoke.sh "$app" build/macos-stability \
              "$OVERTE_MACOS_STABILITY_ITERATIONS"

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-runtime-${{ github.run_id }}
          path: |
            build/macos-startup-preflight
            build/macos-smoke
            build/macos-online-smoke
            build/macos-transition
            build/macos-performance
            build/macos-performance-matrix
            !build/macos-performance-matrix/cache/**
            !build/macos-performance-matrix/**/profile-script.js
            build/macos-online-loading
            build/macos-stability
            build/macos-runtime-telemetry
            build/macos-runtime-provenance
          if-no-files-found: ignore
          retention-days: 7

      - name: Require successful serverless smoke
        if: ${{ always() && steps.serverless-smoke.outcome == 'failure' }}
        run: exit 1
