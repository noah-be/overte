name: iOS Full Client simulator acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful iOS candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Successful candidate workflow run attempt
        required: true
        type: string
      candidate_artifact_name:
        description: Exact artifact name containing the numbered simulator candidate
        required: true
        type: string
      source_revision:
        description: Exact lowercase 40-character source revision
        required: true
        type: string
      artifact_sha256:
        description: Approved SHA-256 from the numbered candidate manifest
        required: true
        type: string
      execute_runtime:
        description: Install and run the verified Full Client on iPhone and iPad simulators
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-interface-simulator-acceptance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify-candidate:
    name: Verify Full Client simulator candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUNTIME_ROOT: ${{ github.workspace }}/build-ios/interface-simulator-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out reviewed runtime harness without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate immutable candidate inputs and producer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          APPROVED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test ! -e "$RUNTIME_ROOT"
          install -d -m 0700 "$RUNTIME_ROOT/candidate"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNTIME_ROOT/run.json"
          python3 - "$RUNTIME_ROOT/run.json" "$CANDIDATE_RUN_ATTEMPT" "$SOURCE_REVISION" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          allowed_workflows = {
              ".github/workflows/ios-bootstrap.yml",
              ".github/workflows/ios-integrated.yml",
          }
          path = str(payload.get("path", "")).split("@", 1)[0]
          repository = payload.get("head_repository") or {}
          if payload.get("status") != "completed" or payload.get("conclusion") != "success":
              raise SystemExit("candidate producer run is not successful")
          if payload.get("run_attempt") != int(sys.argv[2]):
              raise SystemExit("candidate producer run attempt mismatch")
          if payload.get("head_sha") != sys.argv[3]:
              raise SystemExit("candidate producer source revision mismatch")
          if repository.get("full_name") != __import__("os").environ["GITHUB_REPOSITORY"]:
              raise SystemExit("candidate producer repository mismatch")
          if payload.get("head_branch") != "apple-ios" or path not in allowed_workflows:
              raise SystemExit("candidate producer is outside the trusted iOS workflow boundary")
          PY

      - name: Download and verify exact simulator candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          APPROVED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          gh run download "$CANDIDATE_RUN_ID" --name "$CANDIDATE_ARTIFACT_NAME" \
            --dir "$RUNTIME_ROOT/candidate"
          python3 ios/tools/verify-runtime-candidate.py "$RUNTIME_ROOT/candidate" \
            --mode simulator \
            --expected-source-revision "$SOURCE_REVISION" \
            --expected-sha256 "$APPROVED_SHA256" \
            --github-output "$GITHUB_OUTPUT" > "$RUNTIME_ROOT/runtime-plan.json"

      - name: Upload non-sensitive candidate plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-interface-simulator-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_ROOT }}/runtime-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove candidate working files
        if: always()
        run: python3 -c 'import os, pathlib, shutil; shutil.rmtree(pathlib.Path(os.environ["RUNTIME_ROOT"]), ignore_errors=True)'

  runtime:
    name: Full Client ${{ matrix.family }} simulator runtime
    if: inputs.execute_runtime
    needs: verify-candidate
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      RUNTIME_ROOT: ${{ github.workspace }}/build-ios/interface-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out reviewed runtime harness without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare private runtime workspace
        run: |
          set -euo pipefail
          test ! -e "$RUNTIME_ROOT"
          install -d -m 0700 "$RUNTIME_ROOT/candidate" "$RUNTIME_ROOT/expanded"

      - name: Redownload and reverify exact simulator candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          APPROVED_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          gh run download "$CANDIDATE_RUN_ID" --name "$CANDIDATE_ARTIFACT_NAME" \
            --dir "$RUNTIME_ROOT/candidate"
          python3 ios/tools/verify-runtime-candidate.py "$RUNTIME_ROOT/candidate" \
            --mode simulator \
            --expected-source-revision "$SOURCE_REVISION" \
            --expected-sha256 "$APPROVED_SHA256" \
            --github-output "$GITHUB_OUTPUT" > "$RUNTIME_ROOT/runtime-plan.json"

      - name: Expand the verified Full Client bundle
        env:
          CANDIDATE_FILE: ${{ steps.candidate.outputs.artifact }}
          APP_ROOT: ${{ steps.candidate.outputs.app_root }}
        run: |
          set -euo pipefail
          ditto -x -k "$RUNTIME_ROOT/candidate/$CANDIDATE_FILE" \
            "$RUNTIME_ROOT/expanded"
          app="$RUNTIME_ROOT/expanded/$APP_ROOT"
          test -d "$app" && test ! -L "$app"

      - name: Run bounded Full Client entity acceptance
        id: runtime-smoke
        env:
          APP_ROOT: ${{ steps.candidate.outputs.app_root }}
          BUNDLE_ID: ${{ steps.candidate.outputs.bundle_id }}
        run: |
          ios/ci/interface-simulator-smoke.sh \
            "$RUNTIME_ROOT/expanded/$APP_ROOT" \
            "$BUNDLE_ID" \
            "${{ matrix.family }}" "$RUNTIME_ROOT/evidence"

      - name: Bind runtime evidence to the verified candidate
        if: always()
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          APPROVED_SHA256: ${{ inputs.artifact_sha256 }}
          BUNDLE_ID: ${{ steps.candidate.outputs.bundle_id }}
          FAMILY: ${{ matrix.family }}
          RUNTIME_OUTCOME: ${{ steps.runtime-smoke.outcome }}
        run: |
          python3 - "$RUNTIME_ROOT/evidence" <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          gate_path = root / f"{os.environ['FAMILY']}-entity-gates.json"
          if not gate_path.is_file():
              raise SystemExit(0)
          gates = json.loads(gate_path.read_text(encoding="utf-8"))
          report = {
              "schemaVersion": 1,
              "status": "passed" if os.environ["RUNTIME_OUTCOME"] == "success" else "failed",
              "formFactor": os.environ["FAMILY"],
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "candidateSha256": os.environ["APPROVED_SHA256"],
              "bundleIdentifier": os.environ["BUNDLE_ID"],
              "requestedDestination": "hifi://overte_hub",
              "destinationBoundToGates": False,
              "entityGates": gates,
              "containsRawRuntimeLog": False,
          }
          (root / f"{os.environ['FAMILY']}-runtime-result.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload privacy-minimal runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-interface-${{ matrix.family }}-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RUNTIME_ROOT }}/evidence/${{ matrix.family }}-entity-gates.json
            ${{ env.RUNTIME_ROOT }}/evidence/${{ matrix.family }}-runtime-result.json
            ${{ env.RUNTIME_ROOT }}/evidence/${{ matrix.family }}-failure.png
          if-no-files-found: warn
          retention-days: 14

      - name: Remove runtime working files
        if: always()
        run: python3 -c 'import os, pathlib, shutil; shutil.rmtree(pathlib.Path(os.environ["RUNTIME_ROOT"]), ignore_errors=True)'
