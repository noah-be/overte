name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "tests/check-documentation.py"
      - "tests/check-documentation-test.py"
      - ".github/workflows/documentation-checks.yml"
  push:
    branches: [main, android-phone, android-vr-pico, apple-ios, apple-macos, linux-main, windows-main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "tests/check-documentation.py"
      - "tests/check-documentation-test.py"
      - ".github/workflows/documentation-checks.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # The exact comparison tree is fetched below. Avoid fetching every
          # intervening commit, branch, and tag in this large repository.
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact documentation comparison tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Check changed documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 tests/check-documentation-test.py
          python3 tests/check-documentation.py --base "$BASE_SHA"
