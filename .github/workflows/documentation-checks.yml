name: Documentation checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "tests/check-documentation.py"
      - ".github/workflows/documentation-checks.yml"
  push:
    branches: [main, android-phone, android-vr-pico, apple-ios, linux-main, windows-main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "tests/check-documentation.py"
      - ".github/workflows/documentation-checks.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # The PR merge commit and its parents are enough for BASE_SHA...HEAD.
          # Avoid fetching every branch and tag in this large repository.
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tests/check-documentation.py --base "$BASE_SHA"
