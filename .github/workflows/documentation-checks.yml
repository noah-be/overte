name: Documentation checks

on:
  workflow_call:
  push:
    branches: [main, android-phone, android-vr-pico, apple-ios]
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify documentation checker behavior
        run: python3 tests/documentation-test.py
      - name: Check every workspace document and incoming link
        run: python3 tests/check-documentation.py --all
      - name: Verify policy-derived branch and suite displays
        run: python3 tools/repository-policy/check.py
