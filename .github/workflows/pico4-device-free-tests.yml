name: Pico 4 device-free tests

on:
  pull_request:
    paths:
      - "android/**"
      - "interface/**"
      - "libraries/**"
      - "scripts/system/**"
      - ".github/workflows/pico4-device-free-tests.yml"
  push:
    branches:
      - feature/pico4-support
      - "test/pico4-*"

permissions:
  contents: read

jobs:
  pico4-device-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install deterministic test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq nodejs openjdk-17-jdk-headless python3
      - name: Run Pico 4 suite
        run: |
          android/tests/pico-device-free-test.sh \
            --timeout 120 \
            --junit build/test-results/pico4-device-free.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pico4-device-free-results
          path: build/test-results/pico4-device-free.xml
          if-no-files-found: error
