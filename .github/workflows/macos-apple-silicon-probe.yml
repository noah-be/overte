name: macOS Apple Silicon GPU probe

on:
  workflow_dispatch:
  # Register and execute this branch-local workflow on its first commit.
  push:
    branches: [apple-macos]
    paths:
      - '.github/workflows/macos-apple-silicon-probe.yml'
      - 'macos/tools/apple-gpu-probe.mm'

permissions:
  contents: read

concurrency:
  group: macos-apple-silicon-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe-m1:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Compile and run CGL 4.1 probe
        run: |
          set -euo pipefail
          mkdir -p build/macos-apple-silicon-probe
          clang++ -std=c++20 -fobjc-arc -framework Foundation -framework OpenGL \
            macos/tools/apple-gpu-probe.mm \
            -o build/macos-apple-silicon-probe/apple-gpu-probe
          build/macos-apple-silicon-probe/apple-gpu-probe | \
            tee build/macos-apple-silicon-probe/opengl.json
          uname -a > build/macos-apple-silicon-probe/kernel.txt
          sw_vers > build/macos-apple-silicon-probe/macos-version.txt
          xcodebuild -version > build/macos-apple-silicon-probe/xcode-version.txt
          system_profiler -json SPHardwareDataType SPDisplaysDataType > \
            build/macos-apple-silicon-probe/system-profiler.json

      - name: Classify native hardware eligibility
        run: |
          set -euo pipefail
          translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || printf '0')"
          python3 - build/macos-apple-silicon-probe/opengl.json \
            build/macos-apple-silicon-probe/system-profiler.json \
            build/macos-apple-silicon-probe/result.json "$(uname -m)" "$translated" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          gl_path, system_path, output_path, machine, translated = sys.argv[1:]
          gl = json.loads(Path(gl_path).read_text(encoding="utf-8"))
          system = json.loads(Path(system_path).read_text(encoding="utf-8"))
          renderer = str(gl.get("gl_renderer", ""))
          diagnostic_tokens = (
              "software", "paravirtual", "virtual", "swiftshader", "llvmpipe", "softpipe",
          )
          native = machine == "arm64" and translated == "0"
          hardware_renderer = bool(renderer) and not any(
              token in renderer.lower() for token in diagnostic_tokens
          )
          eligible = (
              native and gl.get("context_created") is True and gl.get("accelerated") is True
              and hardware_renderer
          )
          result = {
              "schema_version": 1,
              "machine": machine,
              "translated": translated == "1",
              "context_created": gl.get("context_created") is True,
              "accelerated": gl.get("accelerated") is True,
              "gl_vendor": gl.get("gl_vendor", ""),
              "gl_renderer": renderer,
              "gl_version": gl.get("gl_version", ""),
              "hardware_eligible": eligible,
              "classification": "native-hardware" if eligible else "diagnostic-only",
              "system_profiler_present": bool(system),
          }
          target = Path(output_path)
          target.write_text(json.dumps(result, sort_keys=True) + "\n", encoding="utf-8")
          os.chmod(target, 0o600)
          print(json.dumps(result, sort_keys=True), flush=True)
          PY

      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overte-macos-apple-silicon-probe-${{ github.run_id }}
          path: build/macos-apple-silicon-probe
          if-no-files-found: error
          retention-days: 14
