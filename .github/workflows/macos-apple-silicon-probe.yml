name: macOS Apple Silicon GPU probe

on:
  workflow_dispatch:
  # Register and execute this branch-local workflow on its first commit.
  push:
    branches: [apple-macos]
    paths:
      - '.github/workflows/macos-apple-silicon-probe.yml'
      - 'macos/tools/apple-gpu-probe.mm'
      - 'macos/tools/validate-apple-gpu-probe.py'

permissions:
  contents: read

concurrency:
  group: macos-apple-silicon-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe-m1:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Compile and run CGL 4.1 probe
        run: |
          set -euo pipefail
          mkdir -p build/macos-apple-silicon-probe
          sw_vers > build/macos-apple-silicon-probe/macos-version.txt
          xcodebuild -version > build/macos-apple-silicon-probe/xcode-version.txt
          clang++ -std=c++20 -fobjc-arc -DGL_SILENCE_DEPRECATION \
            -framework Foundation -framework OpenGL \
            macos/tools/apple-gpu-probe.mm \
            -o "$RUNNER_TEMP/overte-apple-gpu-probe" 2>&1 | \
            tee build/macos-apple-silicon-probe/compile.log
          "$RUNNER_TEMP/overte-apple-gpu-probe" > "$RUNNER_TEMP/opengl.json"

      - name: Classify native hardware eligibility
        if: ${{ always() }}
        run: |
          set -euo pipefail
          translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || printf '0')"
          python3 macos/tools/validate-apple-gpu-probe.py \
            "$RUNNER_TEMP/opengl.json" --machine "$(uname -m)" \
            --translated "$translated" \
            --result build/macos-apple-silicon-probe/result.json

      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overte-macos-apple-silicon-probe-${{ github.run_id }}
          path: build/macos-apple-silicon-probe
          if-no-files-found: error
          retention-days: 14
