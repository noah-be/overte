# Unenrolled future Android owner recipe; no active workflow or catalog pin installs this source.
name: Parent qualification
permissions:
  contents: read
concurrency:
  group: parent-qualification-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  route:
    name: Plan current parent owners
    if: contains(fromJSON('["android-main","android-vr"]'), github.ref_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    outputs:
      parent_candidate: ${{ steps.plan.outputs.parent_candidate }}
      parent_plan: ${{ steps.plan.outputs.parent_plan }}
      platform_required: ${{ steps.plan.outputs.platform_required }}
    steps:
    - name: Check out trusted shared execution policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github
          tools/test-evidence
          tools/sync-test-reuse
          tools/repository-checks
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact parent commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Authenticate the protected base commitment before repository imports
      id: protected-source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        /usr/bin/python3 -I -S -B - <<'SOURCE_GUARD'
        # Fixed native recipe bootstrap. No repository module is imported here.
        import hashlib, json, os, re, stat, subprocess, time, urllib.request
        from pathlib import Path

        deadline=time.monotonic()+45
        def need(value):
            if not value: raise ValueError('protected source unavailable')
        def unique(pairs):
            value={}
            for key,item in pairs:
                need(key not in value); value[key]=item
            return value
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, response, code, message, headers, target):
                raise ValueError('protected source redirect denied')
        def get(endpoint):
            request=urllib.request.Request('https://api.github.com/repos/noah-l-frank/overte/'+endpoint,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='GET')
            remaining=deadline-time.monotonic();need(remaining>0)
            with urllib.request.build_opener(NoRedirect()).open(request,timeout=min(10,remaining)) as response:
                need(response.status==200 and response.geturl()==request.full_url)
                raw=response.read(16000001)
            need(len(raw)<=16000000 and time.monotonic()<=deadline)
            return json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _: need(False))
        admitted=False
        try:
            targets={'main','android-main','android-phone','android-vr','android-vr-pico','apple-main','apple-ios'}
            need(os.environ.get('GITHUB_REPOSITORY')=='noah-l-frank/overte' and os.environ.get('GITHUB_REPOSITORY_ID')=='1319052603')
            event_path=Path(os.environ['GITHUB_EVENT_PATH'])
            need(not event_path.is_symlink() and event_path.is_file() and event_path.stat().st_size<=1000000)
            event=json.loads(event_path.read_bytes(),object_pairs_hook=unique)
            pr=event.get('pull_request')
            target=pr.get('base',{}).get('ref') if isinstance(pr,dict) else os.environ.get('GITHUB_REF','').removeprefix('refs/heads/')
            base=pr.get('base',{}).get('sha') if isinstance(pr,dict) else event.get('before')
            source=os.environ.get('GITHUB_SHA','')
            need(target in targets and type(base) is str and re.fullmatch('[0-9a-f]{40}',base) and re.fullmatch('[0-9a-f]{40}',source))
            branch=get('branches/'+target)
            need(branch.get('protected') is True and branch.get('name')==target and branch.get('commit',{}).get('sha')==(base if isinstance(pr,dict) else source))
            commit=get('git/commits/'+base)
            tree=commit.get('tree',{}).get('sha')
            need(commit.get('sha')==base and type(tree) is str and re.fullmatch('[0-9a-f]{40}',tree))
            inventory=get('git/trees/'+tree+'?recursive=1')
            need(inventory.get('sha')==tree and inventory.get('truncated') is False and type(inventory.get('tree')) is list)
            name='tools/test-evidence/source_admission.py'
            entries=[row for row in inventory['tree'] if isinstance(row,dict) and row.get('path')==name]
            need(len(entries)==1 and entries[0].get('mode')=='100644' and entries[0].get('type')=='blob')
            root=Path('trusted').absolute()
            path=root/name
            current=Path(path.anchor)
            for part in path.parts[1:]:
                current/=part;need(not current.is_symlink())
            info=path.stat();need(stat.S_ISREG(info.st_mode) and not info.st_mode&0o111 and info.st_size<=1000000)
            body=path.read_bytes();need(len(body)<=1000000)
            need(hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entries[0].get('sha'))
            scope={'__name__':'protected_source_bootstrap','__file__':str(path)}
            exec(compile(body,str(path),'exec'),scope)
            scope['authenticate'](event,os.environ,scope['GitHubSource'](deadline=deadline),root)
            admitted=True
        except (ValueError,OSError,KeyError,TypeError,AttributeError,RuntimeError,subprocess.SubprocessError):
            pass
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('admitted='+str(admitted).lower()+'\n')
        print('Protected source commitment '+('admitted.' if admitted else 'unavailable; existing execution remains required.'))
        SOURCE_GUARD
    - name: Require current parent route source admission
      env:
        ADMITTED: ${{ steps.protected-source.outputs.admitted }}
      run: test "$ADMITTED" = true
    - name: Independently derive current parent owners
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")'
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py parent-route --candidate "$GITHUB_WORKSPACE/candidate"
  common-parent:
    needs: route
    if: always() && !cancelled() && (needs.route.result == 'success' || (needs.route.result == 'skipped' && contains(fromJSON('["main","apple-main"]'), github.ref_name)))
    name: Common parent tests
    runs-on: ubuntu-24.04
    env:
      OVERTE_QML_TEST_RUNNER: /usr/lib/qt6/bin/qmltestrunner
    timeout-minutes: 30
    steps:
    - name: Check out trusted shared execution policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github
          tools/test-evidence
          tools/sync-test-reuse
          tools/repository-checks
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Authenticate the protected base commitment before repository imports
      id: protected-source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        /usr/bin/python3 -I -S -B - <<'SOURCE_GUARD'
        # Fixed native recipe bootstrap. No repository module is imported here.
        import hashlib, json, os, re, stat, subprocess, time, urllib.request
        from pathlib import Path

        deadline=time.monotonic()+45
        def need(value):
            if not value: raise ValueError('protected source unavailable')
        def unique(pairs):
            value={}
            for key,item in pairs:
                need(key not in value); value[key]=item
            return value
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, response, code, message, headers, target):
                raise ValueError('protected source redirect denied')
        def get(endpoint):
            request=urllib.request.Request('https://api.github.com/repos/noah-l-frank/overte/'+endpoint,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='GET')
            remaining=deadline-time.monotonic();need(remaining>0)
            with urllib.request.build_opener(NoRedirect()).open(request,timeout=min(10,remaining)) as response:
                need(response.status==200 and response.geturl()==request.full_url)
                raw=response.read(16000001)
            need(len(raw)<=16000000 and time.monotonic()<=deadline)
            return json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _: need(False))
        admitted=False
        try:
            targets={'main','android-main','android-phone','android-vr','android-vr-pico','apple-main','apple-ios'}
            need(os.environ.get('GITHUB_REPOSITORY')=='noah-l-frank/overte' and os.environ.get('GITHUB_REPOSITORY_ID')=='1319052603')
            event_path=Path(os.environ['GITHUB_EVENT_PATH'])
            need(not event_path.is_symlink() and event_path.is_file() and event_path.stat().st_size<=1000000)
            event=json.loads(event_path.read_bytes(),object_pairs_hook=unique)
            pr=event.get('pull_request')
            target=pr.get('base',{}).get('ref') if isinstance(pr,dict) else os.environ.get('GITHUB_REF','').removeprefix('refs/heads/')
            base=pr.get('base',{}).get('sha') if isinstance(pr,dict) else event.get('before')
            source=os.environ.get('GITHUB_SHA','')
            need(target in targets and type(base) is str and re.fullmatch('[0-9a-f]{40}',base) and re.fullmatch('[0-9a-f]{40}',source))
            branch=get('branches/'+target)
            need(branch.get('protected') is True and branch.get('name')==target and branch.get('commit',{}).get('sha')==(base if isinstance(pr,dict) else source))
            commit=get('git/commits/'+base)
            tree=commit.get('tree',{}).get('sha')
            need(commit.get('sha')==base and type(tree) is str and re.fullmatch('[0-9a-f]{40}',tree))
            inventory=get('git/trees/'+tree+'?recursive=1')
            need(inventory.get('sha')==tree and inventory.get('truncated') is False and type(inventory.get('tree')) is list)
            name='tools/test-evidence/source_admission.py'
            entries=[row for row in inventory['tree'] if isinstance(row,dict) and row.get('path')==name]
            need(len(entries)==1 and entries[0].get('mode')=='100644' and entries[0].get('type')=='blob')
            root=Path('trusted').absolute()
            path=root/name
            current=Path(path.anchor)
            for part in path.parts[1:]:
                current/=part;need(not current.is_symlink())
            info=path.stat();need(stat.S_ISREG(info.st_mode) and not info.st_mode&0o111 and info.st_size<=1000000)
            body=path.read_bytes();need(len(body)<=1000000)
            need(hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entries[0].get('sha'))
            scope={'__name__':'protected_source_bootstrap','__file__':str(path)}
            exec(compile(body,str(path),'exec'),scope)
            scope['authenticate'](event,os.environ,scope['GitHubSource'](deadline=deadline),root)
            admitted=True
        except (ValueError,OSError,KeyError,TypeError,AttributeError,RuntimeError,subprocess.SubprocessError):
            pass
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('admitted='+str(admitted).lower()+'\n')
        print('Protected source commitment '+('admitted.' if admitted else 'unavailable; existing execution remains required.'))
        SOURCE_GUARD
    - name: Look up original protected PR proof before candidate setup
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if test '${{ steps.protected-source.outputs.admitted }}' = true; then
          /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")' trusted/tools/test-evidence trusted/tools/test-evidence/postmerge.py --report build/parent-qualification/original-proof.json
        else
          printf '%s\n' 'shared_reused=false' 'package_work=true' 'no_execution=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Require an explicit reuse or actual-execution route
      env:
        SHARED_REUSED: ${{ steps.reuse.outputs.shared_reused }}
        PACKAGE_WORK: ${{ steps.reuse.outputs.package_work }}
        NO_EXECUTION: ${{ steps.reuse.outputs.no_execution }}
      run: |
        case "$SHARED_REUSED/$PACKAGE_WORK/$NO_EXECUTION" in
          true/true/false|true/false/false|false/true/false|false/false/true) ;;
          *) printf '%s\n' 'Missing or inconsistent original-proof route' >&2; exit 1 ;;
        esac
    - name: Check out the exact parent commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
    - name: Materialize the exact live parent ref
      working-directory: candidate
      env:
        PARENT_BRANCH: ${{ github.ref_name }}
      run: git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/$PARENT_BRANCH"
      if: steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true'
    - name: Independently select host and package checks
      id: route
      run: python3 trusted/tools/repository-checks/package_checks.py plan --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      if: steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true'
    - name: Require unchanged scheduling to match actual inputs
      if: steps.reuse.outputs.no_execution == 'true'
      env:
        ACTUAL_MODE: ${{ steps.route.outputs.package_host_mode }}
      run: test "$ACTUAL_MODE" = unchanged
    - name: Independently verify unchanged parent inputs
      if: steps.route.outputs.package_host_mode == 'unchanged'
      env:
        GH_TOKEN: ${{ github.token }}
      run: /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")'
        trusted/tools/test-evidence trusted/tools/test-evidence/postmerge.py --verify-empty --candidate candidate
        --report build/parent-qualification/no-execution.json
    - name: Set up Python
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
      if: (steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true') && steps.route.outputs.package_host_mode != 'unchanged'
    - name: Set up Java
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify runner prerequisites
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      run: |
        set -euo pipefail
        command -v bash
        command -v jq
        command -v cmake
        command -v ctest
        python3 --version
        node --version
        java -version
    - name: Independently select affected parent host contracts
      id: host
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      env:
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/host_selection.py --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --expected-plan "$EXPECTED_PLAN" --select-only --output "$GITHUB_OUTPUT" --selection-report
        build/parent-qualification/host-selection.json
    - name: Require a complete host execution route
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      env:
        FULL_HOST: ${{ steps.host.outputs.full_host }}
        COMPLETE_RECEIPT: ${{ steps.host.outputs.complete_receipt }}
      run: |
        case "$FULL_HOST/$COMPLETE_RECEIPT" in
          true/true|true/false|false/false) ;;
          *) printf '%s\n' 'Missing or inconsistent parent host selection' >&2; exit 1 ;;
        esac
    - name: Install QML and portable C++ contract prerequisites
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.host.outputs.full_host == 'true')
      run: |
        set -euo pipefail
        sudo apt-get -o Acquire::Retries=4 update
        sudo apt-get -o Acquire::Retries=4 install --no-install-recommends -y \
          qml-module-qttest qtdeclarative5-dev-tools qt6-base-dev qt6-base-dev-tools libglm-dev \
          qtdeclarative5-dev qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 \
          qt6-declarative-dev qt6-declarative-dev-tools qt6-webchannel-dev libqt5webchannel5-dev \
          qml-module-qt-labs-folderlistmodel qml6-module-qt-labs-folderlistmodel \
          qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
          qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
          qml6-module-qtquick-templates qml6-module-qtquick-window \
          qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest
        pkg-config --print-errors --exists Qt5Quick Qt5WebChannel Qt5Network Qt6Quick Qt6WebChannel Qt6Network
    - name: Prepare isolated host evidence validators
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      run: |
        # Ubuntu 24.04 restricts user namespaces through AppArmor. Permit
        # offline test sandboxes only on this disposable GitHub-hosted VM.
        # Tests still run as the runner user and must pass the isolation probe.
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare --user --map-root-user --net true
        python3 -m venv build/host-tests-env
        build/host-tests-env/bin/python -m pip install --disable-pip-version-check -r trusted/tests/requirements-host.txt
    - name: Execute common parent suites without claiming platform evidence
      if: steps.reuse.outputs.shared_reused != 'true' && needs.route.outputs.platform_required == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: build/host-tests-env/bin/python -I -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")'
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py fallback-common --candidate
        "$GITHUB_WORKSPACE/candidate"
    - name: Run complete host qualification
      if: needs.route.outputs.platform_required != 'true' && (steps.reuse.outputs.shared_reused != 'true' &&
        (steps.host.outputs.complete_receipt == 'true'))
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: build/host-tests-env/bin/python trusted/tools/test-evidence/run.py --candidate candidate --include-platform
        --timeout 240 --host-timeout 900 --junit build/test-results/parent-project-tests.xml --receipt build/parent-qualification/execution.json
    - name: Run independently selected parent host contracts
      if: needs.route.outputs.platform_required != 'true' && (steps.reuse.outputs.shared_reused != 'true' &&
        (steps.route.outputs.package_host_mode == 'full' && steps.host.outputs.complete_receipt == 'false'))
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: build/host-tests-env/bin/python trusted/tools/repository-checks/host_selection.py --candidate candidate
        --event "$GITHUB_EVENT_PATH" --sha "$GITHUB_SHA" --expected-plan "$EXPECTED_PLAN" --junit build/test-results/parent-project-tests.xml
        --selection-report build/parent-qualification/host-selection.json
    - name: Create content-addressed qualification evidence
      if: needs.route.outputs.platform_required != 'true' && (steps.reuse.outputs.shared_reused != 'true' &&
        (steps.host.outputs.complete_receipt == 'true'))
      env:
        PARENT_BRANCH: ${{ github.ref_name }}
        PARENT_COMMIT: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_ID: ${{ github.event.repository.id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
      run: build/host-tests-env/bin/python trusted/tools/sync-test-reuse/qualification.py --candidate candidate
        --execution-receipt build/parent-qualification/execution.json --repository "$REPOSITORY" --repository-id
        "$REPOSITORY_ID" --parent-branch "$PARENT_BRANCH" --commit "$PARENT_COMMIT" --run-id "$RUN_ID" --run-attempt
        "$RUN_ATTEMPT" --output build/parent-qualification/qualification.json
    - name: Upload immutable qualification evidence
      if: needs.route.outputs.platform_required != 'true' && (steps.reuse.outputs.shared_reused != 'true' &&
        (steps.host.outputs.complete_receipt == 'true'))
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: parent-qualification-${{ github.sha }}
        path: build/parent-qualification/qualification.json
        if-no-files-found: error
        retention-days: 4
    - name: Upload qualification test reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: parent-qualification-reports-${{ github.sha }}-${{ github.run_attempt }}
        path: |-
          build/test-results/
          candidate/build/test-results/
          build/parent-qualification/execution.json
          build/parent-qualification/host-selection.json

          build/parent-qualification/original-proof.json
          build/parent-qualification/no-execution.json
        if-no-files-found: warn
        retention-days: 7
    - name: Check only affected tool dependencies and behavior
      if: steps.route.outputs.package_host_mode == 'tool-dependencies'
      env:
        EXPECTED_CANDIDATE: ${{ steps.route.outputs.package_candidate }}
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/package_checks.py run --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan
        "$EXPECTED_PLAN" --lane tool-dependencies
    - name: Check independently selected S3 package dependencies and behavior
      if: (steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true') && steps.route.outputs.package_set
        != '[]'
      env:
        EXPECTED_CANDIDATE: ${{ steps.route.outputs.package_candidate }}
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/package_checks.py run --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan
        "$EXPECTED_PLAN" --lane package-checks
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
  platform-tests:
    needs: route
    name: Android platform tests
    if: needs.route.result == 'success' && needs.route.outputs.platform_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      verified: ${{ steps.execute.outputs.platform_verified || 'false' }}
      partition: ${{ steps.execute.outputs.platform_plan || '' }}
      required: ${{ steps.plan.outputs.platform_required }}
    steps:
    - name: Check out the authenticated platform controller
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
    - name: Check out exact platform candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Authenticate the protected base commitment before repository imports
      id: protected-source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        /usr/bin/python3 -I -S -B - <<'SOURCE_GUARD'
        # Fixed native recipe bootstrap. No repository module is imported here.
        import hashlib, json, os, re, stat, subprocess, time, urllib.request
        from pathlib import Path

        deadline=time.monotonic()+45
        def need(value):
            if not value: raise ValueError('protected source unavailable')
        def unique(pairs):
            value={}
            for key,item in pairs:
                need(key not in value); value[key]=item
            return value
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, response, code, message, headers, target):
                raise ValueError('protected source redirect denied')
        def get(endpoint):
            request=urllib.request.Request('https://api.github.com/repos/noah-l-frank/overte/'+endpoint,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='GET')
            remaining=deadline-time.monotonic();need(remaining>0)
            with urllib.request.build_opener(NoRedirect()).open(request,timeout=min(10,remaining)) as response:
                need(response.status==200 and response.geturl()==request.full_url)
                raw=response.read(16000001)
            need(len(raw)<=16000000 and time.monotonic()<=deadline)
            return json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _: need(False))
        admitted=False
        try:
            targets={'main','android-main','android-phone','android-vr','android-vr-pico','apple-main','apple-ios'}
            need(os.environ.get('GITHUB_REPOSITORY')=='noah-l-frank/overte' and os.environ.get('GITHUB_REPOSITORY_ID')=='1319052603')
            event_path=Path(os.environ['GITHUB_EVENT_PATH'])
            need(not event_path.is_symlink() and event_path.is_file() and event_path.stat().st_size<=1000000)
            event=json.loads(event_path.read_bytes(),object_pairs_hook=unique)
            pr=event.get('pull_request')
            target=pr.get('base',{}).get('ref') if isinstance(pr,dict) else os.environ.get('GITHUB_REF','').removeprefix('refs/heads/')
            base=pr.get('base',{}).get('sha') if isinstance(pr,dict) else event.get('before')
            source=os.environ.get('GITHUB_SHA','')
            need(target in targets and type(base) is str and re.fullmatch('[0-9a-f]{40}',base) and re.fullmatch('[0-9a-f]{40}',source))
            branch=get('branches/'+target)
            need(branch.get('protected') is True and branch.get('name')==target and branch.get('commit',{}).get('sha')==(base if isinstance(pr,dict) else source))
            commit=get('git/commits/'+base)
            tree=commit.get('tree',{}).get('sha')
            need(commit.get('sha')==base and type(tree) is str and re.fullmatch('[0-9a-f]{40}',tree))
            inventory=get('git/trees/'+tree+'?recursive=1')
            need(inventory.get('sha')==tree and inventory.get('truncated') is False and type(inventory.get('tree')) is list)
            name='tools/test-evidence/source_admission.py'
            entries=[row for row in inventory['tree'] if isinstance(row,dict) and row.get('path')==name]
            need(len(entries)==1 and entries[0].get('mode')=='100644' and entries[0].get('type')=='blob')
            root=Path('trusted').absolute()
            path=root/name
            current=Path(path.anchor)
            for part in path.parts[1:]:
                current/=part;need(not current.is_symlink())
            info=path.stat();need(stat.S_ISREG(info.st_mode) and not info.st_mode&0o111 and info.st_size<=1000000)
            body=path.read_bytes();need(len(body)<=1000000)
            need(hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entries[0].get('sha'))
