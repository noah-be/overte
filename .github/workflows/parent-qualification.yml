            admitted=True
        except (ValueError,OSError,KeyError,TypeError,AttributeError,RuntimeError,subprocess.SubprocessError):
            pass
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('admitted='+str(admitted).lower()+'\n')
        print('Protected source commitment '+('admitted.' if admitted else 'unavailable; existing execution remains required.'))
        SOURCE_GUARD
    - name: Require unchanged platform source admission
      env:
        ADMITTED: ${{ steps.protected-source.outputs.admitted }}
      run: test "$ADMITTED" = true
    - name: Independently derive the complete current platform inventory
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")'
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py platform-plan --candidate "$GITHUB_WORKSPACE/candidate"
    - name: Set up platform Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Set up platform Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Set up platform Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Prepare fixed platform host prerequisites
      run: |-
        set -euo pipefail
        sudo -n /usr/bin/apt-get update
        sudo -n /usr/bin/apt-get install --no-install-recommends -y cmake ninja-build g++ make pkg-config jq
        if test "${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" = android-phone; then
          sudo -n /usr/bin/apt-get install --no-install-recommends -y qt6-base-dev qt6-base-dev-tools
        fi
        toolkit="$RUNNER_TEMP/android-platform-tools"
        mkdir "$toolkit"
        for tool in cmake ctest ninja; do ln -s "/usr/bin/$tool" "$toolkit/$tool"; done
        export PATH="$toolkit:$PATH"
        test -x /usr/bin/cmake && test -x /usr/bin/ctest && test -x /usr/bin/ninja
        # Preserve neutral-bootstrap's actual offline namespace check.
        sudo -n /usr/sbin/sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        python3 -m venv "$RUNNER_TEMP/android-platform-venv"
        "$RUNNER_TEMP/android-platform-venv/bin/python" -m pip install --disable-pip-version-check -r trusted/tests/requirements-host.txt
        printf '%s\n' "$toolkit" >> "$GITHUB_PATH"
        # No APK/SDK installation or application/device build. Phone NDK absence fails the controller.
      if: steps.plan.outputs.platform_required == 'true'
    - name: Execute and verify the complete Android platform inventory
      id: execute
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RUNNER_TEMP/android-platform-venv/bin/python" -I -B -c ''import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")''
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py platform --candidate "$GITHUB_WORKSPACE/candidate"'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Upload platform diagnostics only
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: android-platform-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-platform-report/platform.xml
        if-no-files-found: warn
        retention-days: 7
  qualify-parent:
    name: Qualify exact parent
    if: always()
    needs:
    - route
