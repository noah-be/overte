name: Parent qualification

on:
  push:
    branches: [main, android-main, android-vr, apple-main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: parent-qualification-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  qualify-parent:
    name: Qualify exact parent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact parent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize the exact live parent ref
        env:
          PARENT_BRANCH: ${{ github.ref_name }}
        run: git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/$PARENT_BRANCH"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v bash
          command -v jq
          command -v cmake
          command -v ctest
          python3 --version
          node --version
          java -version
      - name: Install QML and portable C++ contract prerequisites
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=4 update
          sudo apt-get -o Acquire::Retries=4 install --no-install-recommends -y \
            qml-module-qttest qtdeclarative5-dev-tools qt6-base-dev qt6-base-dev-tools
      - name: Prepare isolated host evidence validators
        run: |
          unshare --user --map-root-user --net true
          python3 -m venv build/host-tests-env
          build/host-tests-env/bin/python -m pip install --disable-pip-version-check -r tests/requirements-host.txt
      - name: Run complete host qualification
        run: >-
          build/host-tests-env/bin/python tests/run-project-tests.py
          --profile host --timeout 240 --host-timeout 900
          --junit build/test-results/parent-project-tests.xml
      - name: Create content-addressed qualification evidence
        env:
          PARENT_BRANCH: ${{ github.ref_name }}
          PARENT_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: >-
          build/host-tests-env/bin/python tools/sync-test-reuse/qualification.py
          --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID"
          --parent-branch "$PARENT_BRANCH" --commit "$PARENT_COMMIT"
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --output build/parent-qualification/qualification.json
      - name: Upload immutable qualification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parent-qualification-${{ github.sha }}
          path: build/parent-qualification/qualification.json
          if-no-files-found: error
          retention-days: 4
      - name: Upload qualification test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: parent-qualification-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 7
