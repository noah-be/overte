name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "17 3 * * 4"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select affected CodeQL languages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.plan.outputs.languages }}
      scan: ${{ steps.plan.outputs.scan }}
    steps:
      - name: Check out trusted analysis policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            tools/repository-checks
            tools/test-evidence

      - name: Read the exact candidate inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github

      - name: Select complete affected language analyses
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 trusted/tools/repository-checks/codeql.py \
            --root candidate --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA" \
            --event "$EVENT_NAME" > codeql-plan.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('codeql-plan.json').read_text())
          languages = plan['languages']
          assert plan['schema'] == 1 and isinstance(languages, list)
          assert languages == [value for value in ('javascript-typescript', 'python') if value in languages]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('languages=' + json.dumps(languages) + '\n')
              output.write('scan=' + str(bool(languages)).lower() + '\n')
          print(json.dumps(plan, sort_keys=True))
          PY

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: select
    if: needs.select.outputs.scan == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.select.outputs.languages) }}
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  codeql-checks:
    name: codeql-checks
    if: always()
    needs: [select, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every selected analysis
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          SCAN: ${{ needs.select.outputs.scan }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          set -euo pipefail
          test "$SELECT_RESULT" = success
          case "$SCAN:$ANALYZE_RESULT" in
            true:success|false:skipped) ;;
            *) echo 'Selected CodeQL analysis did not succeed' >&2; exit 1 ;;
          esac
