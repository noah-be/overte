name: macOS bootstrap

on:
  workflow_dispatch:
    inputs:
      run_native_tests:
        description: Build and execute every registered C++/Qt CTest target
        required: true
        default: false
        type: boolean
      target_arch:
        description: Target architecture (arm64 builds Qt from source)
        required: true
        default: x86_64
        type: choice
        options: [x86_64, arm64]
      arm_runner_size:
        description: ARM runner size (standard is slower; xlarge requires larger-runner billing)
        required: true
        default: standard
        type: choice
        options: [standard, xlarge]
  push:
    branches: [apple-macos]
    paths:
      - '.github/workflows/macos-bootstrap.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'conanfile.py'
      - 'interface/**'
      - 'libraries/**'
      - 'macos/**'
      - '!macos/tools/apple-gpu-probe.mm'
      - 'plugins/**'
      - '!**/*.md'

permissions:
  contents: read
  # Read durable dependency artifacts and prune only obsolete, branch-local
  # compiler-object generations after the replacement is verified.
  actions: write

concurrency:
  group: macos-bootstrap-${{ github.ref }}
  # A replacement run must not discard an expensive compiler-cache generation.
  cancel-in-progress: false

jobs:
  client-opengl-x86_64:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.target_arch == 'arm64' && inputs.arm_runner_size == 'xlarge' && 'macos-15-xlarge' || github.event_name == 'workflow_dispatch' && inputs.target_arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 360
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      OVERTE_MACOS_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_arch == 'arm64' && 'arm64' || 'x86_64' }}
      OVERTE_MACOS_BUILD_TYPE: RelWithDebInfo
      OVERTE_MACOS_QT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_arch == 'arm64' && 'source' || 'aqt' }}
      OVERTE_MACOS_BUILD_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.target_arch == 'arm64' && inputs.arm_runner_size == 'standard' && '2' || '' }}
      # Keep one reusable CMake/Ninja graph. The workflow input below controls
      # only whether the registered test targets are compiled and executed.
      OVERTE_MACOS_BUILD_TESTS: 'ON'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CONF: ${{ github.workspace }}/macos/ci/sccache.toml
      SCCACHE_CACHE_SIZE: 512M
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CLIENT_SIDE: '1'
      SCCACHE_MULTILEVEL_CHAIN: disk,gha
      SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY: all
      SCCACHE_GHA_ENABLED: 'true'
      MACOS_RUNNER_TELEMETRY_DIR: ${{ github.workspace }}/.macos-runner-telemetry
      PYTHONUNBUFFERED: '1'
      OVERTE_COMPILER_WATCHDOG: ${{ github.workspace }}/macos/ci/compiler-watchdog.py
      # A cold LLDB launch on the hosted Intel runner spends close to 90 seconds
      # in startup before the online smoke reaches the reproducible crash site.
      # Keep enough bounded time to capture the stopped process and backtrace.
      OVERTE_MACOS_LLDB_TIMEOUT_SECONDS: '300'
      CMAKE_C_COMPILER_LAUNCHER: ${{ github.workspace }}/macos/ci/compiler-watchdog.py;--
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ github.workspace }}/macos/ci/compiler-watchdog.py;--
      CMAKE_OBJC_COMPILER_LAUNCHER: ${{ github.workspace }}/macos/ci/compiler-watchdog.py;--
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ${{ github.workspace }}/macos/ci/compiler-watchdog.py;--
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned per-object remote compiler checkpoint
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: true

      - name: Export remote compiler checkpoint credentials
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const cacheUrl = process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL;
            const runtimeToken = process.env.ACTIONS_RUNTIME_TOKEN;
            if (!cacheUrl || !runtimeToken) {
              core.setFailed("GitHub Actions cache-service credentials are unavailable");
              return;
            }
            core.setSecret(runtimeToken);
            core.exportVariable("SCCACHE_GHA_CACHE_URL", cacheUrl);
            core.exportVariable("SCCACHE_GHA_RUNTIME_TOKEN", runtimeToken);

      - name: Select build-tool cache key
        id: tooling-key
        shell: bash
        run: |
          set -euo pipefail
          python_identity="$(python3 -VV)"
          tooling_inputs="$(shasum -a 256 macos/requirements-build.txt | awk '{print $1}')"
          fingerprint="$(printf '%s\n' "$python_identity" "$RUNNER_ARCH" "$tooling_inputs" | shasum -a 256 | awk '{print $1}')"
          echo "key=macos-build-tooling-v1-${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Restore pinned build tools
        id: tooling-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build-tooling-venv
          key: ${{ steps.tooling-key.outputs.key }}

      - name: Install build tools
        timeout-minutes: 15
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          python3 macos/ci/runner-telemetry.py \
            --phase build-tools \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/build-tools.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/build-tools-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 600 --max-runtime 600 \
            --watch tooling=build-tooling-venv -- \
            bash -euo pipefail -c '
              if [[ ! -x build-tooling-venv/bin/python3 ]]; then
                python3 -m venv build-tooling-venv
              fi
              build-tooling-venv/bin/pip install --disable-pip-version-check \
                -r macos/requirements-build.txt
              build-tooling-venv/bin/pip check
            '
          echo "$GITHUB_WORKSPACE/build-tooling-venv/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/build-tooling-venv/bin:$PATH"
          [[ "$(conan --version)" == "Conan version 2.31.2" ]]
          # aqt deliberately writes its version banner through logging/stderr.
          aqt version 2>&1 | grep -Fq 'aqtinstall(aqt) v3.3.0'

      - name: Save pinned build tools
        if: ${{ steps.tooling-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build-tooling-venv
          key: ${{ steps.tooling-key.outputs.key }}

      - name: Check host toolchain
        timeout-minutes: 5
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')"
          physical_bytes="$(sysctl -n hw.memsize)"
          minimum_memory_bytes=12884901888
          if [[ "$OVERTE_MACOS_ARCH" == arm64 && "${{ inputs.arm_runner_size }}" == standard ]]; then
            minimum_memory_bytes=6442450944
          fi
          [[ "$available_kib" -ge 41943040 ]] || { echo "less than 40 GiB runner disk available" >&2; exit 1; }
          [[ "$physical_bytes" -ge "$minimum_memory_bytes" ]] || { echo "runner RAM is below the selected route's safe minimum" >&2; exit 1; }
          macos/build-macos.sh doctor

      - name: Verify macOS monitoring contracts
        run: |
          python3 macos/tests/source-contract-test.py
          python3 macos/tests/conan-checkpoint-test.py
          python3 macos/tests/sccache-remote-checkpoint-test.py

      - name: Select deterministic toolchain and cache keys
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(xcrun --find clang)"
          compiler_digest="$(shasum -a 256 "$compiler" | awk '{print $1}')"
          compiler_version="$("$compiler" --version | awk 'NR == 1 {print}')"
          xcode_build="$(xcodebuild -version | awk '/Build version/{print $3}')"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          sdk_build="$(xcrun --sdk macosx --show-sdk-build-version)"
          # Preserve the superseded v2 formula only for the one-time ordered
          # build-tree migration. New dependency/build namespaces deliberately
          # exclude CMake graph files: CMake is an exact-tree input and sccache
          # hashes flags itself; changing a deploy macro must not discard Conan.
          legacy_toolchain_inputs="$(git ls-files -s -- conanfile.py 'macos/conan/**' \
            CMakeLists.txt 'cmake/**' macos/build-macos.sh \
            | shasum -a 256 | awk '{print $1}')"
          # Only the dependency half of build-macos.sh belongs in the Conan
          # compatibility key. Configure/compile/watchdog changes below the
          # configure() boundary must not discard a verified 2.8-GiB package
          # graph. Recipe, option, remote, architecture, and doctor/preflight
          # changes remain covered by the exact prefix content.
          dependency_script_inputs="$(sed -n '1,/^configure() {/p' \
            macos/build-macos.sh | sed '$d' | shasum -a 256 | awk '{print $1}')"
          dependency_inputs="$({
            git ls-files -s -- conanfile.py 'macos/conan/**' \
              macos/requirements-build.txt
            printf '%s\n' "$dependency_script_inputs"
          } | shasum -a 256 | awk '{print $1}')"
          # Exact build-tree reuse tracks inputs that CMake scans, compiles, or
          # copies into Overte.app. Runtime smokes, benchmark analyzers,
          # telemetry, watchdogs, and checkpoint implementations deliberately
          # remain outside this content hash: they do not change the graph or
          # bundle and should reuse its exact checkpoint.
          source_inputs="$({
            git ls-files -s -- conanfile.py 'macos/conan/**' \
              CMakeLists.txt 'cmake/**' 'interface/**' 'libraries/**' 'plugins/**' \
              'server-console/**' tests/CMakeLists.txt 'tests/**/CMakeLists.txt' \
              'tests/**/*.cmake' 'tests/**/*.c' 'tests/**/*.cc' 'tests/**/*.cpp' \
              'tests/**/*.cxx' 'tests/**/*.m' 'tests/**/*.mm' 'tests/**/*.h' \
              'tests/**/*.hh' 'tests/**/*.hpp' 'tests/**/*.inl' 'tests/**/*.qrc' \
              'tests/**/*.qml' 'tests/**/*.js' 'tests/**/*.json' 'tests/**/*.txt' \
              'scripts/**' \
              macos/build-macos.sh macos/requirements-build.txt \
              macos/tools/deploy-conan-dylibs.py \
              macos/tools/deploy-macos-dev-bundle.py tools/CMakeLists.txt \
              'tools/jsdoc/**' tools/shadergen.py
          } | shasum -a 256 | awk '{print $1}')"
          compiler_fingerprint="$(printf '%s\n' \
            "$compiler_digest" "$compiler_version" "$xcode_build" \
            "$sdk_version" "$sdk_build" "$OVERTE_MACOS_ARCH" \
            "$OVERTE_MACOS_BUILD_TYPE" "$MACOSX_DEPLOYMENT_TARGET" | \
            shasum -a 256 | awk '{print $1}')"
          dependency_fingerprint="$(printf '%s\n' \
            "$compiler_digest" "$compiler_version" "$xcode_build" \
            "$sdk_version" "$sdk_build" "$OVERTE_MACOS_ARCH" \
            "$OVERTE_MACOS_BUILD_TYPE" "$MACOSX_DEPLOYMENT_TARGET" \
            "$OVERTE_MACOS_QT_SOURCE" "$dependency_inputs" | \
            shasum -a 256 | awk '{print $1}')"
          legacy_toolchain_fingerprint="$(printf '%s\n' \
            "$compiler_digest" "$compiler_version" "$xcode_build" \
            "$sdk_version" "$sdk_build" "$OVERTE_MACOS_ARCH" \
            "$OVERTE_MACOS_BUILD_TYPE" "$MACOSX_DEPLOYMENT_TARGET" \
            "$OVERTE_MACOS_QT_SOURCE" "$legacy_toolchain_inputs" | \
            shasum -a 256 | awk '{print $1}')"
          legacy_on_profile_fingerprint="$(printf '%s\n' \
            "$legacy_toolchain_fingerprint" ON | shasum -a 256 | awk '{print $1}')"
          legacy_off_profile_fingerprint="$(printf '%s\n' \
            "$legacy_toolchain_fingerprint" OFF | shasum -a 256 | awk '{print $1}')"
          conan_inputs="$(git ls-files -s -- conanfile.py 'macos/conan/**' | \
            shasum -a 256 | awk '{print $1}')"
          # sccache validates each entry by content, so monitoring-only changes
          # must not strand compatible compiler results.  The non-content-
          # addressed build tree below deliberately retains the stricter key.
          base="macos-sccache-v4-${OVERTE_MACOS_ARCH}-${compiler_fingerprint}"
          # Conan v3 starts clean. Build-tree v3 below has an explicit,
          # ordered v2 migration path so the unified test graph does not force
          # an otherwise avoidable cold client rebuild.
          conan_key="macos-conan-v3-${OVERTE_MACOS_ARCH}-${dependency_fingerprint}-${conan_inputs}"
          echo "conan=${conan_key}" >> "$GITHUB_OUTPUT"
          echo "conan_stage_prefix=${conan_key}-stage-" >> "$GITHUB_OUTPUT"
          legacy_conan_key="macos-conan-v3-${OVERTE_MACOS_ARCH}-${legacy_toolchain_fingerprint}-${conan_inputs}"
          echo "legacy_conan=${legacy_conan_key}" >> "$GITHUB_OUTPUT"
          # One-time migration from the first unified v3 generation. That
          # generation hashed the whole build script, so the configure-only
          # fast-path edit would otherwise cause an unnecessary Conan miss.
          if [[ "$OVERTE_MACOS_ARCH" == x86_64 ]]; then
            migration_v3_dependency_fingerprint="3f1de10f08f82e89d747b103d1647964e2c5bc4b96154e15d8dbc79958908484"
            echo "migration_conan=macos-conan-v3-${OVERTE_MACOS_ARCH}-${migration_v3_dependency_fingerprint}-${conan_inputs}" >> "$GITHUB_OUTPUT"
            echo "migration_build_complete_prefix=macos-build-tree-v3-${OVERTE_MACOS_ARCH}-${migration_v3_dependency_fingerprint}-complete-" >> "$GITHUB_OUTPUT"
            echo "migration_build_partial_prefix=macos-build-tree-v3-${OVERTE_MACOS_ARCH}-${migration_v3_dependency_fingerprint}-partial-" >> "$GITHUB_OUTPUT"
          fi
          echo "conan_checkpoint=overte-macos-conan-checkpoint-v4-${OVERTE_MACOS_ARCH}-${dependency_fingerprint}-${conan_inputs}" >> "$GITHUB_OUTPUT"
          echo "sccache_complete=${base}-complete-${source_inputs}" >> "$GITHUB_OUTPUT"
          echo "sccache_complete_prefix=${base}-complete-" >> "$GITHUB_OUTPUT"
          echo "sccache_partial_prefix=${base}-partial-" >> "$GITHUB_OUTPUT"
          # sccache already hashes source, preprocessor output, flags, and the
          # compiler. Keep the per-object namespace tied to the actual compiler
          # environment so CMake/recipe-only edits do not strand valid objects.
          remote_namespace="overte-macos-objects-v2-${OVERTE_MACOS_ARCH}-${compiler_fingerprint}"
          echo "SCCACHE_GHA_VERSION=${remote_namespace}" >> "$GITHUB_ENV"
          echo "sccache_remote_namespace=${remote_namespace}" >> "$GITHUB_OUTPUT"
          build_base="macos-build-tree-v3-${OVERTE_MACOS_ARCH}-${dependency_fingerprint}"
          echo "build_configured=${build_base}-configured-${source_inputs}" >> "$GITHUB_OUTPUT"
          echo "build_complete=${build_base}-complete-${source_inputs}" >> "$GITHUB_OUTPUT"
          echo "build_complete_prefix=${build_base}-complete-" >> "$GITHUB_OUTPUT"
          echo "build_partial_prefix=${build_base}-partial-" >> "$GITHUB_OUTPUT"
          legacy_on_base="macos-build-tree-v2-${OVERTE_MACOS_ARCH}-${legacy_on_profile_fingerprint}"
          legacy_off_base="macos-build-tree-v2-${OVERTE_MACOS_ARCH}-${legacy_off_profile_fingerprint}"
          echo "legacy_on_complete_prefix=${legacy_on_base}-complete-" >> "$GITHUB_OUTPUT"
          echo "legacy_on_partial_prefix=${legacy_on_base}-partial-" >> "$GITHUB_OUTPUT"
          echo "legacy_off_complete_prefix=${legacy_off_base}-complete-" >> "$GITHUB_OUTPUT"
          echo "legacy_off_partial_prefix=${legacy_off_base}-partial-" >> "$GITHUB_OUTPUT"

      - name: Restore bounded compiler recovery cache
        id: sccache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.sccache_complete }}
          restore-keys: |
            ${{ steps.cache-key.outputs.sccache_complete_prefix }}
            ${{ steps.cache-key.outputs.sccache_partial_prefix }}

      - name: Verify immediate remote compiler checkpoint
        id: remote-compiler-probe
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SCCACHE_GHA_CACHE_URL:-}" ]]
          [[ -n "${SCCACHE_GHA_RUNTIME_TOKEN:-}" ]]
          [[ "${SCCACHE_GHA_ENABLED:-}" == true ]]
          [[ -n "${SCCACHE_GHA_VERSION:-}" ]]
          probe_dir="$RUNNER_TEMP/macos-sccache-remote-probe"
          rm -rf "$probe_dir"
          mkdir -p "$probe_dir" "$MACOS_RUNNER_TELEMETRY_DIR"
          trap 'rm -rf "$probe_dir"' EXIT
          printf '%s\n' \
            "const char overte_macos_checkpoint_probe[] = \"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\";" \
            > "$probe_dir/probe.c"
          sccache --stop-server >/dev/null 2>&1 || true
          sccache --start-server
          sccache --zero-stats
          sccache "$(xcrun --find clang)" -c "$probe_dir/probe.c" -o "$probe_dir/probe.o"
          sccache --show-stats --stats-format=json > "$probe_dir/stats.json"
          python3 macos/ci/sccache-remote-checkpoint.py verify-stats \
            --stats "$probe_dir/stats.json" --mode probe
          sccache --stop-server

      - name: Discover verified remote compiler generation
        id: remote-compiler-generation
        timeout-minutes: 5
        env:
          OVERTE_CHECKPOINT_TOKEN: ${{ github.token }}
        run: >-
          python3 macos/ci/sccache-remote-checkpoint.py discover
          --repository "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF"
          --token-env OVERTE_CHECKPOINT_TOKEN
          --github-output "$GITHUB_OUTPUT"

      # Restore generated objects before Conan writes the current toolchain and
      # presets.  Restoring this tree after dependency resolution could replace
      # fresh Conan generators with files from an older source checkpoint.
      - name: Restore resumable build-tree checkpoint
        id: build-tree-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.build_complete }}
          restore-keys: |
            ${{ steps.cache-key.outputs.build_complete_prefix }}
            ${{ steps.cache-key.outputs.migration_build_complete_prefix }}
            ${{ steps.cache-key.outputs.legacy_on_complete_prefix }}
            ${{ steps.cache-key.outputs.legacy_off_complete_prefix }}
            ${{ steps.cache-key.outputs.build_partial_prefix }}
            ${{ steps.cache-key.outputs.migration_build_partial_prefix }}
            ${{ steps.cache-key.outputs.legacy_on_partial_prefix }}
            ${{ steps.cache-key.outputs.legacy_off_partial_prefix }}
            ${{ steps.cache-key.outputs.build_configured }}

      - name: Normalize restored Ninja source timestamps
        run: >-
          python3 macos/ci/build-tree-checkpoint.py restore
          --repository "$GITHUB_WORKSPACE" --build-dir build

      - name: Cache Conan packages
        id: conan-cache
        timeout-minutes: 12
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: ${{ steps.cache-key.outputs.conan }}
          restore-keys: |
            ${{ steps.cache-key.outputs.migration_conan }}
            ${{ steps.cache-key.outputs.legacy_conan }}
            ${{ steps.cache-key.outputs.conan_stage_prefix }}

      - name: Discard interrupted Conan fast-cache restore
        if: ${{ steps.conan-cache.outcome == 'failure' }}
        run: >-
          python3 macos/ci/conan-checkpoint.py discard-partial
          --conan-home "$CONAN_HOME"

      # actions/cache is an evictable speed optimization shared with every
      # other workflow in the repository.  The artifact checkpoint below is an
      # independent recovery boundary with its own manifest and SHA-256.
      - name: Probe latest compatible durable Conan checkpoint
        id: conan-checkpoint-probe
        env:
          OVERTE_CHECKPOINT_TOKEN: ${{ github.token }}
        run: >-
          python3 macos/ci/conan-checkpoint.py probe
          --repository "$GITHUB_REPOSITORY"
          --artifact-name "${{ steps.cache-key.outputs.conan_checkpoint }}"
          --repository-id "$GITHUB_REPOSITORY_ID"
          --branch "$GITHUB_REF_NAME"
          --token-env OVERTE_CHECKPOINT_TOKEN
          --github-output "$GITHUB_OUTPUT"

      - name: Restore latest compatible durable Conan checkpoint
        id: conan-checkpoint-restore
        timeout-minutes: 45
        if: >-
          ${{ steps.conan-cache.outputs.cache-hit != 'true' &&
              steps.conan-checkpoint-probe.outputs.found == 'true' }}
        env:
          OVERTE_CHECKPOINT_TOKEN: ${{ github.token }}
        run: |
          python3 macos/ci/runner-telemetry.py \
            --phase conan-durable-restore \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/conan-durable-restore.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/conan-durable-restore-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 900 --max-runtime 2400 \
            --watch conan="$CONAN_HOME" -- \
            python3 macos/ci/conan-checkpoint.py restore-remote \
              --repository "$GITHUB_REPOSITORY" \
              --artifact-name "${{ steps.cache-key.outputs.conan_checkpoint }}" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --branch "$GITHUB_REF_NAME" \
              --token-env OVERTE_CHECKPOINT_TOKEN \
              --key "${{ steps.cache-key.outputs.conan }}" \
              --conan-home "$CONAN_HOME" \
              --github-output "$GITHUB_OUTPUT"

      - name: Prepare deterministic Conan configuration
        timeout-minutes: 10
        run: macos/build-macos.sh prepare

      - name: Configure compiler checkpoint for dependency stages
        run: |
          sccache --start-server
          sccache --zero-stats

      # Resolve the two expensive local recipes separately.  Qt becomes a
      # restorable Conan generation before V8 starts; every V8 object is then
      # written to the remote sccache backend before its compiler exits.
      - name: Resolve Qt dependency stage
        id: resolve-qt
        continue-on-error: true
        timeout-minutes: 30
        env:
          CC: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang
          CXX: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang++
          OBJC: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang
          OBJCXX: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang++
          CMAKE_C_COMPILER_LAUNCHER: ''
          CMAKE_CXX_COMPILER_LAUNCHER: ''
          CMAKE_OBJC_COMPILER_LAUNCHER: ''
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ''
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          python3 macos/ci/runner-telemetry.py \
            --phase dependency-qt \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/dependency-qt.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/dependency-qt-stall" \
            --compiler-live-log "$MACOS_RUNNER_TELEMETRY_DIR/dependency-qt-compilers.jsonl" \
            --compiler-diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/dependency-qt-compiler-stalls" \
            --sample-interval 5 --publish-interval 30 --directory-interval 300 \
            --inactivity-timeout 900 --max-runtime 1500 \
            --watch conan="$CONAN_HOME" \
            --watch sccache="$SCCACHE_DIR" \
            -- macos/build-macos.sh deps-qt

      - name: Save Qt Conan stage immediately
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-qt.outcome == 'success' &&
              steps.conan-cache.outputs.cache-matched-key == '' &&
              steps.conan-checkpoint-restore.outputs.restored != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: ${{ steps.cache-key.outputs.conan_stage_prefix }}qt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require resolved Qt dependency stage
        if: ${{ always() && steps.resolve-qt.outcome == 'failure' }}
        run: exit 1

      - name: Resolve libnode dependency stage
        id: resolve-libnode
        continue-on-error: true
        timeout-minutes: 240
        env:
          CC: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang
          CXX: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang++
          OBJC: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang
          OBJCXX: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang++
          CMAKE_C_COMPILER_LAUNCHER: ''
          CMAKE_CXX_COMPILER_LAUNCHER: ''
          CMAKE_OBJC_COMPILER_LAUNCHER: ''
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ''
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          python3 macos/ci/runner-telemetry.py \
            --phase dependency-libnode \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/dependency-libnode.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/dependency-libnode-stall" \
            --compiler-live-log "$MACOS_RUNNER_TELEMETRY_DIR/dependency-libnode-compilers.jsonl" \
            --compiler-diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/dependency-libnode-compiler-stalls" \
            --sample-interval 5 --publish-interval 30 --directory-interval 300 \
            --inactivity-timeout 900 --max-runtime 13800 \
            --watch conan="$CONAN_HOME" \
            --watch sccache="$SCCACHE_DIR" \
            -- macos/build-macos.sh deps-libnode

      - name: Report dependency compiler-checkpoint statistics
        id: dependency-compiler-stats
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-libnode.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          sccache --show-stats --stats-format=json \
            > "$MACOS_RUNNER_TELEMETRY_DIR/dependency-sccache-stats.json"
          sccache --show-stats

      - name: Stop compiler-cache server after libnode
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-libnode.outcome != 'skipped' }}
        run: sccache --stop-server || true

      - name: Verify libnode objects were checkpointed
        id: dependency-compiler-verify
        if: ${{ always() && !cancelled() && steps.dependency-compiler-stats.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 macos/ci/sccache-remote-checkpoint.py verify-stats
          --stats "$MACOS_RUNNER_TELEMETRY_DIR/dependency-sccache-stats.json"
          --mode phase
          --github-output "$GITHUB_OUTPUT"

      - name: Save compiler cache after libnode stage
        if: >-
          ${{ always() && !cancelled() &&
              steps.dependency-compiler-verify.outcome == 'success' &&
              steps.dependency-compiler-verify.outputs.local_cache_changed == 'true' &&
              (steps.resolve-libnode.outcome == 'success' ||
               steps.resolve-libnode.outcome == 'failure') }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.sccache_partial_prefix }}dependencies-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Conan cache after libnode stage
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-libnode.outcome == 'success' &&
              steps.conan-cache.outputs.cache-matched-key == '' &&
              steps.conan-checkpoint-restore.outputs.restored != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: ${{ steps.cache-key.outputs.conan_stage_prefix }}libnode-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require healthy libnode dependency stage
        if: >-
          ${{ always() && steps.resolve-libnode.outcome != 'skipped' &&
              (steps.resolve-libnode.outcome == 'failure' ||
               steps.dependency-compiler-stats.outcome == 'failure' ||
               steps.dependency-compiler-verify.outcome == 'failure') }}
        run: exit 1

      - name: Configure compiler checkpoint for remaining dependencies
        run: |
          sccache --start-server
          sccache --zero-stats

      - name: Resolve remaining dependency graph
        id: resolve-dependencies
        continue-on-error: true
        timeout-minutes: 120
        env:
          CC: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang
          CXX: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang++
          OBJC: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang
          OBJCXX: ${{ github.workspace }}/macos/ci/compiler-watchdog.py -- /usr/bin/clang++
          CMAKE_C_COMPILER_LAUNCHER: ''
          CMAKE_CXX_COMPILER_LAUNCHER: ''
          CMAKE_OBJC_COMPILER_LAUNCHER: ''
          CMAKE_OBJCXX_COMPILER_LAUNCHER: ''
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          python3 macos/ci/runner-telemetry.py \
            --phase dependency-graph \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/dependencies.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/dependencies-stall" \
            --compiler-live-log "$MACOS_RUNNER_TELEMETRY_DIR/dependency-compilers.jsonl" \
            --compiler-diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/dependency-compiler-stalls" \
            --sample-interval 5 --publish-interval 30 --directory-interval 300 \
            --inactivity-timeout 900 --max-runtime 6900 \
            --watch conan="$CONAN_HOME" \
            --watch sccache="$SCCACHE_DIR" \
            -- macos/build-macos.sh deps

      - name: Report remaining dependency compiler statistics
        id: remaining-dependency-compiler-stats
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-dependencies.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          sccache --show-stats --stats-format=json \
            > "$MACOS_RUNNER_TELEMETRY_DIR/remaining-dependency-sccache-stats.json"
          sccache --show-stats

      - name: Stop compiler-cache server before dependency snapshots
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-dependencies.outcome != 'skipped' }}
        run: sccache --stop-server || true

      - name: Verify remaining dependency compiler checkpoint
        id: remaining-dependency-compiler-verify
        if: >-
          ${{ always() && !cancelled() &&
              steps.remaining-dependency-compiler-stats.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 macos/ci/sccache-remote-checkpoint.py verify-stats
          --stats "$MACOS_RUNNER_TELEMETRY_DIR/remaining-dependency-sccache-stats.json"
          --mode phase

      - name: Validate and compact completed Conan cache
        id: conan-integrity
        if: ${{ always() && !cancelled() && steps.resolve-dependencies.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python3 macos/ci/runner-telemetry.py \
            --phase conan-integrity \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/conan-integrity.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/conan-integrity-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 900 --max-runtime 1500 \
            --watch conan="$CONAN_HOME" -- \
            bash -euo pipefail -c '
              conan cache check-integrity "*"
              conan cache clean "*" --build --temp
              conan cache check-integrity "*"
            '

      - name: Package durable Conan checkpoint
        id: conan-checkpoint-package
        timeout-minutes: 45
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-dependencies.outcome == 'success' &&
              steps.conan-integrity.outcome == 'success' &&
              (steps.conan-checkpoint-probe.outputs.found != 'true' ||
               (steps.conan-cache.outputs.cache-hit != 'true' &&
                steps.conan-checkpoint-restore.outputs.restored != 'true')) }}
        run: |
          python3 macos/ci/runner-telemetry.py \
            --phase conan-durable-package \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/conan-durable-package.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/conan-durable-package-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 900 --max-runtime 2400 \
            --watch conan="$CONAN_HOME" \
            --watch checkpoint="$RUNNER_TEMP/macos-conan-checkpoint" -- \
            python3 macos/ci/conan-checkpoint.py create \
              --conan-home "$CONAN_HOME" \
              --output-dir "$RUNNER_TEMP/macos-conan-checkpoint" \
              --key "${{ steps.cache-key.outputs.conan }}" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --branch "$GITHUB_REF_NAME"

      - name: Upload durable Conan checkpoint
        id: conan-checkpoint-upload
        timeout-minutes: 60
        if: ${{ always() && steps.conan-checkpoint-package.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.cache-key.outputs.conan_checkpoint }}
          path: ${{ runner.temp }}/macos-conan-checkpoint
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Verify durable Conan checkpoint upload
        timeout-minutes: 60
        if: ${{ always() && steps.conan-checkpoint-upload.outcome == 'success' }}
        env:
          OVERTE_CHECKPOINT_TOKEN: ${{ github.token }}
        run: |
          python3 macos/ci/runner-telemetry.py \
            --phase conan-durable-verify \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/conan-durable-verify.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/conan-durable-verify-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 900 --max-runtime 3300 \
            --watch conan="$CONAN_HOME" -- \
            python3 macos/ci/conan-checkpoint.py verify-remote \
              --repository "$GITHUB_REPOSITORY" \
              --artifact-name "${{ steps.cache-key.outputs.conan_checkpoint }}" \
              --artifact-id "${{ steps.conan-checkpoint-upload.outputs.artifact-id }}" \
              --expected-digest "${{ steps.conan-checkpoint-upload.outputs.artifact-digest }}" \
              --key "${{ steps.cache-key.outputs.conan }}" \
              --repository-id "$GITHUB_REPOSITORY_ID" \
              --branch "$GITHUB_REF_NAME" \
              --token-env OVERTE_CHECKPOINT_TOKEN

      - name: Save complete Conan cache
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-dependencies.outcome == 'success' &&
              steps.conan-integrity.outcome == 'success' &&
              steps.conan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: ${{ steps.cache-key.outputs.conan }}

      - name: Save partial Conan cache after dependency failure
        if: >-
          ${{ always() && !cancelled() &&
              (steps.resolve-dependencies.outcome == 'failure' ||
               steps.conan-integrity.outcome == 'failure') }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: ${{ steps.cache-key.outputs.conan }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require resolved dependencies
        if: >-
          ${{ always() && steps.resolve-dependencies.outcome != 'skipped' &&
              (steps.resolve-dependencies.outcome == 'failure' ||
               steps.conan-integrity.outcome == 'failure' ||
               steps.remaining-dependency-compiler-stats.outcome == 'failure' ||
               steps.remaining-dependency-compiler-verify.outcome == 'failure') }}
        run: exit 1

      - name: Configure compiler cache
        run: |
          sccache --start-server
          sccache --zero-stats

      - name: Configure client build graph
        id: configure-client
        continue-on-error: true
        timeout-minutes: 30
        env:
          OVERTE_MACOS_SKIP_CONFIGURE: >-
            ${{ steps.build-tree-restore.outputs.cache-matched-key ==
                steps.cache-key.outputs.build_complete && 'ON' || 'OFF' }}
          OVERTE_MACOS_EXPECTED_BUILD_TREE_KEY: ${{ steps.cache-key.outputs.build_complete }}
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          python3 macos/ci/runner-telemetry.py \
            --phase client-configure \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/configure.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/configure-stall" \
            --compiler-live-log "$MACOS_RUNNER_TELEMETRY_DIR/configure-compilers.jsonl" \
            --compiler-diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/configure-compiler-stalls" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 600 --max-runtime 1500 \
            --watch build=build --watch conan="$CONAN_HOME" \
            --watch sccache="$SCCACHE_DIR" -- \
            macos/build-macos.sh configure

      - name: Record configured build-tree checkpoint metadata
        if: >-
          ${{ always() && !cancelled() &&
              (steps.configure-client.outcome == 'success' ||
               steps.configure-client.outcome == 'failure') }}
        run: |
          python3 macos/ci/build-tree-checkpoint.py record \
            --repository "$GITHUB_WORKSPACE" --build-dir build
          if [[ "${{ steps.configure-client.outcome }}" == success ]]; then
            printf '%s\n' "${{ steps.cache-key.outputs.build_complete }}" \
              > build/.overte-macos-complete-key
            chmod 0600 build/.overte-macos-complete-key
          fi

      - name: Save configured build-tree checkpoint
        if: >-
          ${{ always() && !cancelled() &&
              steps.configure-client.outcome == 'success' &&
              steps.build-tree-restore.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.build_configured }}

      - name: Save failed configure checkpoint
        if: ${{ always() && !cancelled() && steps.configure-client.outcome == 'failure' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.build_partial_prefix }}configure-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require successful client configuration
        if: ${{ always() && steps.configure-client.outcome == 'failure' }}
        run: exit 1

      - name: Build client application
        id: build-client
        continue-on-error: true
        timeout-minutes: 175
        run: |
          mkdir -p "$MACOS_RUNNER_TELEMETRY_DIR"
          python3 macos/ci/runner-telemetry.py \
            --phase client-build \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/build.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/build-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 300 \
            --inactivity-timeout 900 --max-runtime 9900 \
            --watch build=build \
            --watch conan="$CONAN_HOME" \
            --watch sccache="$SCCACHE_DIR" \
            -- macos/build-macos.sh compile

      - name: Report compiler-cache statistics
        id: client-compiler-stats
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          sccache --show-stats --stats-format=json \
            > "$MACOS_RUNNER_TELEMETRY_DIR/client-sccache-stats.json"
          sccache --show-stats

      - name: Stop compiler-cache server before snapshot
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome != 'skipped' }}
        run: sccache --stop-server || true

      - name: Verify client objects were checkpointed
        id: client-compiler-verify
        if: ${{ always() && !cancelled() && steps.client-compiler-stats.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python3 macos/ci/sccache-remote-checkpoint.py verify-stats
          --stats "$MACOS_RUNNER_TELEMETRY_DIR/client-sccache-stats.json"
          --mode phase

      - name: Record Ninja build-tree checkpoint metadata
        id: build-tree-metadata
        if: >-
          ${{ always() && !cancelled() &&
              (steps.build-client.outcome == 'success' ||
               steps.build-client.outcome == 'failure') }}
        run: >-
          python3 macos/ci/build-tree-checkpoint.py record
          --repository "$GITHUB_WORKSPACE" --build-dir build

      - name: Save complete compiler cache
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome == 'success' &&
              steps.sccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.sccache_complete }}

      - name: Save partial compiler cache after build failure
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome == 'failure' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.cache-key.outputs.sccache_partial_prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save complete build-tree checkpoint
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome == 'success' &&
              steps.build-tree-metadata.outcome == 'success' &&
              steps.build-tree-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.build_complete }}

      - name: Save partial build-tree checkpoint after build failure
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome == 'failure' &&
              steps.build-tree-metadata.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: ${{ steps.cache-key.outputs.build_partial_prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require successful client build
        if: >-
          ${{ always() && steps.build-client.outcome != 'skipped' &&
              (steps.build-client.outcome == 'failure' ||
               steps.client-compiler-stats.outcome == 'failure' ||
               steps.client-compiler-verify.outcome == 'failure') }}
        run: exit 1

      - name: Verify application bundle
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          test -n "$app"
          test -x "$app/Contents/MacOS/Overte"
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          macos/ci/verify-glad-linkage.sh "$app"
          macos/ci/verify-bundle-freshness.sh "$app" build

      - name: Package application artifact provenance
        timeout-minutes: 30
        run: |
          set -euo pipefail
          app="$(find build -type d -name Overte.app -print -quit)"
          test "$app" = build/interface/Overte.app
          xcode_version="$(xcodebuild -version | awk 'NR == 1 {print $2}')"
          xcode_build="$(xcodebuild -version | awk '/Build version/{print $3}')"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          python3 macos/ci/application-artifact.py package \
            --app "$app" \
            --manifest build/application-artifact/application-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --workflow .github/workflows/macos-bootstrap.yml \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --target-arch "$OVERTE_MACOS_ARCH" \
            --xcode-version "$xcode_version" \
            --xcode-build "$xcode_build" \
            --sdk-version "$sdk_version" \
            --build-type "$OVERTE_MACOS_BUILD_TYPE" \
            --deployment-target "$MACOSX_DEPLOYMENT_TARGET"
          python3 macos/ci/application-artifact.py archive \
            --app "$app" \
            --archive build/application-archive/Overte.app.tar

      - name: Upload application bundle immediately
        id: application-upload
        timeout-minutes: 30
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-${{ env.OVERTE_MACOS_ARCH }}-${{ github.run_id }}
          # The inner tar preserves framework/QML symlinks and executable modes;
          # upload-artifact otherwise dereferences macOS bundle symlinks.
          path: |
            build/application-archive/Overte.app.tar
            build/application-artifact/application-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Run application startup preflight
        timeout-minutes: 5
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-startup \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/runtime-startup.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/runtime-startup-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 180 --max-runtime 240 \
            --watch startup=build/macos-startup-preflight -- \
            macos/ci/startup-preflight.sh "$app" build/macos-startup-preflight

      - name: Run serverless entity smoke
        timeout-minutes: 15
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-serverless \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/runtime-serverless.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/runtime-serverless-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 600 --max-runtime 840 \
            --watch smoke=build/macos-smoke -- \
            macos/ci/serverless-smoke.sh "$app" build/macos-smoke

      - name: Run online entity smoke
        timeout-minutes: 15
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-online \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/runtime-online.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/runtime-online-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 600 --max-runtime 840 \
            --watch smoke=build/macos-online-smoke -- \
            macos/ci/online-smoke.sh "$app" build/macos-online-smoke

      - name: Run deterministic graphics performance smoke
        timeout-minutes: 10
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          python3 macos/ci/runner-telemetry.py \
            --phase runtime-performance \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/runtime-performance.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/runtime-performance-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 60 \
            --inactivity-timeout 300 --max-runtime 540 \
            --watch performance=build/macos-performance -- \
            macos/ci/performance-smoke.sh "$app" build/macos-performance

      - name: Run native C++ and Qt code tests
        if: >-
          ${{ !cancelled() && inputs.run_native_tests &&
              steps.build-client.outcome == 'success' }}
        timeout-minutes: 120
        env:
          OVERTE_TEST_BUILD_CONFIG: ${{ env.OVERTE_MACOS_BUILD_TYPE }}
          OVERTE_TEST_TIMEOUT: '900'
          OVERTE_TEST_JUNIT: ${{ github.workspace }}/build/macos-native-test-results/TEST-overte-macos-native.xml
        run: |
          python3 macos/ci/runner-telemetry.py \
            --phase native-code-tests \
            --log "$MACOS_RUNNER_TELEMETRY_DIR/native-code-tests.jsonl" \
            --diagnostics-dir "$MACOS_RUNNER_TELEMETRY_DIR/native-code-tests-stall" \
            --sample-interval 5 --publish-interval 30 --directory-interval 300 \
            --inactivity-timeout 900 --max-runtime 6900 \
            --compiler-live-log "$GITHUB_WORKSPACE/build/macos-native-test-results/compiler-watchdog.jsonl" \
            --compiler-diagnostics-dir "$GITHUB_WORKSPACE/build/macos-native-test-results/compiler-stalls" \
            --watch native=build/tests -- \
            tests/project-native-test.sh build

      - name: Upload smoke diagnostics
        id: smoke-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-smoke-${{ github.run_id }}
          path: |
            .macos-runner-telemetry
            build/macos-build-diagnostics
            build/macos-startup-preflight
            build/macos-smoke
            build/macos-online-smoke
            build/macos-performance
            build/macos-native-test-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Wait before retrying smoke diagnostics upload
        if: >-
          ${{ always() && !cancelled() &&
              steps.smoke-upload.outcome == 'failure' }}
        run: sleep 15

      - name: Retry smoke diagnostics upload
        if: >-
          ${{ always() && !cancelled() &&
              steps.smoke-upload.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-smoke-${{ github.run_id }}
          path: |
            .macos-runner-telemetry
            build/macos-build-diagnostics
            build/macos-startup-preflight
            build/macos-smoke
            build/macos-online-smoke
            build/macos-performance
            build/macos-native-test-results
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          overwrite: true

      - name: Prune superseded branch-local compiler generations
        if: ${{ always() && steps.application-upload.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          OVERTE_CHECKPOINT_TOKEN: ${{ github.token }}
        run: >-
          python3 macos/ci/sccache-remote-checkpoint.py prune
          --repository "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF"
          --active-version "${{ steps.remote-compiler-generation.outputs.version }}"
          --retain-previous 1
          --token-env OVERTE_CHECKPOINT_TOKEN
          --execute

      - name: Prune superseded macOS bootstrap caches
        if: >-
          ${{ always() && steps.application-upload.outcome == 'success' &&
              steps.build-client.outcome == 'success' &&
              steps.conan-integrity.outcome == 'success' }}
        timeout-minutes: 10
        continue-on-error: true
        env:
          OVERTE_CHECKPOINT_TOKEN: ${{ github.token }}
        run: >-
          python3 macos/ci/bootstrap-cache-prune.py
          --repository "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF"
          --architecture "$OVERTE_MACOS_ARCH"
          --active-build "${{ steps.cache-key.outputs.build_complete }}"
          --active-conan "${{ steps.cache-key.outputs.conan }}"
          --active-sccache "${{ steps.cache-key.outputs.sccache_complete }}"
          --token-env OVERTE_CHECKPOINT_TOKEN
          --execute
