name: macOS bootstrap

on:
  workflow_dispatch:
  push:
    branches: [apple-macos]
    paths:
      - '.github/workflows/macos-bootstrap.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'conanfile.py'
      - 'interface/**'
      - 'libraries/**'
      - 'macos/**'
      - 'plugins/**'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: macos-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-opengl-x86_64:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      OVERTE_MACOS_ARCH: x86_64
      OVERTE_MACOS_BUILD_TYPE: RelWithDebInfo
      OVERTE_MACOS_QT_SOURCE: aqt
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1536M
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          brew list ccache >/dev/null 2>&1 || brew install ccache
          python3 -m venv build-tooling-venv
          build-tooling-venv/bin/pip install 'conan>=2,<3' 'aqtinstall>=3,<4'
          echo "$GITHUB_WORKSPACE/build-tooling-venv/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/build-tooling-venv/bin:$PATH"
          conan --version

      - name: Check host toolchain
        run: macos/build-macos.sh doctor

      - name: Cache Conan packages
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: macos-complete-x86_64-qt-aqt-${{ hashFiles('conanfile.py', 'macos/conan/**') }}
          # The final entry is a one-way migration seed; new runs never save it.
          restore-keys: |
            macos-complete-x86_64-qt-aqt-
            macos-partial-x86_64-qt-aqt-${{ hashFiles('conanfile.py', 'macos/conan/**') }}-
            macos-partial-x86_64-qt-aqt-
            macos-x86_64-qt-aqt-

      - name: Resolve dependencies
        id: resolve-dependencies
        continue-on-error: true
        run: macos/build-macos.sh deps

      - name: Save complete Conan cache
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-dependencies.outcome == 'success' &&
              steps.conan-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: macos-complete-x86_64-qt-aqt-${{ hashFiles('conanfile.py', 'macos/conan/**') }}

      - name: Save partial Conan cache after dependency failure
        if: >-
          ${{ always() && !cancelled() &&
              steps.resolve-dependencies.outcome == 'failure' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.CONAN_HOME }}/p
            ${{ env.CONAN_HOME }}/sources
          key: macos-partial-x86_64-qt-aqt-${{ hashFiles('conanfile.py', 'macos/conan/**') }}-${{ github.run_id }}

      - name: Require resolved dependencies
        if: ${{ always() && steps.resolve-dependencies.outcome == 'failure' }}
        run: exit 1

      - name: Restore bounded compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-complete-v1-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'interface/**', 'libraries/**', 'plugins/**') }}
          restore-keys: |
            macos-ccache-complete-v1-x86_64-
            macos-ccache-partial-v1-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'interface/**', 'libraries/**', 'plugins/**') }}-
            macos-ccache-partial-v1-x86_64-

      - name: Configure compiler cache
        run: |
          ccache --set-config "max_size=$CCACHE_MAXSIZE"
          ccache --set-config compression=true
          ccache --zero-stats

      - name: Configure and build client
        id: build-client
        continue-on-error: true
        run: macos/build-macos.sh build

      - name: Save complete compiler cache
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome == 'success' &&
              steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-complete-v1-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'interface/**', 'libraries/**', 'plugins/**') }}

      - name: Save partial compiler cache after build failure
        if: >-
          ${{ always() && !cancelled() &&
              steps.build-client.outcome == 'failure' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-ccache-partial-v1-x86_64-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'interface/**', 'libraries/**', 'plugins/**') }}-${{ github.run_id }}

      - name: Require successful client build
        if: ${{ always() && steps.build-client.outcome == 'failure' }}
        run: exit 1

      - name: Verify application bundle
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          test -n "$app"
          test -x "$app/Contents/MacOS/Overte"
          test -f "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

      - name: Run application startup preflight
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          macos/ci/startup-preflight.sh "$app" build/macos-startup-preflight

      - name: Run serverless entity smoke
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          macos/ci/serverless-smoke.sh "$app" build/macos-smoke

      - name: Run online entity smoke
        run: |
          app="$(find build -type d -name Overte.app -print -quit)"
          macos/ci/online-smoke.sh "$app" build/macos-online-smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-smoke-${{ github.run_id }}
          path: |
            build/macos-startup-preflight
            build/macos-smoke
            build/macos-online-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application bundle
        if: ${{ always() && steps.build-client.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-macos-x86_64-${{ github.run_id }}
          path: build/interface/Overte.app
          if-no-files-found: error
          retention-days: 7
