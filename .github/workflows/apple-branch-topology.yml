name: Apple path ownership

on:
  pull_request:
    branches:
      - apple-ios
      - apple-macos

permissions:
  contents: read

jobs:
  enforce-apple-path-ownership:
    name: Enforce apple-main sync path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current Apple base
        run: git fetch --no-tags origin apple-main:refs/remotes/origin/apple-main
      - name: Load trusted parent checker
        run: git show origin/apple-main:tests/apple-branch-topology-check.py > "$RUNNER_TEMP/apple-branch-topology-check.py"
      - name: Validate ancestry and path ownership
        run: >-
          python3 "$RUNNER_TEMP/apple-branch-topology-check.py"
          --apple-main origin/apple-main
          --head HEAD
          --target "${{ github.base_ref }}"
