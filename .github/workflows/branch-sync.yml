name: Branch synchronization

on:
  push:
    branches: [main, android-main, android-vr, apple-main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-synchronization-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-drift:
    name: branch-sync-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Detect parent-to-child drift without repository writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_PARENT: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            python3 tools/branch-policy/drift.py \
              --repository "$REPOSITORY" \
              --parent "$PUSH_PARENT" \
              --expected-parent-sha "$PUSH_SHA" --observe-push | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/branch-policy/drift.py \
              --repository "$REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
