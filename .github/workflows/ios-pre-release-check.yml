name: iOS pre-release quality gate

on:
  workflow_dispatch:
    inputs:
      group:
        description: Inspection group; all consumes existing build/device evidence
        type: choice
        default: static-only
        options:
          - static-only
          - all
          - secrets
          - hygiene
          - licenses
          - dependencies
          - static
          - configuration
          - permissions
          - signing
          - build
          - artifact
          - functional
          - robustness
          - long-running
          - distribution

permissions:
  contents: read

concurrency:
  group: ios-pre-release-private-runner
  cancel-in-progress: false

jobs:
  configuration:
    if: github.repository == 'noah-be/overte'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a dedicated private macOS pool and configuration
        env:
          RELEASE_RUNNER_LABEL: ${{ vars.IOS_RELEASE_CHECK_RUNNER_LABEL }}
          OVERTE_IOS_RELEASE_CONFIG: ${{ vars.IOS_RELEASE_CONFIG_PATH }}
        run: |
          set -euo pipefail
          test -n "$OVERTE_IOS_RELEASE_CONFIG"
          [[ "$RELEASE_RUNNER_LABEL" =~ ^[a-z0-9]+(-[a-z0-9]+)+$ ]]
          case "$RELEASE_RUNNER_LABEL" in
            self-hosted|overte-android-*|overte-pico*) exit 1 ;;
          esac

  inspect:
    needs: configuration
    if: github.repository == 'noah-be/overte'
    # Select a dedicated private macOS pool through repository configuration.
    runs-on: [self-hosted, macOS, "${{ vars.IOS_RELEASE_CHECK_RUNNER_LABEL }}"]
    timeout-minutes: 240
    steps:
      - name: Check out selected source and reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; same reviewed pin as ios-integrated
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Evaluate private release inputs
        env:
          RELEASE_GROUP: ${{ inputs.group }}
          RELEASE_RUNNER_LABEL: ${{ vars.IOS_RELEASE_CHECK_RUNNER_LABEL }}
          OVERTE_IOS_RELEASE_CONFIG: ${{ vars.IOS_RELEASE_CONFIG_PATH }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_RUNNER_LABEL"
          test -n "$OVERTE_IOS_RELEASE_CONFIG"
          python3 ios/release-check/run.py "$RELEASE_GROUP" \
            --output "$RUNNER_TEMP/ios-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      # Deliberately no upload-artifact, release, signing, installation or Apple step.
      # Findings/logs stay in the private runner directory; inspect and remove locally.
