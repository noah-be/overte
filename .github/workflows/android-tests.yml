name: Android tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, android-main, android-phone, android-vr, android-vr-pico]
    paths:
      - "android/**"
      - "interface/**"
      - "libraries/**"
      - "scripts/**"
      - ".github/workflows/android-tests.yml"
      - "!**/*.md"
  push:
    branches:
      - android-phone
      - "ci/android/**"
      - "test/android/**"
      - "test/android-phone/**"
      - "test/android-pico/**"
    paths:
      - "android/**"
      - "interface/**"
      - "libraries/**"
      - "scripts/**"
      - ".github/workflows/android-tests.yml"
      - "!**/*.md"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      run_regression:
        description: Run the complete device-free regression tier
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: android

jobs:
  fast:
    name: Fast host tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Install Qt Quick test runtime
        run: |
          sudo apt-get -o Acquire::Retries=4 update
          sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends \
            qtdeclarative5-dev-tools qml-module-qttest qml-module-qtquick2 \
            qml-module-qtquick-controls qml-module-qtquick-controls2 \
            qml-module-qtquick-layouts \
            qml-module-qtquick-window2
      - name: Install pinned static quality tools
        run: common/tests/quality/install-tools.sh
      - name: Run fast tier
        run: common/tests/run-tests.sh fast
        env:
          OVERTE_REQUIRE_QML_TESTS: 1
          QT_QPA_PLATFORM: offscreen
      - name: Enforce production JavaScript coverage
        run: common/tests/coverage/run-javascript-coverage.sh
      - name: Summarize fast results
        if: always()
        continue-on-error: true
        run: >-
          python3 common/tests/reporting/generate_summary.py
          --junit fast=build/test-results/suite/TEST-android-fast.xml
          --junit native=build/test-results/native/TEST-native.xml
          --junit javascript=build/test-results/javascript/TEST-javascript.xml
          --junit qml=build/test-results/qml/TEST-qml.xml
          --output build/reports/summary/fast.md
      - name: Publish JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-fast-results-${{ github.run_attempt }}
          path: |
            android/build/test-results/suite/
            android/build/test-results/native/
            android/build/test-results/javascript/
            android/build/test-results/qml/
            android/build/reports/summary/fast.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish coverage summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-fast-coverage-${{ github.run_attempt }}
          path: android/build/reports/coverage/
          if-no-files-found: warn
          retention-days: 7

  contracts:
    name: Architecture and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Run contract tier
        run: common/tests/run-tests.sh contracts
      - name: Summarize contract results
        if: always()
        continue-on-error: true
        run: >-
          python3 common/tests/reporting/generate_summary.py
          --junit contracts=build/test-results/suite/TEST-android-contracts.xml
          --output build/reports/summary/contracts.md
      - name: Publish JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-contract-results-${{ github.run_attempt }}
          path: |
            android/build/test-results/suite/
            android/build/reports/summary/contracts.md
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: JVM and native host coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Create isolated native coverage environment
        run: |
          python3 -m venv build/tools/native-coverage-venv
          build/tools/native-coverage-venv/bin/pip install \
            --disable-pip-version-check --retries 4 --timeout 30 gcovr==8.4
      - name: Enforce dependency-free JVM coverage
        run: common/tests/coverage/run-standalone-jvm-coverage.sh
      - name: Run launcher Activities on Robolectric API 24 through 35
        run: common/tests/robolectric/run-tests.sh
      - name: Enforce native policy coverage
        run: common/tests/coverage/run-native-coverage.sh
      - name: Reject surviving critical policy mutations
        if: github.event_name != 'workflow_dispatch'
        run: common/tests/run-tests.sh mutation
      - name: Summarize host coverage results
        if: always()
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          summary_args=(
            --junit 'robolectric=common/tests/robolectric/build/test-results/test/TEST-*.xml'
            --coverage jvm=build/reports/coverage/jvm-standalone/report.xml
            --coverage native-interface=build/reports/coverage/native/interface.xml
            --coverage native-handoff=build/reports/coverage/native/pending-handoff.xml
            --output build/reports/summary/coverage.md
          )
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            summary_args+=(--junit mutation=build/test-results/suite/TEST-android-mutation.xml)
            summary_args+=(--mutation critical=build/reports/mutation/critical-policies.json)
          fi
          python3 common/tests/reporting/generate_summary.py "${summary_args[@]}"
      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-host-coverage-${{ github.run_attempt }}
          path: |
            android/build/reports/coverage/
            android/build/test-results/suite/TEST-android-mutation.xml
            android/common/tests/robolectric/build/test-results/test/
            android/build/reports/summary/coverage.md
          if-no-files-found: error
          retention-days: 7

  mutation-extended:
    name: Extended deterministic mutation campaign
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'android-long-diagnostics'))
    needs: [fast, contracts, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Run extended mutation tier
        timeout-minutes: 35
        run: common/tests/run-tests.sh mutation-extended
      - name: Summarize extended mutation results
        if: always()
        continue-on-error: true
        run: >-
          python3 common/tests/reporting/generate_summary.py
          --junit mutation-extended=build/test-results/suite/TEST-android-mutation-extended.xml
          --mutation mutation-extended=build/reports/mutation/critical-policies-extended.json
          --output build/reports/summary/mutation-extended.md
      - name: Publish extended mutation diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-mutation-extended-results-${{ github.run_attempt }}
          path: |
            android/build/test-results/suite/TEST-android-mutation-extended.xml
            android/build/reports/mutation/critical-policies-extended.json
            android/build/reports/summary/mutation-extended.md
          if-no-files-found: error
          retention-days: 30

  stability:
    name: Shuffled and parallel host stability
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'android-long-diagnostics'))
    needs: [fast, contracts, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Run order and parallel isolation stability tier
        timeout-minutes: 40
        run: common/tests/run-tests.sh stability
      - name: Summarize stability results
        if: always()
        continue-on-error: true
        run: >-
          python3 common/tests/reporting/generate_summary.py
          --junit stability=build/test-results/suite/TEST-android-stability.xml
          --output build/reports/summary/stability.md
      - name: Publish stability diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-stability-results-${{ github.run_attempt }}
          path: |
            android/build/test-results/suite/TEST-android-stability.xml
            android/build/reports/summary/stability.md
          if-no-files-found: error
          retention-days: 30

  endurance:
    name: Scaled lifecycle and policy endurance
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'android-long-diagnostics'))
    needs: [fast, contracts, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Install Qt Quick endurance runtime
        run: |
          sudo apt-get -o Acquire::Retries=4 update
          sudo apt-get -o Acquire::Retries=4 install -y --no-install-recommends \
            qtdeclarative5-dev-tools qml-module-qttest qml-module-qtquick2 \
            qml-module-qtquick-controls qml-module-qtquick-controls2 \
            qml-module-qtquick-layouts qml-module-qtquick-window2
      - name: Run scaled endurance tier
        timeout-minutes: 15
        env:
          OVERTE_JS_ENDURANCE_CYCLES: 100
          OVERTE_NATIVE_ENDURANCE_CYCLES: 1000
          OVERTE_REQUIRE_QML_TESTS: 1
          QT_QPA_PLATFORM: offscreen
        run: common/tests/run-tests.sh endurance
      - name: Summarize endurance results
        if: always()
        continue-on-error: true
        run: >-
          python3 common/tests/reporting/generate_summary.py
          --junit endurance=build/test-results/suite/TEST-android-endurance.xml
          --junit native=build/test-results/native/TEST-native.xml
          --junit qml-endurance=build/test-results/qml-endurance/TEST-qml-endurance.xml
          --output build/reports/summary/endurance.md
      - name: Publish endurance diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-endurance-results-${{ github.run_attempt }}
          path: |
            android/build/test-results/suite/TEST-android-endurance.xml
            android/build/test-results/native/TEST-native.xml
            android/build/test-results/qml-endurance/TEST-qml-endurance.xml
            android/build/reports/summary/endurance.md
          if-no-files-found: error
          retention-days: 30

  regression:
    name: Complete device-free regression
    if: github.event_name == 'workflow_dispatch' && inputs.run_regression
    needs: [fast, contracts, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 22
      - name: Run regression tier
        run: common/tests/run-tests.sh regression
      - name: Summarize regression results
        if: always()
        continue-on-error: true
        run: >-
          python3 common/tests/reporting/generate_summary.py
          --junit regression=build/test-results/suite/TEST-android-regression.xml
          --output build/reports/summary/regression.md
      - name: Publish JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-regression-results-${{ github.run_attempt }}
          path: |
            android/build/test-results/suite/
            android/build/reports/summary/regression.md
          if-no-files-found: error
          retention-days: 30
