name: Android Phone emulator acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful release-candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Successful release-candidate workflow run attempt
        required: true
        type: string
      release_tag:
        description: Exact candidate tag used in the artifact name
        required: true
        type: string
      apk_sha256:
        description: Approved SHA-256 from the release manifest
        required: true
        type: string
      approve_installation:
        description: Explicitly authorize APK installation and ADB tests
        required: true
        default: false
        type: boolean

# Default-branch registration only. Select the owning Android branch or release
# tag in Run workflow; that ref retains the complete implementation and gates.
permissions:
  contents: read

jobs:
  select-platform-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the owning platform revision
        run: |
          echo "::error::Select the owning Android product branch or approved release tag. main contains no Android build implementation."
          exit 1
