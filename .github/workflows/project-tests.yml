name: Shared project CI

on:
  workflow_call:
  push:
    branches:
      - main
      - android-main
      - android-phone
      - android-vr
      - android-vr-pico
      - apple-main
      - apple-ios
      - "ci/**"
      - "test/**"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-project-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  project-tests:
    runs-on: ubuntu-24.04
    env:
      OVERTE_QML_TEST_RUNNER: /usr/lib/qt6/bin/qmltestrunner
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install repository-check dependencies
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: python3 -m pip install --disable-pip-version-check -r tests/requirements-repository.txt

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v bash
          command -v jq
          python3 --version
          node --version
          java -version

      - name: Install QML and portable C++ contract prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qml-module-qttest qtdeclarative5-dev-tools qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest

      - name: Run project suite
        run: |
          set -euo pipefail
          tests/run-project-tests.py \
            --timeout 240 \
            --junit build/test-results/project-tests.xml

      - name: Run full device E2E control-plane gate
        run: |
          set -euo pipefail
          python3 tests/device/run_control_plane_tests.py \
            --profile full --require-qml --timeout-seconds 900 \
            --junit build/test-results/device-e2e-control-plane.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: project-test-results
          path: |
            build/test-results/project-tests.xml
            build/test-results/device-e2e-contracts.xml
            build/test-results/device-e2e-control-plane.xml
          if-no-files-found: warn
          retention-days: 7
