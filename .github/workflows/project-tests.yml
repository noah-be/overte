name: Hardware-independent project tests

on:
  pull_request:
  push:
    branches:
      - feature/pico4-support
      - "test/*"

permissions:
  contents: read

jobs:
  project-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install deterministic test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq nodejs openjdk-17-jdk-headless python3
      - name: Run project suite
        run: |
          tests/run-project-tests.py \
            --timeout 180 \
            --junit build/test-results/project-tests.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: project-test-results
          path: build/test-results/project-tests.xml
          if-no-files-found: error
