name: Shared project CI

on:
  workflow_call:
    inputs:
      dependency_projects:
        type: string
        default: ""
        description: Exact tool projects selected by the trusted repository router
  push:
    # Parent pushes run these checks in parent-qualification.yml, where the same
    # successful execution also produces evidence for downstream syncs.
    branches:
      - android-phone
      - android-vr-pico
      - apple-ios
      - "ci/**"
      - "test/**"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-project-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.push.outputs.projects || steps.caller.outputs.projects }}
    steps:
      - name: Check out source and exact push parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the trusted reusable caller selection
        if: github.event_name != 'push'
        id: caller
        env:
          DEPENDENCY_PROJECTS: ${{ inputs.dependency_projects }}
        run: |
          # Candidate helper changes cannot switch a required full PR to tool checks.
          python3 - <<'PY'
          import os
          selected = os.environ['DEPENDENCY_PROJECTS']
          projects = selected.split(',') if selected else []
          assert len(projects) == len(set(projects))
          assert set(projects) <= {'tools/jsdoc', 'server-console'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('projects=' + selected + '\n')
          PY
      - name: Select checks from the exact protected push
        if: github.event_name == 'push'
        id: push
        run: >-
          python3 tools/repository-checks/tool_dependencies.py
          --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"

  project-tests:
    needs: route
    if: needs.route.outputs.projects == ''
    runs-on: ubuntu-24.04
    env:
      OVERTE_QML_TEST_RUNNER: /usr/lib/qt6/bin/qmltestrunner
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          command -v bash
          command -v jq
          command -v cmake
          command -v ninja
          command -v ctest
          python3 --version
          node --version
          java -version

      - name: Install QML and portable C++ contract prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qml-module-qttest qtdeclarative5-dev-tools qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window \
            qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest

      - name: Prepare isolated host evidence validators
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          # Ubuntu 24.04 restricts user namespaces through AppArmor. Permit
          # offline test sandboxes only on this disposable GitHub-hosted VM.
          # Tests still run as the runner user and must pass the isolation probe.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net true
          python3 -m venv build/host-tests-env
          build/host-tests-env/bin/python -m pip install --disable-pip-version-check -r tests/requirements-host.txt

      - name: Run complete host test suite
        run: |
          set -euo pipefail
          build/host-tests-env/bin/python tests/run-project-tests.py \
            --profile host --timeout 240 --host-timeout 900 \
            --junit build/test-results/project-tests.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: project-test-results
          path: |
            build/test-results/project-tests.xml
            build/test-results/device-e2e-control-plane.xml
            build/test-results/device-self-tests.json
          if-no-files-found: warn
          retention-days: 7

  tool-dependencies:
    needs: route
    if: needs.route.outputs.projects != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Check affected tool dependencies and behavior
        env:
          DEPENDENCY_PROJECTS: ${{ needs.route.outputs.projects }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: python3 tools/repository-checks/tool_dependencies.py --projects "$DEPENDENCY_PROJECTS"
