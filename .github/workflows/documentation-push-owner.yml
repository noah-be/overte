# The reusable checker stays contents-only for existing callers.
# This fixed push owner consumes original proof or requires actual documentation.
name: Documentation checks
on:
  push:
    branches: [main, android-phone, android-vr-pico, apple-ios]
permissions:
  contents: read
concurrency:
  group: documentation-push-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  documentation-source:
    name: Authenticate original documentation owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    outputs:
      documentation_reused: ${{ steps.reuse.outputs.shared_reused }}
      documentation_unchanged: ${{ steps.empty.outputs.no_execution }}
    steps:
    - name: Check out current trusted source without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github
          tools/test-evidence
          tools/sync-test-reuse
          tools/repository-checks
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Authenticate the protected base commitment before repository imports
      id: protected-source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        /usr/bin/python3 -I -S -B - <<'SOURCE_GUARD'
        # Fixed native recipe bootstrap. No repository module is imported here.
        import hashlib, json, os, re, stat, subprocess, time, urllib.request
        from pathlib import Path

        deadline=time.monotonic()+45
        def need(value):
            if not value: raise ValueError('protected source unavailable')
        def unique(pairs):
            value={}
            for key,item in pairs:
                need(key not in value); value[key]=item
            return value
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, response, code, message, headers, target):
                raise ValueError('protected source redirect denied')
        def get(endpoint):
            request=urllib.request.Request('https://api.github.com/repos/noah-l-frank/overte/'+endpoint,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='GET')
            remaining=deadline-time.monotonic();need(remaining>0)
            with urllib.request.build_opener(NoRedirect()).open(request,timeout=min(10,remaining)) as response:
                need(response.status==200 and response.geturl()==request.full_url)
                raw=response.read(16000001)
            need(len(raw)<=16000000 and time.monotonic()<=deadline)
            return json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _: need(False))
        admitted=False
        try:
            targets={'main','android-main','android-phone','android-vr','android-vr-pico','apple-main','apple-ios'}
            need(os.environ.get('GITHUB_REPOSITORY')=='noah-l-frank/overte' and os.environ.get('GITHUB_REPOSITORY_ID')=='1319052603')
            event_path=Path(os.environ['GITHUB_EVENT_PATH'])
            need(not event_path.is_symlink() and event_path.is_file() and event_path.stat().st_size<=1000000)
            event=json.loads(event_path.read_bytes(),object_pairs_hook=unique)
            pr=event.get('pull_request')
            target=pr.get('base',{}).get('ref') if isinstance(pr,dict) else os.environ.get('GITHUB_REF','').removeprefix('refs/heads/')
            base=pr.get('base',{}).get('sha') if isinstance(pr,dict) else event.get('before')
            source=os.environ.get('GITHUB_SHA','')
            need(target in targets and type(base) is str and re.fullmatch('[0-9a-f]{40}',base) and re.fullmatch('[0-9a-f]{40}',source))
            branch=get('branches/'+target)
            need(branch.get('protected') is True and branch.get('name')==target and branch.get('commit',{}).get('sha')==(base if isinstance(pr,dict) else source))
            commit=get('git/commits/'+base)
            tree=commit.get('tree',{}).get('sha')
            need(commit.get('sha')==base and type(tree) is str and re.fullmatch('[0-9a-f]{40}',tree))
            inventory=get('git/trees/'+tree+'?recursive=1')
            need(inventory.get('sha')==tree and inventory.get('truncated') is False and type(inventory.get('tree')) is list)
            name='tools/test-evidence/source_admission.py'
            entries=[row for row in inventory['tree'] if isinstance(row,dict) and row.get('path')==name]
            need(len(entries)==1 and entries[0].get('mode')=='100644' and entries[0].get('type')=='blob')
            root=Path('trusted').absolute()
            path=root/name
            current=Path(path.anchor)
            for part in path.parts[1:]:
                current/=part;need(not current.is_symlink())
            info=path.stat();need(stat.S_ISREG(info.st_mode) and not info.st_mode&0o111 and info.st_size<=1000000)
            body=path.read_bytes();need(len(body)<=1000000)
            need(hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entries[0].get('sha'))
            scope={'__name__':'protected_source_bootstrap','__file__':str(path)}
            exec(compile(body,str(path),'exec'),scope)
            scope['authenticate'](event,os.environ,scope['GitHubSource'](deadline=deadline),root)
            admitted=True
        except (ValueError,OSError,KeyError,TypeError,AttributeError,RuntimeError,subprocess.SubprocessError):
            pass
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('admitted='+str(admitted).lower()+'\n')
        print('Protected source commitment '+('admitted.' if admitted else 'unavailable; existing execution remains required.'))
        SOURCE_GUARD
    - name: Require original native proof for every documentation command
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if test '${{ steps.protected-source.outputs.admitted }}' = true; then
          /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")' trusted/tools/test-evidence trusted/tools/test-evidence/postmerge.py --report original-documentation-proof.json
        else
          printf '%s\n' 'shared_reused=false' 'package_work=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Check out only the unchanged candidate metadata without credentials
      if: steps.reuse.outputs.no_execution == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: candidate
        fetch-depth: 2
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github
          tests/platform-profile.json
    - name: Independently verify unchanged documentation inputs
      id: empty
      if: steps.reuse.outputs.no_execution == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")' trusted/tools/test-evidence trusted/tools/test-evidence/postmerge.py --verify-empty --candidate "$GITHUB_WORKSPACE/candidate" --report documentation-no-execution.json
    - name: Require a complete proof or actual documentation route
      env:
        SHARED_REUSED: ${{ steps.reuse.outputs.shared_reused }}
      run: |
        case "$SHARED_REUSED" in
          true|false) ;;
          *) printf '%s\n' 'Documentation ownership route is unavailable' >&2; exit 1 ;;
        esac
  documentation:
    needs: documentation-source
    if: needs.documentation-source.outputs.documentation_reused != 'true' && needs.documentation-source.outputs.documentation_unchanged != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/documentation-checks.yml
