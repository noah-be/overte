name: Android Phone release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable android-phone-vM.m.p-alpha.N tag
        required: true
        type: string
      version_code:
        description: Deterministic Android version code for the tag
        required: true
        type: string

# Default-branch registration only. Select the owning Android branch or release
# tag in Run workflow; that ref retains the complete implementation and gates.
permissions:
  contents: read

jobs:
  select-platform-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the owning platform revision
        run: |
          echo "::error::Select the owning Android product branch or approved release tag. main contains no Android build implementation."
          exit 1
