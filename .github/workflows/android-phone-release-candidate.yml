name: Android Phone release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable android-phone-vM.m.p-alpha.N tag
        required: true
        type: string
      version_code:
        description: Deterministic Android version code for the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-phone-release-candidate-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: Validate immutable release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate tag without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag and monotonic version
        run: |
          set -euo pipefail
          android/ci/verify-phone-release.py \
            --tag '${{ inputs.release_tag }}' \
            --version-code '${{ inputs.version_code }}' \
            --published-code-floor '${{ vars.ANDROID_PHONE_PUBLISHED_VERSION_CODE }}' \
            --source-revision "$GITHUB_SHA" \
            --output android/build/release/version-manifest.json
      - name: Run release contracts
        working-directory: android
        run: tests/run-tests.sh contracts

  build:
    name: Build signed local candidate
    needs: preflight
    environment: android-phone-release-candidate
    runs-on: [self-hosted, linux, x64, overte-android-phone-release]
    timeout-minutes: 240
    env:
      CONAN_HOME: ${{ github.workspace }}/android/build/ci-phone-release-conan2
      PHONE_BUILD_TMPDIR: ${{ github.workspace }}/android/build/release-package-tmp
      PHONE_APK_VERIFY_TMPDIR: ${{ github.workspace }}/android/build/release-verify-tmp
    steps:
      - name: Check out exact approved tag without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reverify approved source and version
        run: |
          set -euo pipefail
          android/ci/verify-phone-release.py \
            --tag '${{ inputs.release_tag }}' \
            --version-code '${{ inputs.version_code }}' \
            --published-code-floor '${{ vars.ANDROID_PHONE_PUBLISHED_VERSION_CODE }}' \
            --source-revision "$GITHUB_SHA" \
            --output android/build/release/version-manifest.json
      - name: Run complete device-free host tier
        working-directory: android
        run: tests/run-tests.sh host --report-dir build/test-results/android-phone-release-host
      - name: Verify build environment
        working-directory: android
        run: ./build-phone.sh doctor
      - name: Restore checksum-verified 16 KiB dependencies
        working-directory: android
        run: ./build-phone.sh deps --download
      - name: Prepare verified dependencies
        working-directory: android
        run: ./build-phone.sh prepare
      - name: Build signed release APK
        working-directory: android
        env:
          OVERTE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PHONE_UPLOAD_KEYSTORE_BASE64 }}
          OVERTE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PHONE_UPLOAD_KEYSTORE_PASSWORD }}
          OVERTE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PHONE_UPLOAD_KEY_ALIAS }}
          OVERTE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PHONE_UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NUMBER: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_number="${RELEASE_NUMBER#android-phone-v}"
          secret_dir="$PWD/build/release-secrets"
          key_path="$secret_dir/upload-key.jks"
          cleanup() { rm -f -- "$key_path"; rmdir -- "$secret_dir" 2>/dev/null || true; }
          trap cleanup EXIT
          umask 077
          mkdir -p -- "$secret_dir" "$PHONE_BUILD_TMPDIR"
          test -n "$OVERTE_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$OVERTE_ANDROID_KEYSTORE_BASE64" | base64 --decode >"$key_path"
          test -s "$key_path"
          OVERTE_ANDROID_KEYSTORE="$key_path" \
          TMPDIR="$PHONE_BUILD_TMPDIR" \
          JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=$PHONE_BUILD_TMPDIR" \
          CMAKE_BUILD_PARALLEL_LEVEL=8 PICO_BUILD_JOBS=8 SHADERGEN_JOBS=8 \
          ./gradlew --no-daemon --settings-file settings-phone.gradle \
            -PVERSION_CODE="$VERSION_CODE" -PRELEASE_NUMBER="$release_number" \
            :phoneInterface:assembleRelease --max-workers=8 --stacktrace
      - name: Verify signer, contents, alignment and provenance
        env:
          PHONE_APK: android/apps/phoneInterface/build/outputs/apk/release/phoneInterface-release.apk
          APPROVED_SIGNER: ${{ vars.ANDROID_PHONE_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          android/ci/verify-phone-apk.py "$PHONE_APK" \
            --apkanalyzer "$sdk_root/cmdline-tools/latest/bin/apkanalyzer" \
            --apksigner "$sdk_root/build-tools/36.0.0/apksigner" \
            --expect-debuggable 0 --expect-signer "$APPROVED_SIGNER" \
            --source-revision "$GITHUB_SHA" \
            --output android/build/release/apk-manifest.json
      - name: Create local draft metadata and SBOM
        env:
          PHONE_APK: android/apps/phoneInterface/build/outputs/apk/release/phoneInterface-release.apk
        run: |
          set -euo pipefail
          android/ci/create-phone-release-metadata.py \
            --repository "$GITHUB_WORKSPACE" --apk "$PHONE_APK" \
            --apk-manifest android/build/release/apk-manifest.json \
            --version-manifest android/build/release/version-manifest.json \
            --output-dir android/build/release/draft
          cp -- "$PHONE_APK" android/build/release/apk-manifest.json \
            android/build/release/version-manifest.json android/build/release/draft/
      - name: Upload locally verifiable candidate (not a release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-phone-rc-${{ inputs.release_tag }}
          path: android/build/release/draft/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-phone-rc-reports-${{ github.run_id }}
          path: android/build/test-results/android-phone-release-host/
          if-no-files-found: warn
          retention-days: 14
