name: Desktop branch topology

on:
  pull_request:
    branches:
      - linux-main
      - windows-main

permissions:
  contents: read

jobs:
  enforce-desktop-path-ownership:
    name: Enforce main desktop sync path
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch current main parent
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Load trusted parent checker
        run: >-
          git show origin/main:tests/desktop-branch-topology-check.py
          > "$RUNNER_TEMP/desktop-branch-topology-check.py"
      - name: Validate ancestry and path ownership
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: >-
          python3 "$RUNNER_TEMP/desktop-branch-topology-check.py"
          --main origin/main
          --head HEAD
          --target "$TARGET_BRANCH"
