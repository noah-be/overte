name: Pico 4 release candidate

on:
  workflow_dispatch:
    inputs:
      release_pilot_authorized:
        description: Enable only under the separately authorized release pilot
        required: true
        default: false
        type: boolean

# Default-branch registration only. Select the owning Android branch or release
# tag in Run workflow; that ref retains the complete implementation and gates.
permissions:
  contents: read

jobs:
  select-platform-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the owning platform revision
        run: |
          echo "::error::Select the owning Android product branch or approved release tag. main contains no Android build implementation."
          exit 1
