name: Pico 4 release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pico4-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-candidate:
    # Approval and secrets are owned by this protected environment. Never add
    # pull_request, push, or a mutable branch path to this workflow.
    environment: pico4-release-candidate
    runs-on: [self-hosted, linux, x64, overte-android-release]
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      PICO_APK: android/apps/picoInterface/build/outputs/apk/release/picoInterface-release.apk
    steps:
      - name: Check out selected tag without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject mutable refs and derive release coordinates
        id: release
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || {
            echo "Release candidates must be dispatched from an existing tag" >&2
            exit 2
          }
          [[ "$(git rev-list -n 1 "$GITHUB_REF")" == "$GITHUB_SHA" ]] || {
            echo "Checked-out revision does not match the selected tag" >&2
            exit 2
          }
          android/ci/pico4-release.py \
            --tag "$GITHUB_REF_NAME" \
            --github-ref "$GITHUB_REF" \
            --revision "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run device-free regression suite
        run: tests/run-project-tests.py --timeout 240 --junit build/test-results/project-tests.xml

      - name: Verify build environment and restore pinned dependencies
        working-directory: android
        run: |
          set -euo pipefail
          ./build-pico.sh doctor
          ./build-pico.sh deps --download
          ./build-pico.sh prepare

      - name: Materialize protected signing key
        id: signing
        env:
          PICO_RELEASE_KEYSTORE_BASE64: ${{ secrets.PICO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_store="$RUNNER_TEMP/pico4-release-${GITHUB_RUN_ID}.jks"
          umask 077
          printf '%s' "$PICO_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          [[ -s "$key_store" ]] || { echo "Protected keystore is empty" >&2; exit 2; }
          echo "key_store=$key_store" >> "$GITHUB_OUTPUT"

      - name: Build signed Pico release candidate
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ORG_GRADLE_PROJECT_RELEASE_NUMBER: ${{ steps.release.outputs.version_name }}
          ORG_GRADLE_PROJECT_RELEASE_TYPE: RC
          ORG_GRADLE_PROJECT_STABLE_BUILD: "0"
          ORG_GRADLE_PROJECT_PICO_RELEASE_STORE_FILE: ${{ steps.signing.outputs.key_store }}
          ORG_GRADLE_PROJECT_PICO_RELEASE_STORE_PASSWORD: ${{ secrets.PICO_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_PICO_RELEASE_KEY_ALIAS: ${{ secrets.PICO_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_PICO_RELEASE_KEY_PASSWORD: ${{ secrets.PICO_RELEASE_KEY_PASSWORD }}
        run: ./build-pico.sh release --stacktrace

      - name: Verify APK identity, version, signature and provenance
        env:
          PICO_RELEASE_CERT_SHA256: ${{ secrets.PICO_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          android/ci/verify-pico-apk.py "$PICO_APK" \
            --aapt "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" \
            --source-revision "$GITHUB_SHA" \
            --expected-version-code "${{ steps.release.outputs.version_code }}" \
            --expected-version-name "${{ steps.release.outputs.version_name }}" \
            --expected-signer-sha256 "$PICO_RELEASE_CERT_SHA256" \
            --output build/pico4/apk-manifest.json
          android/ci/pico4-release.py \
            --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" \
            --apk-manifest build/pico4/apk-manifest.json \
            --dependency-checksums android/conan/prebuilt/pico4-deps-v1.sha256 \
            --output-dir build/pico4

      - name: Upload locally verifiable reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pico4-release-reports-${{ github.run_id }}
          path: |
            build/test-results/project-tests.xml
            build/pico4/apk-manifest.json
            build/pico4/pico4-release-manifest.json
            build/pico4/pico4-sbom.cdx.json
            build/pico4/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release and attach verified files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || {
            echo "A release already exists for this immutable tag" >&2
            exit 2
          }
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Overte Pico 4 ${{ steps.release.outputs.version_name }}" \
            --notes-file android/docs/PICO4_RELEASE_CHECKLIST.md \
            "$PICO_APK" \
            build/pico4/apk-manifest.json \
            build/pico4/pico4-release-manifest.json \
            build/pico4/pico4-sbom.cdx.json \
            build/pico4/SHA256SUMS

      - name: Remove signing material
        if: always()
        env:
          PICO_KEY_STORE: ${{ steps.signing.outputs.key_store }}
        run: |
          set -euo pipefail
          [[ -z "$PICO_KEY_STORE" ]] || rm -f -- "$PICO_KEY_STORE"
