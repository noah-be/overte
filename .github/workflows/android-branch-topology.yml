name: Android branch topology

on:
  pull_request:
    branches:
      - android-phone
      - android-vr
      - android-vr-pico
      - android-vr-quest

permissions:
  contents: read

jobs:
  enforce-android-sync-path:
    name: Enforce Android parent sync path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          # The merge commit plus its parents are enough to connect HEAD to the
          # explicitly fetched current target history. Do not fetch every branch,
          # tag, and historical blob in this large repository.
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch current Android parent branches
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            android-phone|android-vr|android-vr-pico|android-vr-quest) ;;
            *) echo "Unsupported Android target: $TARGET_BRANCH" >&2; exit 2 ;;
          esac

          declare -A seen=()
          refspecs=()
          for branch in android-main android-vr "$TARGET_BRANCH"; do
            [[ -n "${seen[$branch]:-}" ]] && continue
            seen[$branch]=1
            refspecs+=("+refs/heads/$branch:refs/remotes/origin/$branch")
          done

          git fetch --no-tags --filter=blob:none --unshallow \
            origin "${refspecs[@]}"
      - name: Test Android topology policy
        run: python3 tests/android-branch-topology-test.py
      - name: Validate branch topology
        run: >-
          python3 tests/android-branch-topology-check.py
          --target "${{ github.base_ref }}"
          --android-main origin/android-main
          --android-vr origin/android-vr
          --head HEAD
