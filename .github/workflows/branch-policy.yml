name: Branch policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - android-main
      - android-phone
      - android-vr
      - android-vr-pico
      - apple-main
      - apple-ios
      - linux-main
      - windows-main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Run the policy implementation from the default branch. The pull request's
      # files are inspected through the API and are never executed.
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pull request direction and identity
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          expected_head_args=()
          if python3 tools/branch-policy/check.py is-permanent --branch "$HEAD_BRANCH" >/dev/null 2>&1; then
            expected_head_sha=$(gh api \
              "repos/$REPOSITORY/git/ref/heads/$HEAD_BRANCH" \
              --jq '.object.sha')
            expected_head_args=(--expected-head-sha "$expected_head_sha")
          fi

          changed_files=$(gh api --paginate --slurp \
            "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" \
            --jq 'add | .[].filename')

          printf '%s\n' "$changed_files" | python3 tools/branch-policy/check.py check-pr \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --repository-id "$REPOSITORY_ID" \
            --base-repository-id "$BASE_REPOSITORY_ID" \
            --head-repository-id "$HEAD_REPOSITORY_ID" \
            --head-sha "$HEAD_SHA" \
            "${expected_head_args[@]}" \
            --changed-files-stdin
