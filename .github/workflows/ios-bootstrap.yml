name: iOS bootstrap

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-bootstrap.yml'
      - 'cmake/QtCompat.cmake'
      - 'cmake/init.cmake'
      - 'cmake/compiler.cmake'
      - 'docs/ios/**'
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: ios-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Run device-free contracts
        run: ios/tests/run-tests.sh

      - name: Verify Xcode environment
        run: ios/build-ios.sh doctor --platform simulator

      - name: Build unsigned simulator app
        run: ios/build-ios.sh build --platform simulator --configuration Debug

      - name: Verify app bundle
        run: |
          ios/ci/verify-app.sh \
            build-ios/simulator/Debug-iphonesimulator/OverteIOSBootstrap.app

      - name: Launch on iPhone and iPad simulators
        run: |
          ios/ci/simulator-smoke.sh \
            build-ios/simulator/Debug-iphonesimulator/OverteIOSBootstrap.app

      - name: Package unsigned simulator app
        run: ios/build-ios.sh package --platform simulator --configuration Debug

      - name: Upload simulator artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: overte-ios-bootstrap-simulator-${{ github.run_id }}
          path: build-ios/artifacts/OverteIOSBootstrap-Debug-simulator.zip
          if-no-files-found: error
          retention-days: 7

