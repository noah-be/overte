name: "Install Conan dependencies"
description: "Runs `conan install` for building Overte."
inputs:
   qt_source:
     required: false
     description: "Where to get Qt from. See our conanfile.py for the available options."
   cppstd:
     required: false
     description: "Which C++ standard to use."
   build_type:
     required: false
     description: "Which CMake build type to use. E.g. Release, RelWithDebInfo, Debug"
     default: Release
   conan_profile:
     required: false
     description: "Which Conan profile to use. E.g. './tools/conan-profiles/vs-22-release'. Uses Conan's default if not defined, which may or may not work."
     default: default
runs:
  using: "composite"
  steps:
  - name: Install Conan dependencies
    shell: bash
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      CONAN_PROFILE: ${{ inputs.conan_profile }}
      CPPSTD: ${{ inputs.cppstd }}
      QT_SOURCE: ${{ inputs.qt_source }}
    run: |
      # Run twice to work around OpenSSL not being found. See: https://github.com/overte-org/overte-conan-recipes/issues/1
      # `--format=json > build.json` creates a graph of dependencies, which can later be used to check for cache misses.
      conan install . -s "compiler.cppstd=$CPPSTD" -s "build_type=$BUILD_TYPE" -o "Overte/*:qt_source=$QT_SOURCE" -b missing -pr="$CONAN_PROFILE" -of build --format=json > build.json
      conan install . -s "compiler.cppstd=$CPPSTD" -s "build_type=$BUILD_TYPE" -o "Overte/*:qt_source=$QT_SOURCE" -b missing -pr="$CONAN_PROFILE" -of build
