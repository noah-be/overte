# Prospective original-PR consumer; source guards remain disabled.
name: Parent qualification
permissions:
  contents: read
concurrency:
  group: parent-qualification-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  qualify-parent:
    name: Qualify exact parent
    runs-on: ubuntu-24.04
    env:
      OVERTE_QML_TEST_RUNNER: /usr/lib/qt6/bin/qmltestrunner
    timeout-minutes: 30
    steps:
    - name: Check out trusted shared execution policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          .github
          tools/test-evidence
          tools/sync-test-reuse
          tools/repository-checks
          tools/sbom
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Look up original protected PR proof before candidate setup
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 trusted/tools/test-evidence/postmerge.py --report build/parent-qualification/original-proof.json
    - name: Require an explicit reuse or actual-execution route
      env:
        SHARED_REUSED: ${{ steps.reuse.outputs.shared_reused }}
        PACKAGE_WORK: ${{ steps.reuse.outputs.package_work }}
      run: |
        case "$SHARED_REUSED/$PACKAGE_WORK" in
          true/true|true/false|false/true) ;;
          *) printf '%s\n' 'Missing or inconsistent original-proof route' >&2; exit 1 ;;
        esac
    - name: Check out the exact parent commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: candidate
        fetch-depth: 0
        persist-credentials: false
      if: steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true'
    - name: Materialize the exact live parent ref
      working-directory: candidate
      env:
        PARENT_BRANCH: ${{ github.ref_name }}
      run: git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/$PARENT_BRANCH"
      if: steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true'
    - name: Independently select host and package checks
      id: route
      run: python3 trusted/tools/repository-checks/package_checks.py plan --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      if: steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true'
    - name: Set up Python
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
      if: steps.reuse.outputs.shared_reused != 'true' || steps.reuse.outputs.package_work == 'true'
    - name: Set up Java
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify runner prerequisites
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      run: |
        set -euo pipefail
        command -v bash
        command -v jq
        command -v cmake
        command -v ctest
        python3 --version
        node --version
        java -version
    - name: Independently select affected parent host contracts
      id: host
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      env:
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/host_selection.py --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --expected-plan "$EXPECTED_PLAN" --select-only --output "$GITHUB_OUTPUT" --selection-report
        build/parent-qualification/host-selection.json
    - name: Require a complete host execution route
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      env:
        FULL_HOST: ${{ steps.host.outputs.full_host }}
        COMPLETE_RECEIPT: ${{ steps.host.outputs.complete_receipt }}
      run: |
        case "$FULL_HOST/$COMPLETE_RECEIPT" in
          true/true|true/false|false/false) ;;
          *) printf '%s\n' 'Missing or inconsistent parent host selection' >&2; exit 1 ;;
        esac
    - name: Install QML and portable C++ contract prerequisites
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.host.outputs.full_host == 'true')
      run: |
        set -euo pipefail
        sudo apt-get -o Acquire::Retries=4 update
        sudo apt-get -o Acquire::Retries=4 install --no-install-recommends -y \
          qml-module-qttest qtdeclarative5-dev-tools qt6-base-dev qt6-base-dev-tools libglm-dev \
          qtdeclarative5-dev qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 \
          qt6-declarative-dev qt6-declarative-dev-tools qt6-webchannel-dev libqt5webchannel5-dev \
          qml-module-qt-labs-folderlistmodel qml6-module-qt-labs-folderlistmodel \
          qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
          qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
          qml6-module-qtquick-templates qml6-module-qtquick-window \
          qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest
        pkg-config --print-errors --exists Qt5Quick Qt5WebChannel Qt5Network Qt6Quick Qt6WebChannel Qt6Network
    - name: Prepare isolated host evidence validators
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full')
      run: |
        # Ubuntu 24.04 restricts user namespaces through AppArmor. Permit
        # offline test sandboxes only on this disposable GitHub-hosted VM.
        # Tests still run as the runner user and must pass the isolation probe.
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare --user --map-root-user --net true
        python3 -m venv build/host-tests-env
        build/host-tests-env/bin/python -m pip install --disable-pip-version-check -r trusted/tests/requirements-host.txt
    - name: Run complete host qualification
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.host.outputs.complete_receipt == 'true')
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: build/host-tests-env/bin/python trusted/tools/test-evidence/run.py --candidate candidate --include-platform
        --timeout 240 --host-timeout 900 --junit build/test-results/parent-project-tests.xml --receipt build/parent-qualification/execution.json
    - name: Run independently selected parent host contracts
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.route.outputs.package_host_mode == 'full' && steps.host.outputs.complete_receipt
        == 'false')
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: build/host-tests-env/bin/python trusted/tools/repository-checks/host_selection.py --candidate candidate
        --event "$GITHUB_EVENT_PATH" --sha "$GITHUB_SHA" --expected-plan "$EXPECTED_PLAN" --junit build/test-results/parent-project-tests.xml
        --selection-report build/parent-qualification/host-selection.json
    - name: Create content-addressed qualification evidence
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.host.outputs.complete_receipt == 'true')
      env:
        PARENT_BRANCH: ${{ github.ref_name }}
        PARENT_COMMIT: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
        REPOSITORY_ID: ${{ github.event.repository.id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        RUN_ID: ${{ github.run_id }}
      run: build/host-tests-env/bin/python trusted/tools/sync-test-reuse/qualification.py --candidate candidate
        --execution-receipt build/parent-qualification/execution.json --repository "$REPOSITORY" --repository-id
        "$REPOSITORY_ID" --parent-branch "$PARENT_BRANCH" --commit "$PARENT_COMMIT" --run-id "$RUN_ID" --run-attempt
        "$RUN_ATTEMPT" --output build/parent-qualification/qualification.json
    - name: Upload immutable qualification evidence
      if: steps.reuse.outputs.shared_reused != 'true' && (steps.host.outputs.complete_receipt == 'true')
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: parent-qualification-${{ github.sha }}
        path: build/parent-qualification/qualification.json
        if-no-files-found: error
        retention-days: 4
    - name: Upload qualification test reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: parent-qualification-reports-${{ github.sha }}-${{ github.run_attempt }}
        path: |-
          build/test-results/
          candidate/build/test-results/
          build/parent-qualification/execution.json
          build/parent-qualification/host-selection.json

          build/parent-qualification/original-proof.json
        if-no-files-found: warn
        retention-days: 7
    - name: Check only affected tool dependencies and behavior
      if: steps.route.outputs.package_host_mode == 'tool-dependencies'
      env:
        EXPECTED_CANDIDATE: ${{ steps.route.outputs.package_candidate }}
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/package_checks.py run --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan
        "$EXPECTED_PLAN" --lane tool-dependencies
    - name: Check independently selected S3 package dependencies and behavior
      if: steps.route.outputs.package_set != '[]'
      env:
        EXPECTED_CANDIDATE: ${{ steps.route.outputs.package_candidate }}
        EXPECTED_PLAN: ${{ steps.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/package_checks.py run --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan
        "$EXPECTED_PLAN" --lane package-checks
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
'on':
  push:
    branches:
    - main
    - android-main
    - android-vr
    - apple-main
    paths-ignore:
    - '**/*.md'
