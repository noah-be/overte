      if: steps.protected.outputs.protected_executed == 'true'
    - name: Remove only the disposable account created here
      if: always() && steps.account.outputs.created == 'true'
      run: sudo -n /usr/sbin/userdel overte-ci-qualification
    name: Shared tests
    outputs:
      receipt_sha256: ${{ steps.protected.outputs.receipt_sha256 }}
      protected_executed: ${{ steps.protected.outputs.protected_executed }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
