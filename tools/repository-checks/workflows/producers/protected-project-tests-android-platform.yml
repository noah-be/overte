  project-results:
    if: always()
    needs:
    - route
    - project-tests
    - tool-dependencies
    - package-checks
    - platform-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_verified: ${{ steps.verify.outputs.package_verified }}
      package_candidate: ${{ steps.verify.outputs.package_candidate }}
      package_plan: ${{ steps.verify.outputs.package_plan }}
      package_lane: ${{ steps.verify.outputs.package_lane }}
    steps:
    - name: Check out trusted package policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
