            need(inventory.get('sha')==tree and inventory.get('truncated') is False and type(inventory.get('tree')) is list)
            name='tools/test-evidence/source_admission.py'
            entries=[row for row in inventory['tree'] if isinstance(row,dict) and row.get('path')==name]
            need(len(entries)==1 and entries[0].get('mode')=='100644' and entries[0].get('type')=='blob')
            root=Path('trusted').absolute()
            path=root/name
            current=Path(path.anchor)
            for part in path.parts[1:]:
                current/=part;need(not current.is_symlink())
            info=path.stat();need(stat.S_ISREG(info.st_mode) and not info.st_mode&0o111 and info.st_size<=1000000)
            body=path.read_bytes();need(len(body)<=1000000)
            need(hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entries[0].get('sha'))
            scope={'__name__':'protected_source_bootstrap','__file__':str(path)}
            exec(compile(body,str(path),'exec'),scope)
            scope['authenticate'](event,os.environ,scope['GitHubSource'](deadline=deadline),root)
            admitted=True
        except (ValueError,OSError,KeyError,TypeError,AttributeError,RuntimeError,subprocess.SubprocessError):
            pass
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('admitted='+str(admitted).lower()+'\n')
        print('Protected source commitment '+('admitted.' if admitted else 'unavailable; existing execution remains required.'))
        SOURCE_GUARD
    - name: Require the unchanged source commitment before publication
      env:
        SOURCE_ADMITTED: ${{ steps.protected-source.outputs.admitted }}
      run: test "$SOURCE_ADMITTED" = true
    - name: Validate native selected execution and original whole receipt
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")'
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py publish --candidate candidate
    - name: Publish the final canonical aggregate
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-producer-aggregate/aggregate.json
        if-no-files-found: error
        retention-days: 1
    outputs:
      documentation_verified: ${{ steps.publish.outputs.documentation_verified }}
      workflow_contracts_verified: ${{ steps.publish.outputs.workflow_contracts_verified }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
  platform-tests:
    name: Android platform tests
    needs: route
    if: needs.route.outputs.platform_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      verified: ${{ steps.execute.outputs.platform_verified }}
      partition: ${{ steps.execute.outputs.platform_plan }}
      required: ${{ steps.plan.outputs.platform_required }}
    steps:
    - name: Check out the authenticated platform controller
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
    - name: Check out exact platform candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Authenticate the protected base commitment before repository imports
      id: protected-source
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        /usr/bin/python3 -I -S -B - <<'SOURCE_GUARD'
        # Fixed native recipe bootstrap. No repository module is imported here.
        import hashlib, json, os, re, stat, subprocess, time, urllib.request
        from pathlib import Path

        deadline=time.monotonic()+45
        def need(value):
            if not value: raise ValueError('protected source unavailable')
        def unique(pairs):
            value={}
            for key,item in pairs:
                need(key not in value); value[key]=item
            return value
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, response, code, message, headers, target):
                raise ValueError('protected source redirect denied')
        def get(endpoint):
            request=urllib.request.Request('https://api.github.com/repos/noah-l-frank/overte/'+endpoint,
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='GET')
            remaining=deadline-time.monotonic();need(remaining>0)
            with urllib.request.build_opener(NoRedirect()).open(request,timeout=min(10,remaining)) as response:
                need(response.status==200 and response.geturl()==request.full_url)
                raw=response.read(16000001)
            need(len(raw)<=16000000 and time.monotonic()<=deadline)
            return json.loads(raw,object_pairs_hook=unique,parse_constant=lambda _: need(False))
        admitted=False
        try:
            targets={'main','android-main','android-phone','android-vr','android-vr-pico','apple-main','apple-ios'}
            need(os.environ.get('GITHUB_REPOSITORY')=='noah-l-frank/overte' and os.environ.get('GITHUB_REPOSITORY_ID')=='1319052603')
            event_path=Path(os.environ['GITHUB_EVENT_PATH'])
            need(not event_path.is_symlink() and event_path.is_file() and event_path.stat().st_size<=1000000)
            event=json.loads(event_path.read_bytes(),object_pairs_hook=unique)
            pr=event.get('pull_request')
            target=pr.get('base',{}).get('ref') if isinstance(pr,dict) else os.environ.get('GITHUB_REF','').removeprefix('refs/heads/')
            base=pr.get('base',{}).get('sha') if isinstance(pr,dict) else event.get('before')
            source=os.environ.get('GITHUB_SHA','')
            need(target in targets and type(base) is str and re.fullmatch('[0-9a-f]{40}',base) and re.fullmatch('[0-9a-f]{40}',source))
            if isinstance(pr,dict):
                number=event.get('number')
                need(os.environ.get('GITHUB_EVENT_NAME')=='pull_request' and type(number) is int and number>0
                    and pr.get('number')==number and os.environ.get('GITHUB_REF')=='refs/pull/'+str(number)+'/merge'
                    and os.environ.get('GITHUB_WORKFLOW_SHA')==source)
                merge=get('commits/refs/pull/'+str(number)+'/merge')
                parents=merge.get('parents')
                need(merge.get('sha')==source and type(parents) is list and len(parents)==2
                    and all(isinstance(parent,dict) for parent in parents)
                    and parents[1].get('sha')==pr.get('head',{}).get('sha'))
                base=parents[0].get('sha')
                need(type(base) is str and re.fullmatch('[0-9a-f]{40}',base))
            branch=get('branches/'+target)
            need(branch.get('protected') is True and branch.get('name')==target and branch.get('commit',{}).get('sha')==(base if isinstance(pr,dict) else source))
            commit=get('git/commits/'+base)
            tree=commit.get('tree',{}).get('sha')
            need(commit.get('sha')==base and type(tree) is str and re.fullmatch('[0-9a-f]{40}',tree))
            inventory=get('git/trees/'+tree+'?recursive=1')
            need(inventory.get('sha')==tree and inventory.get('truncated') is False and type(inventory.get('tree')) is list)
            name='tools/test-evidence/source_admission.py'
            entries=[row for row in inventory['tree'] if isinstance(row,dict) and row.get('path')==name]
            need(len(entries)==1 and entries[0].get('mode')=='100644' and entries[0].get('type')=='blob')
            root=Path('trusted').absolute()
            path=root/name
            current=Path(path.anchor)
            for part in path.parts[1:]:
                current/=part;need(not current.is_symlink())
            info=path.stat();need(stat.S_ISREG(info.st_mode) and not info.st_mode&0o111 and info.st_size<=1000000)
            body=path.read_bytes();need(len(body)<=1000000)
            need(hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest()==entries[0].get('sha'))
            scope={'__name__':'protected_source_bootstrap','__file__':str(path)}
            exec(compile(body,str(path),'exec'),scope)
            scope['authenticate'](event,os.environ,scope['GitHubSource'](deadline=deadline),root)
            admitted=True
        except (ValueError,OSError,KeyError,TypeError,AttributeError,RuntimeError,subprocess.SubprocessError):
            pass
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            output.write('admitted='+str(admitted).lower()+'\n')
        print('Protected source commitment '+('admitted.' if admitted else 'unavailable; existing execution remains required.'))
        SOURCE_GUARD
    - name: Require unchanged platform source admission
      env:
        ADMITTED: ${{ steps.protected-source.outputs.admitted }}
      run: test "$ADMITTED" = true
    - name: Independently derive the complete current platform inventory
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: /usr/bin/python3 -I -S -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")'
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py platform-plan --candidate "$GITHUB_WORKSPACE/candidate"
    - name: Set up platform Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Set up platform Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Set up platform Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Prepare fixed platform host prerequisites
      run: |-
        set -euo pipefail
        sudo -n /usr/bin/apt-get update
        sudo -n /usr/bin/apt-get install --no-install-recommends -y cmake ninja-build g++ make pkg-config jq
        if test "${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" = android-phone; then
          sudo -n /usr/bin/apt-get install --no-install-recommends -y qt6-base-dev qt6-base-dev-tools
        fi
        toolkit="$RUNNER_TEMP/android-platform-tools"
        mkdir "$toolkit"
        for tool in cmake ctest ninja; do ln -s "/usr/bin/$tool" "$toolkit/$tool"; done
        export PATH="$toolkit:$PATH"
        test -x /usr/bin/cmake && test -x /usr/bin/ctest && test -x /usr/bin/ninja
        # Preserve neutral-bootstrap's actual offline namespace check.
        sudo -n /usr/sbin/sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        python3 -m venv "$RUNNER_TEMP/android-platform-venv"
        "$RUNNER_TEMP/android-platform-venv/bin/python" -m pip install --disable-pip-version-check -r trusted/tests/requirements-host.txt
        printf '%s\n' "$toolkit" >> "$GITHUB_PATH"
        # No APK/SDK installation or application/device build. Phone NDK absence fails the controller.
      if: steps.plan.outputs.platform_required == 'true'
    - name: Execute and verify the complete Android platform inventory
      id: execute
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RUNNER_TEMP/android-platform-venv/bin/python" -I -B -c ''import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")''
        trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py platform --candidate "$GITHUB_WORKSPACE/candidate"'
      if: steps.plan.outputs.platform_required == 'true'
    - name: Upload platform diagnostics only
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: android-platform-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-platform-report/platform.xml
        if-no-files-found: warn
        retention-days: 7
'on':
  workflow_call:
    inputs:
      dependency_projects:
        type: string
        default: ''
        description: Exact tool projects selected by the trusted repository router
      expected_candidate:
        type: string
        default: ''
      expected_package_plan:
        type: string
        default: ''
    outputs:
      documentation_verified:
        value: ${{ jobs.producer-publication.outputs.documentation_verified || 'false' }}
      workflow_contracts_verified:
        value: ${{ jobs.producer-publication.outputs.workflow_contracts_verified || 'false' }}
      package_verified:
        value: ${{ jobs.project-results.outputs.package_verified }}
      package_candidate:
        value: ${{ jobs.project-results.outputs.package_candidate }}
      package_plan:
        value: ${{ jobs.project-results.outputs.package_plan }}
      package_lane:
        value: ${{ jobs.project-results.outputs.package_lane }}
  push:
    branches:
    - android-phone
    - android-vr-pico
    - apple-ios
    - ci/**
    - test/**
    paths-ignore:
    - '**/*.md'
  workflow_dispatch: null
