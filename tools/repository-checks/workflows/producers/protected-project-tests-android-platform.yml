    - name: Verify fallback runner prerequisites
      if: needs.route.outputs.protected_full == 'true' && steps.protected-source.outputs.admitted == 'true' && steps.host.outputs.full_host
        == 'false' && steps.protected.outputs.protected_executed != 'true'
      run: |
        set -euo pipefail
        command -v bash
        command -v jq
        command -v cmake
        command -v ninja
        command -v ctest
        python3 --version
        node --version
        java -version
    - name: Prepare isolated host evidence validators
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: |
        # Ubuntu 24.04 restricts user namespaces through AppArmor. Permit
        # offline test sandboxes only on this disposable GitHub-hosted VM.
        # Tests still run as the runner user and must pass the isolation probe.
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare --user --map-root-user --net true
        python3 -m venv build/host-tests-env
        build/host-tests-env/bin/python -m pip install --disable-pip-version-check -r candidate/tests/requirements-host.txt
      if: steps.protected.outputs.protected_executed != 'true'
    - name: Run independently selected host contracts
      env:
        EXPECTED_PLAN: ${{ needs.route.outputs.package_plan }}
        PLATFORM_REQUIRED: ${{ needs.route.outputs.platform_required }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if test "$PLATFORM_REQUIRED" = true; then
          build/host-tests-env/bin/python -I -B -c 'import runpy,sys;sys.path.insert(0,sys.argv.pop(1));runpy.run_path(sys.argv.pop(1),run_name="__main__")' trusted/tools/test-evidence trusted/tools/test-evidence/producer_workflow.py fallback-common --candidate "$GITHUB_WORKSPACE/candidate"
        else
          build/host-tests-env/bin/python -B trusted/tools/repository-checks/host_selection.py \
            --candidate candidate --event "$GITHUB_EVENT_PATH" --sha "$GITHUB_SHA" \
            --expected-plan "$EXPECTED_PLAN" --junit build/test-results/project-tests.xml
