# Prospective protected producer; native installation and execution evidence remain required.
name: Shared project CI
permissions:
  contents: read
concurrency:
  group: shared-project-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_candidate: ${{ steps.plan.outputs.package_candidate }}
      package_plan: ${{ steps.plan.outputs.package_plan }}
      package_host_mode: ${{ steps.plan.outputs.package_host_mode }}
      package_tool_projects: ${{ steps.plan.outputs.package_tool_projects }}
      package_set: ${{ steps.plan.outputs.package_set }}
      protected_full: ${{ steps.producer.outputs.protected_full }}
    steps:
    - name: Check out trusted package policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          .github
          tools/repository-checks
          tools/test-evidence
          tools/sync-test-reuse
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Recompute the exact trusted package and host plan
      id: plan
      env:
        EXPECTED_CANDIDATE: ${{ inputs.expected_candidate }}
        EXPECTED_PLAN: ${{ inputs.expected_package_plan }}
        DEPENDENCY_PROJECTS: ${{ inputs.dependency_projects }}
      run: python3 trusted/tools/repository-checks/package_checks.py plan --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan "$EXPECTED_PLAN"
        --expected-projects "$DEPENDENCY_PROJECTS"
    - name: Prepare the protected original descriptor
      id: producer
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 trusted/tools/test-evidence/producer_workflow.py descriptor --candidate candidate
    - name: Publish the early canonical descriptor
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ci-descriptor-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-producer-descriptor/descriptor.json
        if-no-files-found: error
        retention-days: 1
      if: steps.producer.outputs.protected_full == 'true'
    name: Publish producer descriptor
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
  project-tests:
    needs: route
    if: needs.route.outputs.package_host_mode == 'full'
    runs-on: ubuntu-24.04
    env:
      OVERTE_QML_TEST_RUNNER: /usr/lib/qt6/bin/qmltestrunner
    timeout-minutes: 45
    steps:
    - name: Check out trusted host selection policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          .github
          tools/repository-checks
          tools/test-evidence
          tools/sync-test-reuse
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - name: Independently select affected host contracts
      id: host
      env:
        EXPECTED_PLAN: ${{ needs.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/host_selection.py --candidate candidate --event "$GITHUB_EVENT_PATH" --sha
        "$GITHUB_SHA" --expected-plan "$EXPECTED_PLAN" --select-only --output "$GITHUB_OUTPUT"
    - name: Set up Java
      if: needs.route.outputs.protected_full != 'true' || steps.host.outputs.full_host != 'false'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify runner prerequisites
      if: needs.route.outputs.protected_full != 'true' || steps.host.outputs.full_host != 'false'
      run: |
        set -euo pipefail
        command -v bash
        command -v jq
        command -v cmake
        command -v ninja
        command -v ctest
        python3 --version
        node --version
        java -version
    - name: Install QML and portable C++ contract prerequisites
      if: steps.host.outputs.full_host == 'true'
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          cmake ninja-build \
          qml-module-qttest qtdeclarative5-dev-tools qt6-base-dev qt6-base-dev-tools libglm-dev \
          qtdeclarative5-dev qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 \
          qt6-declarative-dev qt6-declarative-dev-tools qt6-webchannel-dev libqt5webchannel5-dev \
          qml-module-qt-labs-folderlistmodel qml6-module-qt-labs-folderlistmodel \
          qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
          qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
          qml6-module-qtquick-templates qml6-module-qtquick-window \
          qml6-module-qt-labs-settings qml6-module-qtquick-dialogs qml6-module-qttest
        pkg-config --print-errors --exists Qt5Quick Qt5WebChannel Qt5Network Qt6Quick Qt6WebChannel Qt6Network
        for tool in bash cmake ctest c++ git jq ninja pkg-config unshare; do
          test -x "/usr/bin/$tool" || { printf 'Missing fixed system prerequisite: %s\n' "$tool" >&2; exit 1; }
        done
    - name: Prepare the protected trusted host environment
      if: needs.route.outputs.protected_full == 'true' && steps.host.outputs.full_host != 'false'
      run: |
        test ! -e /opt/overte-ci
        sudo -n /usr/bin/install -d -m 755 -o "$UID" /opt/overte-ci
        python3 -m venv /opt/overte-ci/venv
        /opt/overte-ci/venv/bin/python -m pip install --disable-pip-version-check -r trusted/tests/requirements-host.txt
        # Freeze only the actual versioned prepared installations. The
        # namespace never receives the remainder of the hosted tool cache.
        PYTHON_ROOT="$(python3 -c 'import sys; print(sys.base_prefix)')"
        NODE_ROOT="$(node -p 'require("path").dirname(require("path").dirname(process.execPath))')"
        test -n "$JAVA_HOME"
        # The hosted Java cache is an alias to its actual system JDK.
        JAVA_HOME="$(readlink -e -- "$JAVA_HOME")"
        python3 -I - "$PYTHON_ROOT" "$NODE_ROOT" "$JAVA_HOME" <<'PYROOTS'
        from pathlib import Path
        import re
        import sys
        roots = [Path('/opt/overte-ci'), *(Path(value) for value in sys.argv[1:])]
        assert len(roots) == 4 and len(set(roots)) == 4, 'ambiguous prepared tool roots'
        for index, path in enumerate(roots):
            assert path.is_absolute() and path.is_dir() and not path.is_symlink()
            assert path == path.resolve(strict=True), 'prepared tool root contains an alias'
            if index in (1, 2):
                assert path.is_relative_to('/opt/hostedtoolcache') and len(path.parts) == 6
                assert path.parts[3] == ('Python' if index == 1 else 'node')
                assert re.fullmatch(r'3[.]12[.][0-9]+' if index == 1 else r'22[.][0-9]+[.][0-9]+', path.parts[4])
            elif index == 3:
                assert (path == Path('/usr/lib/jvm/temurin-17-jdk-amd64')
                        or path.is_relative_to('/opt/hostedtoolcache') and len(path.parts) == 6
                        and path.parts[3] == 'Java_Temurin-Hotspot_jdk'
                        and re.fullmatch(r'17[.][0-9]+[.][0-9]+-[0-9]+', path.parts[4])
                        and path.parts[5] == 'x64')
        assert all(not left.is_relative_to(right) and not right.is_relative_to(left)
                   for i, left in enumerate(roots) for right in roots[i + 1:])
        PYROOTS
        sudo -n /usr/bin/chown -hR root:root -- /opt/overte-ci "$PYTHON_ROOT" "$NODE_ROOT" "$JAVA_HOME"
        # Preserve executable/read bits and do not follow descendant aliases.
        sudo -n /usr/bin/chmod -R go-w -- /opt/overte-ci "$PYTHON_ROOT" "$NODE_ROOT" "$JAVA_HOME"
    - name: Prepare the protected CI37 host environment
      if: needs.route.outputs.protected_full == 'true' && steps.host.outputs.full_host == 'false'
      run: |
        set -euo pipefail
        missing=()
        if ! test -x /usr/bin/cmake || ! test -x /usr/bin/ctest; then missing+=(cmake); fi
        if ! test -x /usr/bin/ninja; then missing+=(ninja-build); fi
        if ! test -x /usr/bin/make || ! test -x /usr/bin/gmake; then missing+=(make); fi
        if ! test -x /usr/bin/g++ || ! test -x /usr/bin/gcc || ! test -x /usr/bin/c++ || ! test -x /usr/bin/cc; then missing+=(g++); fi
        if ((${#missing[@]})); then
          sudo -n /usr/bin/apt-get update
          sudo -n /usr/bin/apt-get install --no-install-recommends -y "${missing[@]}"
        fi
        for tool in bash cmake ctest c++ cc gcc g++ git jq ninja make gmake as ld ar ranlib sha256sum env ldd dpkg-query unshare; do
          test -x "/usr/bin/$tool" || { printf 'Missing fixed system prerequisite: %s\n' "$tool" >&2; exit 1; }
        done
        test ! -e /opt/overte-ci
        sudo -n /usr/bin/install -d -m 755 -o "$UID" /opt/overte-ci
        python3 -m venv /opt/overte-ci/venv
        /opt/overte-ci/venv/bin/python -m pip install --disable-pip-version-check -r trusted/tests/requirements-host.txt
        PYTHON_ROOT="$(python3 -c 'import sys; print(sys.base_prefix)')"
        NODE_ROOT="$(node -p 'require("path").dirname(require("path").dirname(process.execPath))')"
        python3 -I - "$PYTHON_ROOT" "$NODE_ROOT" <<'PYROOTS'
        from pathlib import Path
        import re
        import sys
        roots = [Path('/opt/overte-ci'), *(Path(value) for value in sys.argv[1:])]
        assert len(roots) == 3 and len(set(roots)) == 3, 'ambiguous CI37 prepared tool roots'
        for index, path in enumerate(roots):
            assert path.is_absolute() and path.is_dir() and not path.is_symlink()
            assert path == path.resolve(strict=True), 'CI37 prepared tool root contains an alias'
            if index:
                assert path.is_relative_to('/opt/hostedtoolcache') and len(path.parts) == 6
                assert path.parts[3] == ('Python' if index == 1 else 'node')
                assert re.fullmatch(r'3[.]12[.][0-9]+' if index == 1 else r'22[.][0-9]+[.][0-9]+', path.parts[4])
        assert all(not left.is_relative_to(right) and not right.is_relative_to(left)
                   for i, left in enumerate(roots) for right in roots[i + 1:])
        PYROOTS
        sudo -n /usr/bin/chown -hR root:root -- /opt/overte-ci "$PYTHON_ROOT" "$NODE_ROOT"
        sudo -n /usr/bin/chmod -R go-w -- /opt/overte-ci "$PYTHON_ROOT" "$NODE_ROOT"
    - name: Verify protected CI37 runner prerequisites
      if: needs.route.outputs.protected_full == 'true' && steps.host.outputs.full_host == 'false'
      run: |
        set -euo pipefail
        command -v bash
        command -v jq
        command -v cmake
        command -v ninja
        command -v ctest
        python3 --version
        node --version
    - name: Ensure the required namespace tool is available
      run: |
        set -euo pipefail
        if ! test -x /usr/bin/bwrap; then
          sudo -n /usr/bin/apt-get update
          sudo -n /usr/bin/apt-get install --yes --no-install-recommends bubblewrap
        fi
      if: needs.route.outputs.protected_full == 'true'
    - name: Provision the fixed disposable diagnostic account
      id: account
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$ImageOS" = ubuntu24
        if getent passwd overte-ci-qualification >/dev/null; then
          echo 'The fixed disposable account already exists; host is unavailable.' >&2
          exit 1
        fi
        sudo -n /usr/sbin/useradd --system --no-create-home --shell /usr/sbin/nologin overte-ci-qualification
        echo 'created=true' >> "$GITHUB_OUTPUT"
        # Match the existing disposable Ubuntu host namespace prerequisite.
        # No application, SDK or device builds are fetched or launched.
        sudo -n /usr/sbin/sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      if: needs.route.outputs.protected_full == 'true'
    - name: Execute the selected protected shared owner
      id: protected
      if: needs.route.outputs.protected_full == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        NODE_ROOT="$(node -p 'require("path").dirname(require("path").dirname(process.execPath))')"
        sudo -n /usr/bin/systemd-run --wait --pipe --collect --quiet --service-type=exec \
          --expand-environment=no --property=Delegate=yes \
          --property=KillMode=control-group --property=TimeoutStopSec=10s --property=SendSIGKILL=yes \
          --property=UMask=0022 --property="RuntimeMaxSec=2400s" \
          --unit="overte-shared-qualification-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.service" \
          /usr/bin/env -i \
          PATH=/usr/bin:/bin LANG=C.UTF-8 SUDO_UID="$UID" \
          GITHUB_ACTIONS=true GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" \
          GITHUB_REF="$GITHUB_REF" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_SHA="$GITHUB_SHA" \
          GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
          GITHUB_BASE_REF="$GITHUB_BASE_REF" GITHUB_HEAD_REF="$GITHUB_HEAD_REF" \
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" \
          RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" GH_TOKEN="$GH_TOKEN" \
          QUALIFY_NODE_ROOT="$NODE_ROOT" QUALIFY_JAVA_HOME="${JAVA_HOME:-}" \
          /usr/bin/python3 "$GITHUB_WORKSPACE/trusted/tools/test-evidence/producer_workflow.py" shared --candidate "$GITHUB_WORKSPACE/candidate"
    - name: Set up Java for pre-execution fallback
      if: needs.route.outputs.protected_full == 'true' && steps.host.outputs.full_host == 'false' && steps.protected.outputs.protected_executed != 'true'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
    - name: Verify fallback runner prerequisites
      if: needs.route.outputs.protected_full == 'true' && steps.host.outputs.full_host == 'false' && steps.protected.outputs.protected_executed != 'true'
      run: |
        set -euo pipefail
        command -v bash
        command -v jq
        command -v cmake
        command -v ninja
        command -v ctest
        python3 --version
        node --version
        java -version
    - name: Prepare isolated host evidence validators
      env:
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: |
        # Ubuntu 24.04 restricts user namespaces through AppArmor. Permit
        # offline test sandboxes only on this disposable GitHub-hosted VM.
        # Tests still run as the runner user and must pass the isolation probe.
        test "$RUNNER_ENVIRONMENT" = github-hosted
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        unshare --user --map-root-user --net true
        python3 -m venv build/host-tests-env
        build/host-tests-env/bin/python -m pip install --disable-pip-version-check -r candidate/tests/requirements-host.txt
      if: steps.protected.outputs.protected_executed != 'true'
    - name: Run independently selected host contracts
      env:
        EXPECTED_PLAN: ${{ needs.route.outputs.package_plan }}
      run: |
        set -euo pipefail
        build/host-tests-env/bin/python trusted/tools/repository-checks/host_selection.py \
          --candidate candidate --event "$GITHUB_EVENT_PATH" --sha "$GITHUB_SHA" \
          --expected-plan "$EXPECTED_PLAN" --junit build/test-results/project-tests.xml
      if: steps.protected.outputs.protected_executed != 'true'
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: project-test-results
        path: |
          build/test-results/project-tests.xml
          candidate/build/test-results/device-e2e-control-plane.xml
          candidate/build/test-results/device-self-tests.json
        if-no-files-found: warn
        retention-days: 7
    - name: Preserve only the finished protected receipt
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ci-protected-receipt-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-protected-receipt/receipt.json
        if-no-files-found: error
        retention-days: 1
      if: steps.protected.outputs.protected_executed == 'true'
    - name: Remove only the disposable account created here
      if: always() && steps.account.outputs.created == 'true'
      run: sudo -n /usr/sbin/userdel overte-ci-qualification
    name: Shared tests
    outputs:
      receipt_sha256: ${{ steps.protected.outputs.receipt_sha256 }}
      protected_executed: ${{ steps.protected.outputs.protected_executed }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
  tool-dependencies:
    needs: route
    if: needs.route.outputs.package_host_mode == 'tool-dependencies'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      package_verified: ${{ steps.run.outputs.package_verified }}
      package_candidate: ${{ steps.run.outputs.package_candidate }}
      package_plan: ${{ steps.run.outputs.package_plan }}
      package_lane: ${{ steps.run.outputs.package_lane }}
    steps:
    - name: Check out trusted package policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          .github
          tools/repository-checks
          tools/test-evidence
          tools/sync-test-reuse
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - name: Execute only the independently selected package owner
      id: run
      env:
        EXPECTED_CANDIDATE: ${{ needs.route.outputs.package_candidate }}
        EXPECTED_PLAN: ${{ needs.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/package_checks.py run --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan "$EXPECTED_PLAN"
        --lane tool-dependencies
  package-checks:
    needs: route
    if: needs.route.outputs.package_set != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      package_verified: ${{ steps.run.outputs.package_verified }}
      package_candidate: ${{ steps.run.outputs.package_candidate }}
      package_plan: ${{ steps.run.outputs.package_plan }}
      package_lane: ${{ steps.run.outputs.package_lane }}
    steps:
    - name: Check out trusted package policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          .github
          tools/repository-checks
          tools/test-evidence
          tools/sync-test-reuse
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - name: Execute only the independently selected package owner
      id: run
      env:
        EXPECTED_CANDIDATE: ${{ needs.route.outputs.package_candidate }}
        EXPECTED_PLAN: ${{ needs.route.outputs.package_plan }}
      run: python3 trusted/tools/repository-checks/package_checks.py run --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --expected-candidate "$EXPECTED_CANDIDATE" --expected-plan "$EXPECTED_PLAN"
        --lane package-checks
  project-results:
    if: always()
    needs:
    - route
    - project-tests
    - tool-dependencies
    - package-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      package_verified: ${{ steps.verify.outputs.package_verified }}
      package_candidate: ${{ steps.verify.outputs.package_candidate }}
      package_plan: ${{ steps.verify.outputs.package_plan }}
      package_lane: ${{ steps.verify.outputs.package_lane }}
    steps:
    - name: Check out trusted package policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          .github
          tools/repository-checks
          tools/test-evidence
          tools/sync-test-reuse
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Require every independently selected host and package check
      id: verify
      env:
        CHECK_RESULTS: ${{ toJSON(needs) }}
      run: python3 trusted/tools/repository-checks/package_checks.py verify --candidate candidate --event "$GITHUB_EVENT_PATH"
        --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT" --needs-json "$CHECK_RESULTS"
  producer-publication:
    name: Publish final producer ${{ needs.project-tests.outputs.receipt_sha256 }}
    needs:
    - route
    - project-tests
    if: needs.route.outputs.protected_full == 'true' && needs.project-tests.outputs.protected_executed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Check out trusted package policy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: trusted
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |-
          .github
          tools/repository-checks
          tools/test-evidence
          tools/sync-test-reuse
          tools/sbom
          tools/branch-policy/check.py
          tools/native-tests/check.py
          tests/run-project-tests.py
          tests/platform-profile.json
          tests/requirements-host.txt
          tests/requirements-repository.txt
    - name: Check out the exact candidate without credentials
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: candidate
        fetch-depth: 2
        persist-credentials: false
    - name: Validate native selected execution and original whole receipt
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 trusted/tools/test-evidence/producer_workflow.py publish --candidate candidate
    - name: Publish the final canonical aggregate
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ci-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-producer-aggregate/aggregate.json
        if-no-files-found: error
        retention-days: 1
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
'on':
  workflow_call:
    inputs:
      dependency_projects:
        type: string
        default: ''
        description: Exact tool projects selected by the trusted repository router
      expected_candidate:
        type: string
        default: ''
      expected_package_plan:
        type: string
        default: ''
    outputs:
      package_verified:
        value: ${{ jobs.project-results.outputs.package_verified }}
      package_candidate:
        value: ${{ jobs.project-results.outputs.package_candidate }}
      package_plan:
        value: ${{ jobs.project-results.outputs.package_plan }}
      package_lane:
        value: ${{ jobs.project-results.outputs.package_lane }}
  push:
    branches:
    - android-phone
    - android-vr-pico
    - apple-ios
    - ci/**
    - test/**
    paths-ignore:
    - '**/*.md'
  workflow_dispatch: null
