<!DOCTYPE html>
<html lang="en">
	<head>
		<script type="text/javascript">
		document.addEventListener("DOMContentLoaded", function () {
			var audio = document.querySelector("body > audio");
			if (window.EventBridge !== undefined) {
	        	EventBridge.scriptEventReceived.connect(function(data) {
	        		var myData = JSON.parse(data);
	        		if (myData.action == "changeStream") {
					audio.setAttribute("src", myData.stream);
	        		}
	        		if (myData.action == "changeVolume") {
					audio.volume = myData.volume;
	        		}
	        	});
	    	}
	   		EventBridge.emitWebEvent("loaded");
		});
		</script>
	</head>

	<body>
		<audio controls src="" controls autoplay></audio>
	</body>
</html>
